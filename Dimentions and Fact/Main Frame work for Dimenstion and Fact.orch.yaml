        updateOutputMessage: "Row are Updated: ${jv_updated_rows}\r\nRows are Inseted:\
          \ ${jv_inserted_rows}\r\n"
        updateScalarVariables:
    t_Stg_Customer_to_Dim_Customer_Scd1:
