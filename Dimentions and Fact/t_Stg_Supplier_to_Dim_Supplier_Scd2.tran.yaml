type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_SUPPLIER_SCD2:
      type: "table-input"
      parameters:
        componentName: "STG_SUPPLIER_SCD2"
        database: "EDW_LAB"
        schema: "STAGE_SCHEMA"
        targetTable: "STAGE_SUPPLIER_SCD2"
        columnNames:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        - "START_TIME"
        timeOffset:
    Detect Changes:
      type: "detect-changes"
      sources:
      - "Active Supplier"
      - "Aviod Duplicate"
      parameters:
        componentName: "Detect Changes"
        masterTable: "Active Supplier"
        matchKeys:
        - "S_SUPPKEY"
        compareColumns:
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        outputColumnMapping:
        - - "compare_S_NAME"
          - "compare_S_NAME"
        - - "compare_S_ADDRESS"
          - "compare_S_ADDRESS"
        - - "compare_S_NATIONKEY"
          - "compare_S_NATIONKEY"
        - - "compare_S_PHONE"
          - "compare_S_PHONE"
        - - "compare_S_ACCTBAL"
          - "compare_S_ACCTBAL"
        - - "compare_S_COMMENT"
          - "compare_S_COMMENT"
        - - "master_S_SRGKEY"
          - "master_S_SRGKEY"
        indicatorColumn: "Indicator"
    New data:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "New data"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "N"
        combineCondition: "Or"
    update:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "update"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "And"
    DIM_SUPPLIER_INSERT:
      type: "table-output"
      sources:
      - "Update Time"
      parameters:
        componentName: "DIM_SUPPLIER_INSERT"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "S_SUPPKEY"
          - "S_SUPPKEY"
        - - "compare_S_NAME"
          - "S_NAME"
        - - "compare_S_ADDRESS"
          - "S_ADDRESS"
        - - "compare_S_NATIONKEY"
          - "S_NATIONKEY"
        - - "compare_S_PHONE"
          - "S_PHONE"
        - - "compare_S_ACCTBAL"
          - "S_ACCTBAL"
        - - "compare_S_ACCTBAL"
          - "S_COMMENT"
        - - "LOAD_TIME_V"
          - "S_LOAD_TIME"
        - - "END_TIME_IN_V"
          - "S_END_TIME"
        - - "ACTIVE_FLAG"
          - "S_ACTIVE_FLAG"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowCount}"
    Update Time:
      type: "calculator"
      sources:
      - "New data"
      parameters:
        componentName: "Update Time"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "LOAD_TIME_V"
        - - "NULL"
          - "END_TIME_IN_V"
        - - "'Y'"
          - "ACTIVE_FLAG"
    DIM_SUPPLIER_SCD2 UPDATE:
      type: "table-update"
      sources:
      - "Update Time Old Record"
      parameters:
        componentName: "DIM_SUPPLIER_SCD2 UPDATE"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"master_S_SRGKEY\"=\"target\".\"S_SRGKEY\""
          - "Case"
        whenMatched:
        - - "\"input\".\"master_S_SRGKEY\"=\"target\".\"S_SRGKEY\""
          - "Update"
        updateMapping:
        - - "END_TIME_OLD"
          - "S_END_TIME"
        - - "AVTIVE_FLAG"
          - "S_ACTIVE_FLAG"
        includeNotMatched: "No"
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowsInserted}"
        - - "jv_updated_rows"
          - "${sysvar.thisComponent.rowsUpdated}"
    Update Time Old Record:
      type: "calculator"
      sources:
      - "update"
      parameters:
        componentName: "Update Time Old Record"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "END_TIME_OLD"
        - - "'N'"
          - "AVTIVE_FLAG"
    DIM SUPPLIER:
      type: "table-input"
      parameters:
        componentName: "DIM SUPPLIER"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        columnNames:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        - "S_SRGKEY"
        - "S_ACTIVE_FLAG"
        timeOffset:
    Active Supplier:
      type: "filter"
      sources:
      - "DIM SUPPLIER"
      parameters:
        componentName: "Active Supplier"
        filterConditions:
        - - "S_ACTIVE_FLAG"
          - "Is"
          - "Equal to"
          - "TRUE"
        combineCondition: "And"
    Aviod Duplicate:
      type: "distinct"
      sources:
      - "STG_SUPPLIER_SCD2"
      parameters:
        componentName: "Aviod Duplicate"
        columns:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
  variables:
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "Failed Message in the child"
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
