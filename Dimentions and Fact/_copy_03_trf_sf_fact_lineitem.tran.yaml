    DIM_SUPPLIER_SCD2:
      position:
        x: -770
        "y": -160
      tempMetlId: 3
    STAGE_LINEITEM:
      position:
        x: -770
        "y": -420
      tempMetlId: 4
    Active orders:
      position:
        x: -450
        "y": -250
      tempMetlId: 5
    Surrogate Keys:
      position:
        x: -230
