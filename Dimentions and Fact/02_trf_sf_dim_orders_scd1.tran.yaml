type: "transformation"
version: "1.0"
pipeline:
  components:
    STAGE_ORDERS:
      type: "table-input"
      parameters:
        componentName: "STAGE_ORDERS"
        database: "EDW_LAB"
        schema: "STAGE_SCHEMA"
        targetTable: "STAGE_ORDERS"
        columnNames:
        - "O_ORDERKEY"
        - "O_CUSTKEY"
        - "O_ORDERSTATUS"
        - "O_TOTALPRICE"
        - "O_ORDERDATE"
        - "O_ORDERPRIORITY"
        - "O_CLERK"
        - "O_SHIPPRIORITY"
        - "O_COMMENT"
        - "LOAD_DATE"
        timeOffset:
    Update current load time:
      type: "calculator"
      sources:
      - "STAGE_ORDERS"
      parameters:
        componentName: "Update current load time"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "v_load_time"
    DIM_ORDERS_SCD1:
      type: "table-update"
      sources:
      - "Update current load time"
      parameters:
        componentName: "DIM_ORDERS_SCD1"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_ORDERS_SCD1"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"O_ORDERKEY\"=\"target\".\"O_ORDERKEY\""
          - "Case"
        whenMatched:
        - - "\"input\".\"O_ORDERKEY\"=\"target\".\"O_ORDERKEY\""
          - "Update"
        updateMapping:
        - - "O_ORDERSTATUS"
          - "O_ORDERSTATUS"
        includeNotMatched: "Yes"
        insertMapping:
        - - "O_ORDERKEY"
          - "O_ORDERKEY"
        - - "O_CUSTKEY"
          - "O_CUSTKEY"
        - - "O_ORDERSTATUS"
          - "O_ORDERSTATUS"
        - - "O_TOTALPRICE"
          - "O_TOTALPRICE"
        - - "O_ORDERDATE"
          - "O_ORDERDATE"
        - - "O_ORDERPRIORITY"
          - "O_ORDERPRIORITY"
        - - "O_CLERK"
          - "O_CLERK"
        - - "O_SHIPPRIORITY"
          - "O_SHIPPRIORITY"
        - - "O_COMMENT"
          - "O_COMMENT"
        - - "v_load_time"
          - "O_LOAD_TIME"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowsInserted}"
        - - "jv_updated_rows"
          - "${sysvar.thisComponent.rowsUpdated}"
  variables:
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
design:
  components:
    STAGE_ORDERS:
      position:
        x: -220
        "y": -10
      tempMetlId: 1
    Update current load time:
      position:
        x: -60
        "y": -10
      tempMetlId: 6
    DIM_ORDERS_SCD1:
      position:
        x: 100
        "y": -10
      tempMetlId: 7
