type: "transformation"
version: "1.0"
pipeline:
  components:
    STAGE_CUSTOMER_SCD2:
      type: "table-input"
      parameters:
        componentName: "STAGE_CUSTOMER_SCD2"
        database: "EDW_LAB"
        schema: "STAGE_SCHEMA"
        targetTable: "STAGE_CUSTOMER_SCD2"
        columnNames:
        - "C_CUSTKEY"
        - "C_NAME"
        - "C_ADDRESS"
        - "C_NATIONKEY"
        - "C_PHONE"
        - "C_ACCTBAL"
        - "C_MKTSEGMENT"
        - "C_COMMENT"
        - "START_TIME"
        timeOffset:
    DIM_CUSTOMER_SCD2:
      type: "table-input"
      parameters:
        componentName: "DIM_CUSTOMER_SCD2"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_CUSTOMER_SCD2"
        columnNames:
        - "C_CUSTKEY"
        - "C_NAME"
        - "C_ADDRESS"
        - "C_NATIONKEY"
        - "C_PHONE"
        - "C_ACCTBAL"
        - "C_MKTSEGMENT"
        - "C_COMMENT"
        - "C_LOAD_TIME"
        - "C_END_TIME"
        - "C_ACTIVE_FLAG"
        - "C_SRGKEY"
        timeOffset:
    Filter:
      type: "filter"
      sources:
      - "DIM_CUSTOMER_SCD2"
      parameters:
        componentName: "Filter"
        filterConditions:
        - - "C_END_TIME"
          - "Is"
          - "Null"
          - ""
        combineCondition: "And"
    Detect Changes:
      type: "detect-changes"
      sources:
      - "Filter"
      - "STAGE_CUSTOMER_SCD2"
      parameters:
        componentName: "Detect Changes"
        masterTable: "Filter"
        matchKeys:
        - "C_CUSTKEY"
        compareColumns:
        - "C_CUSTKEY"
        outputColumnMapping:
        - - "master_C_SRGKEY"
          - "master_C_SRGKEY"
        - - "compare_C_CUSTKEY"
          - "compare_C_CUSTKEY"
        - - "compare_C_NAME"
          - "c_name"
        - - "compare_C_ADDRESS"
          - "c_address"
        - - "compare_C_NATIONKEY"
          - "c_nation_key"
        - - "compare_C_PHONE"
          - "compare_C_PHONE"
        - - "compare_C_ACCTBAL"
          - "compare_C_ACCTBAL"
        - - "compare_C_MKTSEGMENT"
          - "compare_C_MKTSEGMENT"
        - - "compare_C_COMMENT"
          - "compare_C_COMMENT"
        indicatorColumn: "Indicator"
    Filter 2:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "Filter 2"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "N"
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "Or"
    Filter 3:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "Filter 3"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "And"
    Calculator 2:
      type: "calculator"
      sources:
      - "Filter 3"
      parameters:
        componentName: "Calculator 2"
        includeInputColumns: "Yes"
        calculations:
        - - "current_timestamp()"
          - "OLD_end_time"
        - - "'N'"
          - "OLD_FLG"
        - - "NULL"
          - "NEW_END_TIME"
        - - "CURRENT_TIMESTAMP()"
          - "LOAD_TIME"
        - - "'Y'"
          - "NEW_FLG"
        - - "\"master_C_SRGKEY\" +1"
          - "Mex_SRGKEY"
    DIM_CUSTOMER_SCD2 3:
      type: "table-update"
      sources:
      - "Calculator 2"
      parameters:
        componentName: "DIM_CUSTOMER_SCD2 3"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_CUSTOMER_SCD2"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"master_C_SRGKEY\"=\"target\".\"C_SRGKEY\""
          - "Case"
        whenMatched:
        - - "\"input\".\"master_C_SRGKEY\"=\"target\".\"C_SRGKEY\" and \"target\"\
            .\"C_ACTIVE_FLAG\"=TRUE"
          - "Update"
        updateMapping:
        - - "OLD_end_time"
          - "C_END_TIME"
        - - "OLD_FLG"
          - "C_ACTIVE_FLAG"
        includeNotMatched: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Calculator:
      type: "calculator"
      sources:
      - "Filter 2"
      parameters:
        componentName: "Calculator"
        includeInputColumns: "Yes"
        calculations:
        - - "NULL"
          - "NEW_END_TIME"
        - - "NULL"
          - "NEW_LOAD_TIME"
        - - "'Y'"
          - "ACTIVE_FLG"
    DIM_CUSTOMER_SCD2 2:
      type: "table-output"
      sources:
      - "Calculator"
      parameters:
        componentName: "DIM_CUSTOMER_SCD2 2"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_CUSTOMER_SCD2"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "C_CUSTKEY"
          - "C_CUSTKEY"
        - - "c_name"
          - "C_NAME"
        - - "c_address"
          - "C_ADDRESS"
        - - "c_nation_key"
          - "C_NATIONKEY"
        - - "compare_C_PHONE"
          - "C_PHONE"
        - - "compare_C_ACCTBAL"
          - "C_ACCTBAL"
        - - "compare_C_MKTSEGMENT"
          - "C_MKTSEGMENT"
        - - "compare_C_COMMENT"
          - "C_COMMENT"
        - - "NEW_LOAD_TIME"
          - "C_LOAD_TIME"
        - - "NEW_END_TIME"
          - "C_END_TIME"
        - - "ACTIVE_FLG"
          - "C_ACTIVE_FLAG"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
