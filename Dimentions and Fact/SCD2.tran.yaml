    Filter 2:
      position:
        x: 160
        "y": -70
      tempMetlId: 6
    Filter 3:
      position:
        x: 170
        "y": 30
      tempMetlId: 7
    Calculator 2:
      position:
        x: 340
        "y": 20
      tempMetlId: 10
    DIM_CUSTOMER_SCD2 3:
