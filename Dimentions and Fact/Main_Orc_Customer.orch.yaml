type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Log Started"
      parameters:
        componentName: "Start"
    Log Started:
      type: "sql-executor"
      transitions:
        success:
        - "Print Variables"
      parameters:
        componentName: "Log Started"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "INSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG(LOAD_ID,JOB_NAME,TABLE_NAME,STATUS,START_TIME)\r\
          \nVALUES('${sysvar.thisPipeline.executionId}','t_Stg_Customer_to_Dim_Customer_Scd2','DIM_CUSTOMER_SCD2','Job\
          \ is Started',CURRENT_TIMESTAMP)"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      transitions:
        success:
        - "Run Orchestration"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Orchestration:
      type: "run-orchestration"
      transitions:
        success:
        - "Log Completed"
        failure:
        - "Log Failed"
      parameters:
        componentName: "Run Orchestration"
        orchestrationJob: "Dimentions and Fact/Customer_Scd2_Orc.orch.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Completed:
      type: "sql-executor"
      parameters:
        componentName: "Log Completed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "update EDW_LAB.STAGE_SCHEMA.LOAD_LOG\r\nSET\r\n    INSERTED_ROWS='${jv_inserted_rows}',\r\
          \n    UPDATED_ROWS='${jv_updated_rows}',\r\n    STATUS='Completed Successfully',\r\
          \n    END_TIME=CURRENT_TIMESTAMP\r\nwhere LOAD_ID='${sysvar.thisPipeline.executionId}'\
          \ \r\n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Failed:
      type: "sql-executor"
      parameters:
        componentName: "Log Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include all"
        sqlScript: "update EDW_LAB.STAGE_SCHEMA.LOAD_LOG\r\nSET\r\n    INSERTED_ROWS=${jv_inserted_rows},\r\
          \n    UPDATED_ROWS=${jv_updated_rows},\r\n    STATUS='FAILED',\r\n    END_TIME=CURRENT_TIMESTAMP,ERROR_MESSAGE='${jv_error_message}'\r\
          \n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown:
      type: "python-pushdown"
      parameters:
        componentName: "Python Pushdown"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |-
          ###
          # Variables are directly accessible:
          #   print (myvar)
          # Updating a variable:
          #   context.updateVariable('myvar', 'new-value')
          # Updating a grid variable:
          #   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])
          # Running SQL against Snowflake
          #   session.sql('CREATE sample_product_data (id INT, name VARCHAR, serial_number VARCHAR)').collect()
          # Using Data Frames
          #   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes
          ###)
          context.updateVariable('jv_error_message' ,)
          print(jv_error_message)
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
design:
  components:
    Start:
      position:
        x: 0
        "y": 0
      tempMetlId: 1
    Log Started:
      position:
        x: 150
        "y": 0
      tempMetlId: 2
    Print Variables:
      position:
        x: 310
        "y": 0
      tempMetlId: 3
    Run Orchestration:
      position:
        x: 470
        "y": 0
      tempMetlId: 4
    Log Completed:
      position:
        x: 610
        "y": 0
      tempMetlId: 5
    Log Failed:
      position:
        x: 540
        "y": 120
      tempMetlId: 6
    Python Pushdown:
      position:
        x: 10
        "y": -130
      tempMetlId: 7
