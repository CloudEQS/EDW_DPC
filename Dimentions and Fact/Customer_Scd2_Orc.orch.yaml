type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Append To Grid"
      parameters:
        componentName: "Start"
    t_Stg_Customer_to_Dim_Customer_Scd2:
      type: "run-transformation"
      transitions:
        success:
        - "If"
        - "Print Variables 4"
        failure:
        - "Or"
      parameters:
        componentName: "t_Stg_Customer_to_Dim_Customer_Scd2"
        transformationJob: "Dimentions and Fact/t_Stg_Customer_to_Dim_Customer_Scd2.tran.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "v_error_message"
          - "${sysvar.thisComponent.message}"
        - - "v_inserted_rows"
          - "${sysvar.childPipeline.vars.jv_inserted_rows}"
        - - "v_updated_rows"
          - "${sysvar.childPipeline.vars.jv_updated_rows}"
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      transitions:
        success:
        - "Append To Grid 2 2"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "p_error_message"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid:
      type: "append-to-grid"
      transitions:
        success:
        - "Print Variables 2"
      parameters:
        componentName: "Append To Grid"
        operation: "Append"
        targetGridVariable: "gv_main_job_load_log_scd2"
        valuesGrid:
        - - "${sysvar.thisPipeline.executionId}"
          - "${sysvar.thisPipeline.fullName}"
          - "Stage customer to Dim Customer"
          - "0"
          - "0"
          - "Job is  started"
          - "${sysvar.thisComponent.startedAt}"
          - ""
          - "meesage"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables 2:
      type: "print-variables"
      transitions:
        success:
        - "t_Stg_Customer_to_Dim_Customer_Scd2"
      parameters:
        componentName: "Print Variables 2"
        variablesToPrint:
        - - "gv_main_job_load_log_scd2"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Print Variables 3"
      parameters:
        componentName: "Append To Grid 2"
        operation: "Append"
        targetGridVariable: "gv_main_job_load_log_scd2"
        valuesGrid:
        - - "${sysvar.thisPipeline.executionId}"
          - "${sysvar.thisPipeline.fullName}"
          - "stage customer to dim_cust"
          - "${v_inserted_rows}"
          - "${v_updated_rows}"
          - "Job is Completed"
          - ""
          - "${sysvar.thisComponent.startedAt}"
          - "${v_error_message}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline:
      type: "run-shared-pipeline"
      transitions:
        success:
        - "End Success"
      parameters:
        componentName: "Run Shared Pipeline"
        pipelineName: "EDW_LAB#Load_log_scd2_orc-1"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_parent_load_log_scd2"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_main_job_load_log_scd2"
              columns:
              - "jv_load_id"
              - "jv_job_name"
              - "jv_table_name"
              - "jv_inserted_rows"
              - "jv_updated_rows"
              - "jv_status"
              - "jv_start_time"
              - "jv_end_time"
              - "jv_error_message"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables 3:
      type: "print-variables"
      transitions:
        success:
        - "Run Shared Pipeline"
      parameters:
        componentName: "Print Variables 3"
        variablesToPrint:
        - - "gv_main_job_load_log_scd2"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid 2 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Run Shared Pipeline 2"
      parameters:
        componentName: "Append To Grid 2 2"
        operation: "Append"
        targetGridVariable: "gv_main_job_load_log_scd2"
        valuesGrid:
        - - "${sysvar.thisPipeline.executionId}"
          - "${sysvar.thisPipeline.fullName}"
          - "stage customer to dim_cust"
          - "${v_inserted_rows}"
          - "${v_updated_rows}"
          - "Failed"
          - ""
          - " ${sysvar.thisComponent.startedAt}"
          - "${detailed_error}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline 2:
      type: "run-shared-pipeline"
      transitions:
        success:
        - "End Failure"
      parameters:
        componentName: "Run Shared Pipeline 2"
        pipelineName: "EDW_LAB#Load_log_scd2_orc-1"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_parent_load_log_scd2"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_main_job_load_log_scd2"
              columns:
              - "jv_load_id"
              - "jv_job_name"
              - "jv_table_name"
              - "jv_inserted_rows"
              - "jv_updated_rows"
              - "jv_status"
              - "jv_start_time"
              - "jv_end_time"
              - "jv_error_message"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    If:
      type: "if"
      transitions:
        "true":
        - "Append To Grid 2"
        "false":
        - "Or"
      parameters:
        componentName: "If"
        mode: "Simple"
        condition:
        - - "v_inserted_rows"
          - "Is"
          - "Greater than"
          - "0"
        - - "v_updated_rows"
          - "Is"
          - "Greater than"
          - "0"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Or:
      type: "or"
      transitions:
        unconditional:
        - "Print Variables"
      parameters:
        componentName: "Or"
      postProcessing:
        updateOutputMessage: "Rows are updated: ${v_inserted_rows}\r\n\r\nRows are\
          \ Insterted: ${v_updated_rows}"
        updateScalarVariables:
    Print Variables 4:
      type: "print-variables"
      parameters:
        componentName: "Print Variables 4"
        variablesToPrint:
        - - "v_inserted_rows"
        - - "v_updated_rows"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "Rows are updated :${v_updated_rows}\r\n\r\nRows are\
          \ Inserted: ${v_inserted_rows}"
        updateScalarVariables:
  variables:
    v_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    p_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    gv_parent_load_log_scd2:
      metadata:
        type: "GRID"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
        columns:
          jv_load_id:
            columnType: "TEXT"
          jv_job_name:
            columnType: "TEXT"
          jv_table_name:
            columnType: "TEXT"
          jv_inserted_rows:
            columnType: "NUMBER"
          jv_updated_rows:
            columnType: "NUMBER"
          jv_status:
            columnType: "TEXT"
          jv_start_time:
            columnType: "TEXT"
          jv_end_time:
            columnType: "TEXT"
          jv_error_message:
            columnType: "TEXT"
      defaultValue: []
    gv_main_job_load_log_scd2:
      metadata:
        type: "GRID"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
        columns:
          jv_load_id:
            columnType: "TEXT"
          jv_job_name:
            columnType: "TEXT"
          jv_table_name:
            columnType: "TEXT"
          jv_inserted_rows:
            columnType: "NUMBER"
          jv_updated_rows:
            columnType: "NUMBER"
          jv_status:
            columnType: "TEXT"
          jv_start_time:
            columnType: "TEXT"
          jv_end_time:
            columnType: "TEXT"
          jv_error_message:
            columnType: "TEXT"
      defaultValue: []
