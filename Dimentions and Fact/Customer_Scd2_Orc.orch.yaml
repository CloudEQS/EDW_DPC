type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Log Started"
      parameters:
        componentName: "Start"
    t_Stg_Customer_to_Dim_Customer_Scd2:
      type: "run-transformation"
      transitions:
        success:
        - "Log Completed"
        failure:
        - "Python Pushdown"
      parameters:
        componentName: "t_Stg_Customer_to_Dim_Customer_Scd2"
        transformationJob: "Dimentions and Fact/t_Stg_Customer_to_Dim_Customer_Scd2.tran.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "v_error_message"
          - "${sysvar.detailed_error}"
        - - "v_inserted_rows"
          - "${sysvar.childPipeline.vars.jv_inserted_rows}"
        - - "v_updated_rows"
          - "${sysvar.childPipeline.vars.jv_updated_rows}"
    Log Started:
      type: "sql-executor"
      transitions:
        success:
        - "t_Stg_Customer_to_Dim_Customer_Scd2"
      parameters:
        componentName: "Log Started"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "INSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG_SCD2(LOAD_ID,JOB_NAME,TABLE_NAME,STATUS,START_TIME)\r\
          \nVALUES('${sysvar.thisPipeline.executionId}','t_Stg_Customer_to_Dim_Customer_Scd2','DIM_CUSTOMER_SCD2','Job\
          \ is Started',CURRENT_TIMESTAMP)"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Completed:
      type: "sql-executor"
      transitions:
        success:
        - "End Success"
      parameters:
        componentName: "Log Completed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "update EDW_LAB.STAGE_SCHEMA.LOAD_LOG_SCD2\r\nSET\r\n    INSERTED_ROWS=COALESCE((${v_inserted_rows}),0),\r\
          \n    UPDATED_ROWS=COALESCE((${v_updated_rows}), 0),\r\n    STATUS='Completed\
          \ Successfully',\r\n    END_TIME=CURRENT_TIMESTAMP\r\nwhere LOAD_ID='${sysvar.thisPipeline.executionId}'\
          \ \r\n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Failed:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure"
      parameters:
        componentName: "Log Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include all"
        sqlScript: "update EDW_LAB.STAGE_SCHEMA.LOAD_LOG_SCD2\r\nSET\r\n    INSERTED_ROWS=${v_inserted_rows},\r\
          \n    UPDATED_ROWS=${v_updated_rows},\r\n    STATUS='Failed',\r\n    END_TIME=CURRENT_TIMESTAMP,\r\
          \n    ERROR_MESSAGE='${v_error_message}'\r\n    where LOAD_ID='${sysvar.thisPipeline.executionId}'\r\
          \n    \r\n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown:
      type: "python-pushdown"
      transitions:
        success:
        - "Print Variables"
      parameters:
        componentName: "Python Pushdown"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |-
          ###
          # Variables are directly accessible:
          #   print (myvar)
          # Updating a variable:
          #   context.updateVariable('myvar', 'new-value')
          # Updating a grid variable:
          #   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])
          # Running SQL against Snowflake
          #   session.sql('CREATE sample_product_data (id INT, name VARCHAR, serial_number VARCHAR)').collect()
          # Using Data Frames
          #   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes
          ###)

          context.updateVariable('p_error_message',v_error_message)
          print(p_error_message)
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "p_error_message"
          - "${v_error_message}"
    Print Variables:
      type: "print-variables"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "p_error_message"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    p_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
design:
  components:
    Start:
      position:
        x: -380
        "y": 30
      tempMetlId: 1
    t_Stg_Customer_to_Dim_Customer_Scd2:
      position:
        x: 40
        "y": 30
      tempMetlId: 2
    Log Started:
      position:
        x: -180
        "y": 30
      tempMetlId: 3
    Log Completed:
      position:
        x: 160
        "y": -50
      tempMetlId: 4
    Log Failed:
      position:
        x: 450
        "y": 120
      tempMetlId: 5
    End Success:
      position:
        x: 370
        "y": -50
      tempMetlId: 6
    End Failure:
      position:
        x: 590
        "y": 120
      tempMetlId: 7
    Python Pushdown:
      position:
        x: 200
        "y": 70
      tempMetlId: 8
    Print Variables:
      position:
        x: 340
        "y": 80
      tempMetlId: 9
