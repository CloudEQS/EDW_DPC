type: "orchestration"
version: "1.0"
pipeline:
  components:
    Set error_rows:
      type: "query-to-scalar"
      transitions:
        success:
        - "If 0"
      skipped: false
      parameters:
        componentName: "Set error_rows"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n\n   \n--select count(*) as\
          \ ERR_ROWS from (${jv_table_name}) where (${jv_column_name}) =('${jv_column_value}')\n\
          \nselect count(*) as ERR_ROWS from (${jv_schema_name}.${jv_table_name})\
          \ where (${jv_where_condition})\n"
        scalarVariableMapping:
        - - "jv_error_rows"
          - "ERR_ROWS"
    Append To Grid error log:
      type: "append-to-grid"
      transitions:
        success:
        - "002-Error_log_insert 0"
      skipped: false
      parameters:
        componentName: "Append To Grid error log"
        operation: "Append"
        targetGridVariable: "gv_error_log"
        fixedGridMode: "Fixed"
        valuesGrid:
        - - "${jv_load_id}"
          - "${jv_job_name}"
          - "${jv_job_parent}"
          - "${jv_table_name}"
          - "${jv_table_type}"
          - "0"
          - "0"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "${jv_status}"
          - "${jv_message}"
          - "${jv_error_rows}"
          - "0"
          - "Null"
    "002-Error_log_insert 0":
      type: "run-orchestration"
      transitions:
        success:
        - "End Success 0"
      skipped: false
      parameters:
        componentName: "002-Error_log_insert 0"
        orchestrationJob: "EDW SHARED/002-Error_log_insert"
        setScalarVariables:
        setGridVariables:
        - variable: "error_log"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_error_log"
              columns:
              - "gv_load_id"
              - "gv_job_name"
              - "gv_job_parent"
              - "gv_table_name"
              - "gv_table_type"
              - "gv_error_rows"
              - "gv_subject_area"
              - "gv_process_date"
              - "gv_start_time"
              - "gv_run_history_id"
              - "gv_status"
              - "gv_message"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Set error_rows"
      skipped: false
      parameters:
        componentName: "Start 0"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    If 0:
      type: "if"
      transitions:
        "true":
        - "Append To Grid error log"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_error_rows"
          - "Is"
          - "Greater than"
          - "0"
        combineConditions: "And"
  variables:
    jv_status:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "None"
    jv_load_id:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
    jv_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "Null"
    jv_end_time:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1970-01-01"
    jv_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "null"
    jv_error_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    jv_job_parent:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "o_GNA_MAIN_ETL"
    jv_start_time:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1970-01-01"
    jv_table_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "STG_GNACASE"
    jv_table_type:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "Stage"
    jv_schema_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "EDP_STAGING"
    jv_process_date:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "2021-01-01"
    jv_subject_area:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "GANDA Load"
    jv_success_flag:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    jv_where_condition:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "PZINSKEY ='DELTA-GA-WORK CMP-8591'"
    gv_error_log:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          gv_load_id:
            columnType: "NUMBER"
          gv_job_name:
            columnType: "TEXT"
          gv_job_parent:
            columnType: "TEXT"
          gv_table_name:
            columnType: "TEXT"
          gv_table_type:
            columnType: "TEXT"
          gv_inserted_rows:
            columnType: "NUMBER"
          gv_updated_rows:
            columnType: "NUMBER"
          gv_subject_area:
            columnType: "TEXT"
          gv_process_date:
            columnType: "TEXT"
          gv_success_flag:
            columnType: "NUMBER"
          gv_start_time:
            columnType: "TEXT"
          gv_end_time:
            columnType: "TEXT"
          gv_row_count:
            columnType: "NUMBER"
          gv_run_history_id:
            columnType: "NUMBER"
          gv_status:
            columnType: "TEXT"
          gv_message:
            columnType: "TEXT"
          gv_error_rows:
            columnType: "NUMBER"
          gv_error_number:
            columnType: "NUMBER"
          gv_error_message:
            columnType: "TEXT"
      defaultValue: []
