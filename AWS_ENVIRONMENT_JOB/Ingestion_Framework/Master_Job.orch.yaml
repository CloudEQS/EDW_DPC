type: "orchestration"
version: "1.0"
pipeline:
  components:
    Get source system data:
      type: "query-to-grid"
      transitions:
        success:
        - "Log start"
      skipped: false
      parameters:
        componentName: "Get source system data"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select ss.Source_system_code,so.*\n\
          \   from ${ev_sf_database}.Framework.Source_Objects so \n   left join ${ev_sf_database}.Framework.Source_system\
          \ ss \n   on ss.Source_system_id = so.Source_system_id\n   where so.active_flag\
          \ = 1 and ss.active_flag = 1\n   "
        gridVariable: "gv_source_system"
        gridVariableMapping:
        - - "SOURCE_SYSTEM_CODE"
          - "source_system_code"
        - - "SOURCE_OBJECT_ID"
          - "Source_Object_id"
        - - "SOURCE_SYSTEM_ID"
          - "Source_System_id"
        - - "OBJECT_TYPE"
          - "Object_type"
        - - "OBJECT_NAME"
          - "Object_name"
        - - "REFRESH_FREQUENCY"
          - "Refresh_frequency"
        - - "REFRESH_TYPE"
          - "Refresh_type"
        - - "SOURCE_CUSTOM_QUERY"
          - "Source_custom_query"
        - - "ACTIVE_FLAG"
          - "Active_flag"
        - - "TARGET_TABLE"
          - "Target_table"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Get source system data"
      skipped: false
      parameters:
        componentName: "Start 0"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Python Script 0:
      type: "python-script"
      transitions:
        success:
        - "error_log 0"
      skipped: false
      parameters:
        componentName: "Python Script 0"
        script: "###\n# Variables are directly accessible: \n#   print (myvar)\n#\
          \ Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\n\n\
          context.updateVariable('jv_error_message' , detailed_error)\nprint(jv_error_message)"
        interpreter: "Python 3"
        timeout: "360"
    Log start:
      type: "sql-script"
      transitions:
        success:
        - "Grid Iterator 0"
      skipped: false
      parameters:
        componentName: "Log start"
        sqlScript: "insert into ${ev_sf_database}.FRAMEWORK.Source_Object_Ingestion_log\n\
          (Batch_run_id,Source_system_id,Source_object_id,Status,Run_start_time) \n\
          values ('${task_id}','${jv_source_system_id}','${jv_source_object_id}','STARTED',current_timestamp);"
    Main_Source_Selector 0:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "Main_Source_Selector 0"
        orchestrationJob: "${jv_source_system_code}_Load"
        setScalarVariables:
        - - "jv_source_system_code"
          - "${jv_source_system_code}"
        - - "jv_source_system_id"
          - "${jv_source_system_id}"
        - - "jv_active_flag"
          - "${jv_active_flag}"
        - - "jv_object_name"
          - "${jv_object_name}"
        - - "jv_object_type"
          - "${jv_object_type}"
        - - "jv_refresh_frequency"
          - "${jv_refresh_frequency}"
        - - "jv_refresh_type"
          - "${jv_refresh_type}"
        - - "jv_source_custom_query"
          - "${jv_source_custom_query}"
        - - "jv_target_table"
          - "${jv_target_table}"
        - - "jv_source_object_id"
          - "${jv_source_object_id}"
        setGridVariables:
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Log Update:
      type: "sql-script"
      transitions:
        success:
        - "End Success 0"
      skipped: false
      parameters:
        componentName: "Log Update"
        sqlScript: |-
          update ${ev_sf_database}.FRAMEWORK.Source_Object_Ingestion_log
          set Run_end_time = current_timestamp where batch_run_id = '${task_id}'
    Grid Iterator 0:
      type: "grid-iterator"
      transitions:
        success:
        - "Log Update"
        failure:
        - "Python Script 0"
      iterationTarget: "Main_Source_Selector 0"
      skipped: false
      parameters:
        componentName: "Grid Iterator 0"
        gridVariable: "gv_source_system"
        gridIteratorVariableMapping:
        - - "source_system_code"
          - "jv_source_system_code"
        - - "Source_System_id"
          - "jv_source_system_id"
        - - "Source_Object_id"
          - "jv_source_object_id"
        - - "Object_type"
          - "jv_object_type"
        - - "Object_name"
          - "jv_object_name"
        - - "Refresh_frequency"
          - "jv_refresh_frequency"
        - - "Refresh_type"
          - "jv_refresh_type"
        - - "Source_custom_query"
          - "jv_source_custom_query"
        - - "Active_flag"
          - "jv_active_flag"
        - - "Target_table"
          - "jv_target_table"
        concurrency: "Concurrent"
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
          - "${sysvar.thisComponent.status}"
        - - "jv_end_time"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
        - - "jv_start_time"
          - "${sysvar.thisComponent.startedAt}"
        - - "jv_message"
          - "${sysvar.thisComponent.message}"
    error_log 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "End Failure 0"
      skipped: false
      parameters:
        "1": "error_log 0"
        "2": "[{\"1\":[[\"gv_error_log\"]]},{\"1\":[[\"gv_load_id\",\"gv_job_name\"\
          ,\"gv_job_parent\",\"gv_table_name\",\"gv_table_type\",\"gv_error_rows\"\
          ,\"gv_subject_area\",\"gv_process_date\",\"gv_start_time\",\"gv_run_history_id\"\
          ,\"gv_status\",\"gv_message\"]]}]"
  variables:
    jv_object_type:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_last_run_dt:
