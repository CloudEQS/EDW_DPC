type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Append To Grid"
      parameters:
        componentName: "Start"
    t_Stg_Customer_to_Dim_Customer_Scd2:
      type: "run-transformation"
      transitions:
        success:
        - "Append To Grid 2"
        - "Print Variables"
      parameters:
        componentName: "t_Stg_Customer_to_Dim_Customer_Scd2"
        transformationJob: "Dimentions and Fact/t_Stg_Customer_to_Dim_Customer_Scd2.tran.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "v_error_message"
          - "${sysvar.detailed_error}"
        - - "v_inserted_rows"
          - "${sysvar.childPipeline.vars.jv_inserted_rows}"
        - - "v_updated_rows"
          - "${sysvar.childPipeline.vars.jv_updated_rows}"
    Log Started:
      type: "sql-executor"
      parameters:
        componentName: "Log Started"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "INSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG_SCD2(LOAD_ID,JOB_NAME,TABLE_NAME,STATUS,START_TIME)\r\
          \nVALUES('${sysvar.thisPipeline.executionId}','t_Stg_Customer_to_Dim_Customer_Scd2','DIM_CUSTOMER_SCD2','Job\
          \ is Started',CURRENT_TIMESTAMP)"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Failed:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure"
      parameters:
        componentName: "Log Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include all"
        sqlScript: "update EDW_LAB.STAGE_SCHEMA.LOAD_LOG_SCD2\r\nSET\r\n    INSERTED_ROWS=${v_inserted_rows},\r\
          \n    UPDATED_ROWS=${v_updated_rows},\r\n    STATUS='Failed',\r\n    END_TIME=CURRENT_TIMESTAMP,\r\
          \n    ERROR_MESSAGE='${v_error_message}'\r\n    where LOAD_ID='${sysvar.thisPipeline.executionId}'\r\
          \n    \r\n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "p_error_message"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid:
      type: "append-to-grid"
      transitions:
        success:
        - "Print Variables 2"
      parameters:
        componentName: "Append To Grid"
        operation: "Append"
        targetGridVariable: "gv_main_job_load_log_scd2"
        valuesGrid:
        - - "${sysvar.thisPipeline.executionId}"
          - "${sysvar.thisPipeline.fullName}"
          - "stage customer to dim_cust"
          - "0"
          - "0"
          - "Job Started"
          - " ${sysvar.thisComponent.startedAt}"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
          - ""
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables 2:
      type: "print-variables"
      transitions:
        success:
        - "t_Stg_Customer_to_Dim_Customer_Scd2"
      parameters:
        componentName: "Print Variables 2"
        variablesToPrint:
        - - "gv_main_job_load_log_scd2"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Run Shared Pipeline"
      parameters:
        componentName: "Append To Grid 2"
        operation: "Append"
        targetGridVariable: "gv_main_job_load_log_scd2"
        valuesGrid:
        - - "${sysvar.thisPipeline.executionId}"
          - "${sysvar.thisPipeline.fullName}"
          - "stage customer to dim_cust"
          - "0"
          - "0"
          - "Job Started"
          - " ${sysvar.thisComponent.startedAt}"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
          - ""
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline:
      type: "run-shared-pipeline"
      parameters:
        componentName: "Run Shared Pipeline"
        pipelineName: "Dimentions and Fact/Load"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    p_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    gv_main_job_load_log_scd2:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          jv_load_id:
            columnType: "TEXT"
          jv_job_name:
            columnType: "TEXT"
          jv_table_name:
            columnType: "TEXT"
          jv_inserted_rows:
            columnType: "NUMBER"
          jv_updated_rows:
            columnType: "NUMBER"
          jv_status:
            columnType: "TEXT"
          jv_start_time:
            columnType: "TEXT"
          jv_end_time:
            columnType: "TEXT"
          jv_error_message:
            columnType: "TEXT"
      defaultValue: []
design:
  components:
    Start:
      position:
        x: -380
        "y": 30
      tempMetlId: 1
    t_Stg_Customer_to_Dim_Customer_Scd2:
