type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "SQL Script"
      skipped: false
      parameters:
        componentName: "Start 0"
    Read table metadata 1:
      type: "query-to-grid"
      transitions:
        success:
        - "Database Query advance mode"
      skipped: false
      parameters:
        componentName: "Read table metadata 1"
        mode: "Advanced"
        gridVariable: "gv_table_creator"
        gridVariableMapping:
        - - "DATA_TYPE"
          - "data_type"
        - - "FIELD_NAME"
          - "field_name"
        query: "SELECT M.FIELD_NAME,M.DATA_TYPE FROM edw_lab.public.SOURCE_OBJECT_METADATA\
          \ M RIGHT JOIN  edw_lab.public.SOURCE_OBJECTS O ON M.SOURCE_OBJECT_ID =\
          \ O.SOURCE_OBJECT_ID  JOIN  edw_lab.public.SOURCE_SYSTEM S ON O.SOURCE_SYSTEM_ID\
          \ = S.SOURCE_SYSTEM_ID WHERE O.OBJECT_NAME='${jv_object_name}'"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Path for Append:
      type: "if"
      transitions:
        "true":
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Path for Append"
        mode: "Simple"
        condition:
        - - "jv_refresh_type"
          - "Is"
          - "Equal to"
          - "APPEND"
        combineConditions: "And"
    Or 1:
      type: "or"
      transitions:
        unconditional:
        - "Python Pushdown 3"
      skipped: false
      parameters:
        componentName: "Or 1"
    Database Query advance mode:
      type: "database-query"
      transitions:
        success:
        - "Path for Append"
        - "Path for Merge 0"
        - "Print Variables"
        failure:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "Database Query advance mode"
        basicAdvancedMode: "Advanced"
        databaseType: "Snowflake"
        connectionUrl: "jdbc:snowflake://https://kha80474.snowflakecomputing.com"
        username: "mohanishk@cloudeqs.com"
        password: "sf_m_password"
        connectionOptions:
        - - "warehouse"
          - "compute_wh"
        - - "database"
          - "INTERNAL_TRAINING"
        sqlQuery: "select * from ${ev_db}.${EV_SCHEME}.${jv_object_name} limit 1000"
        type: "Standard"
        primaryKeys:
        warehouse1: "WH_ETL"
        database: "SOURCE_DB_TEST"
        schema: "SOURCE_SCHEMA"
        targetTable: "${jv_target_table}"
        stage1: "[Custom]"
        stagePlatform: "Snowflake Managed"
        loadOptions:
        - "On"
        - "Off"
        - "On"
        - ""
        - "On"
        - "Gzip"
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
          - "${sysvar.thisComponent.status}"
        - - "jv_end_time"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
        - - "jv_start_time"
          - "${sysvar.thisComponent.startedAt}"
        - - "jv_message"
          - "${sysvar.thisComponent.message}"
    Path for Merge 0:
      type: "if"
      transitions:
        "true":
        - "Get business key 0"
      skipped: false
      parameters:
        componentName: "Path for Merge 0"
        mode: "Simple"
        condition:
        - - "jv_refresh_type"
          - "Is"
          - "Equal to"
          - "MERGE"
        combineConditions: "And"
    End Success 1:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 1"
    Get business key 0:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Get business key 0"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select Field_name from\
          \ edw_lab.public.Source_Object_Metadata som\n   right join edw_lab.public.Source_Objects\
          \ so \n   on som.SOURCE_OBJECT_ID = so.SOURCE_OBJECT_ID and som.Source_System_id\
          \ = so.Source_System_id\n   where so.OBJECT_NAME = '${jv_object_name}' and\
          \ som.Business_key ='Y'"
        scalarVariableMapping:
        - - "jv_business_key"
          - "FIELD_NAME"
    Or 2:
      type: "or"
      transitions:
        unconditional:
        - "Dynamic SQL Statement Construct"
      skipped: false
      parameters:
        componentName: "Or 2"
    Dynamic SQL Statement Construct:
      type: "python-pushdown"
      transitions:
        success:
        - "Dynamic SQL Execute "
      parameters:
        componentName: "Dynamic SQL Statement Construct"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |
          merge_query_string = "MERGE INTO "
          insert_query_string = "INSERT INTO"
          table_name = f"edw_lab.public.{jv_target_table}"  # target table
          tmp_table_alias = "SRC"
          target_table_alias = "TGT"
          column_string = ""
          update_string = ""
          insert_string = ""
          business_key_col = jv_business_key
          dynamic_query_string = ""
          refresh_type = jv_refresh_type
          array = gv_table_creator  # Assumed format: [['index', 'column_name'], ...]

          if refresh_type == "MERGE":
              for data in array:
                  insert_string += f'{tmp_table_alias}."{data[1]}",'

              insert_string = insert_string.rstrip(',')

              for data in array:
                  column_string += f'"{data[1]}",'

              column_string = column_string.rstrip(',')

              for data in array:
                  update_string += f'{target_table_alias}."{data[1]}" = {tmp_table_alias}."{data[1]}",'

              update_string = update_string.rstrip(',')

              merge_query_string = (
                  f'MERGE INTO {table_name} AS {target_table_alias} '
                  f'USING {table_name}_TMP AS {tmp_table_alias} '
                  f'ON {target_table_alias}."{business_key_col}" = {tmp_table_alias}."{business_key_col}" '
                  f'WHEN MATCHED THEN UPDATE SET {update_string} '
                  f'WHEN NOT MATCHED THEN INSERT ({column_string}) VALUES ({insert_string})'
              )

              print(merge_query_string)
              context.updateVariable("dynamic_query_str", merge_query_string)

          elif refresh_type == "APPEND":
              for data in array:
                  column_string += f'"{data[1]}",'

              column_string = column_string.rstrip(',')

              insert_query_string = (
                  f'INSERT INTO {table_name} ({column_string}) '
                  f'SELECT {column_string} FROM {table_name}_TMP'
              )

              print(insert_query_string)
              context.updateVariable("dynamic_query_str", insert_query_string)
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown 3:
      type: "python-pushdown"
      transitions:
        success:
        - "Marked Failed"
      parameters:
        componentName: "Python Pushdown 3"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible: \n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\n\n\
          context.updateVariable('jv_error_message' , jv_message)\nprint(jv_error_message)"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    'Dynamic SQL Execute ':
      type: "sql-executor"
      transitions:
        success:
        - "Marked Success"
      parameters:
        componentName: "Dynamic SQL Execute "
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "${dynamic_query_str}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Marked Failed:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure 0"
      parameters:
        componentName: "Marked Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE EDW_LAB.PUBLIC.JOB_RUN_AUDIT SET END_TIME=CURRENT_TIMESTAMP,STATUS='FAILED'\
          \ WHERE BATCH_ID='${sysvar.rootPipeline.executionId}' and source_object_id=${jv_source_object_id}\
          \ and source_system_id=${jv_source_system_id} \r\n\r\n"
      postProcessing:
        updateOutputMessage: "${jv_object_name}"
        updateScalarVariables:
    Marked Success:
      type: "sql-executor"
      transitions:
        success:
        - "End Success 1"
      parameters:
        componentName: "Marked Success"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE EDW_LAB.PUBLIC.JOB_RUN_AUDIT SET END_TIME=CURRENT_TIMESTAMP,STATUS='SUCCESS'\
          \ WHERE BATCH_ID='${sysvar.rootPipeline.executionId}' and source_object_id=${jv_source_object_id}\
          \ and source_system_id=${jv_source_system_id} \r\n\r\n\r\n"
      postProcessing:
        updateOutputMessage: "${jv_object_name}"
        updateScalarVariables:
    SQL Script:
      type: "sql-executor"
      transitions:
        success:
        - "Read table metadata 1"
      parameters:
        componentName: "SQL Script"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "insert into edw_lab.public.JOB_RUN_AUDIT(BATCH_ID,run_id,JOB_NAME,Source_system_id,SOURCE_OBJECT_ID,object_name,STATUS,START_TIME)\r\
          \nvalues('${sysvar.rootPipeline.executionId}','${sysvar.thisPipeline.executionId}','${sysvar.thisPipeline.fullName}','${jv_source_system_id}','${jv_source_object_id}','${jv_object_name}','RUNNING',current_timestamp)\
          \  "
      postProcessing:
        updateOutputMessage: "${jv_object_name}"
        updateScalarVariables:
    Print Variables:
