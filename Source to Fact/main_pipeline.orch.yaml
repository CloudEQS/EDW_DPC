type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Get last run time"
      parameters:
        componentName: "Start"
    Get Last Failed Jobs:
      type: "query-to-grid"
      transitions:
        success:
        - "Grid Iterator"
      parameters:
        componentName: "Get Last Failed Jobs"
        mode: "Advanced"
        gridVariable: "gv_failed_jobs"
        gridVariableMapping:
        - - "FAILED_JOB"
          - "failed_job_name"
        - - "FAILED_OBJECT_NAME"
          - "object_name"
        query: "select distinct JOB_NAME as failed_job, OBJECT_NAME as failed_object_name\r\
          \nfrom EDW_LAB.PUBLIC.JOB_RUN_AUDIT\r\nwhere last_run_time = '${jv_last_run_time}'\
          \ and status IN ('FAILED', 'PENDING')\r\n"
      postProcessing:
        updateOutputMessage: "Last Failed Jobs Are:  ${gv_failed_jobs}"
        updateScalarVariables:
    Get last run time:
      type: "query-to-scalar"
      transitions:
        success:
        - "Check Failed Jobs Exists"
      parameters:
        componentName: "Get last run time"
        mode: "Advanced"
        query: "select coalesce(max(last_run_time),'1900-06-24 08:18:05.524 -0700')\
          \ as latest_run_time\r\nfrom EDW_LAB.PUBLIC.JOB_RUN_AUDIT"
        scalarVariableMapping:
        - - "jv_last_run_time"
          - "LATEST_RUN_TIME"
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
    Get Last BATCH_ID:
      type: "query-to-scalar"
      transitions:
        success:
        - "Get Last Failed Jobs"
      parameters:
        componentName: "Get Last BATCH_ID"
        mode: "Advanced"
        query: "select batch_id as last_batch_id\r\nfrom EDW_LAB.PUBLIC.JOB_RUN_AUDIT\r\
          \nwhere last_run_time = '${jv_last_run_time}'\r\nlimit 1"
        scalarVariableMapping:
        - - "jv_last_batch_id"
          - "LAST_BATCH_ID"
      postProcessing:
        updateOutputMessage: "Fetth the Last Bath_id :'${jv_last_batch_id}"
        updateScalarVariables:
    Run last failed jobs:
      type: "run-orchestration"
      parameters:
        componentName: "Run last failed jobs"
        orchestrationJob: "Source to Fact/run_failed_jobs.orch.yaml"
        setScalarVariables:
        - - "jv_failed_job_name1"
          - "${jv_failed_job_name}"
        - - "jv_last_batch_id1"
          - "${jv_last_batch_id}"
        - - "jv_failed_object_name1"
          - "${jv_failed_object_name}"
        setGridVariables:
      postProcessing:
        updateOutputMessage: "Currently Running Job: ${jv_failed_job_name}"
        updateScalarVariables:
    Run Ingestion_Framework:
      type: "run-orchestration"
      transitions:
        success:
        - "Get Current Run_time"
      parameters:
        componentName: "Run Ingestion_Framework"
        orchestrationJob: "Source to Fact/Main_Job.orch.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Set Last RunTime for Jobs in Current Batch:
      type: "sql-executor"
      parameters:
        componentName: "Set Last RunTime for Jobs in Current Batch"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "update EDW_LAB.PUBLIC.JOB_RUN_AUDIT\r\nset \r\n    last_run_time\
          \ = '${jv_current_run_time}'\r\nwhere batch_id = '${sysvar.rootPipeline.executionId}'"
      postProcessing:
        updateOutputMessage: "Set the curerrent Batch Run Time: ${jv_current_run_time}"
        updateScalarVariables:
    Get Current Run_time:
      type: "python-pushdown"
      transitions:
        success:
        - "Set Last RunTime for Jobs in Current Batch"
      parameters:
        componentName: "Get Current Run_time"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |+
          ###
          # Variables are directly accessible:
          #   print (myvar)
          # Updating a variable:
          #   context.updateVariable('myvar', 'new-value')
          # Updating a grid variable:
          #   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])
          # Running SQL against Snowflake
          #   session.sql('CREATE sample_product_data (id INT, name VARCHAR, serial_number VARCHAR)').collect()
          # Using Data Frames
          #   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes
          ###)


          result = session.sql('select current_timestamp() as current_run_time').collect()
          current_run_time = result[0]['CURRENT_RUN_TIME']
          print('current run_time=', current_run_time)

          context.updateVariable('jv_current_run_time', current_run_time)

        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage: "Get Current Run Time: ${jv_current_run_time}"
        updateScalarVariables:
    Check Failed Jobs Exists:
      type: "python-pushdown"
      transitions:
        success:
        - "Check Failed Jobs Exists or not"
      parameters:
        componentName: "Check Failed Jobs Exists"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.12"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |
          ###
          # Variables are directly accessible:
          #   print (myvar)
          # Updating a variable:
          #   context.updateVariable('myvar', 'new-value')
          # Updating a grid variable:
          #   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])
          # Running SQL against Snowflake
          #   session.sql('CREATE sample_product_data (id INT, name VARCHAR, serial_number VARCHAR)').collect()
          # Using Data Frames
          #   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes
          ###)


          query = f"""
          SELECT COUNT(*) AS job_count
          FROM EDW_LAB.PUBLIC.JOB_RUN_AUDIT
          WHERE LAST_RUN_TIME = '{jv_last_run_time}' AND STATUS IN ('FAILED', 'PENDING')
          """

          result=session.sql(query).collect()
          print(result)

          # Execute the SQL and fetch result


          # Check if any jobs matched
          if result[0]['JOB_COUNT']>0:
              value_to_set = 'TRUE'
          else:
              value_to_set = 'FALSE'

          # Set a Matillion variable (must be declared at project/environment level)
          context.updateVariable('v_failed_jobs_exist', value_to_set)

          print("Does Failed Jobs Exists:" ,v_failed_jobs_exist)
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Check Failed Jobs Exists or not:
      type: "if"
      transitions:
        "true":
        - "Get Last BATCH_ID"
        "false":
        - "Or"
      parameters:
        componentName: "Check Failed Jobs Exists or not"
        mode: "Simple"
        condition:
        - - "v_failed_jobs_exist"
          - "Is"
          - "Equal to"
          - "TRUE"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage: "Previous Failed Jobs Exists or Not : '${v_failed_jobs_exist} "
        updateScalarVariables:
    Or:
      type: "or"
      transitions:
        unconditional:
        - "Run Ingestion_Framework"
      parameters:
        componentName: "Or"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator:
      type: "grid-iterator"
      transitions:
        success:
        - "Or"
      iterationTarget: "Run last failed jobs"
      parameters:
        componentName: "Grid Iterator"
        gridVariable: "gv_failed_jobs"
        gridIteratorVariableMapping:
        - - "failed_job_name"
          - "jv_failed_job_name"
        - - "object_name"
          - "jv_failed_object_name"
        concurrency: "Concurrent"
      postProcessing:
        updateOutputMessage: "Grid Iterator :\r\n\r\n'${jv_failed_job_name}'\r\n'${jv_failed_object_name}'\r\
          \n\r\n"
        updateScalarVariables:
  variables:
    jv_current_run_time:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "2025-06-24 04:03:51.113 -0700"
    v_failed_jobs_exist:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_last_run_time:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "2025-06-24 02:20:34.237 -0700"
    jv_last_batch_id:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "xxxxxxxxx"
    jv_failed_object_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "XYZ"
    jv_failed_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "A"
    gv_failed_jobs:
      metadata:
        type: "GRID"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
        columns:
          failed_job_name:
            columnType: "TEXT"
          object_name:
            columnType: "TEXT"
      defaultValue:
      - - "A"
        - "ABC"
