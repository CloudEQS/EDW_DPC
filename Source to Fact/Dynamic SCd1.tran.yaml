type: "transformation"
version: "1.0"
pipeline:
  components:
    Table Input:
      type: "table-input"
      parameters:
        componentName: "Table Input"
        database: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable:
        columnNames:
        timeOffset:
    Detect Changes:
      type: "detect-changes"
