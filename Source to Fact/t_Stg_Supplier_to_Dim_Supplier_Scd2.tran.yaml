type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_SUPPLIER_SCD2:
      type: "table-input"
      parameters:
        componentName: "STG_SUPPLIER_SCD2"
        database: "EDW_LAB"
        schema: "STAGE_SCHEMA"
        targetTable: "STAGE_SUPPLIER_SCD2"
        columnNames:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        - "START_TIME"
        timeOffset:
    Detect Changes:
      type: "detect-changes"
      sources:
      - "Filter"
      - "Current Data of Target"
      parameters:
        componentName: "Detect Changes"
        masterTable: "Current Data of Target"
        matchKeys:
        - "S_SUPPKEY"
        compareColumns:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        outputColumnMapping:
        - - "compare_S_SUPPKEY"
          - "compare_S_SUPPKEY"
        - - "compare_S_NAME"
          - "compare_S_NAME"
        - - "compare_S_ADDRESS"
          - "compare_S_ADDRESS"
        - - "compare_S_NATIONKEY"
          - "compare_S_NATIONKEY"
        - - "compare_S_PHONE"
          - "compare_S_PHONE"
        - - "compare_S_ACCTBAL"
          - "compare_S_ACCTBAL"
        - - "compare_S_COMMENT"
          - "compare_S_COMMENT"
        - - "compare_START_TIME"
          - "NEW_LOAD"
        indicatorColumn: "Indicator"
    Rank:
      type: "rank"
      sources:
      - "STG_SUPPLIER_SCD2"
      parameters:
        componentName: "Rank"
        includeInputColumns: "Yes"
        partitionData:
        - "S_SUPPKEY"
        - "S_NAME"
        - "S_ADDRESS"
        - "S_NATIONKEY"
        - "S_PHONE"
        - "S_ACCTBAL"
        - "S_COMMENT"
        - "START_TIME"
        orderingWithinPartitions:
        - - "START_TIME"
          - "Descending"
        functions:
        - - "Row Number"
          - "rn"
    Filter:
      type: "filter"
      sources:
      - "Rank"
      parameters:
        componentName: "Filter"
        filterConditions:
        - - "rn"
          - "Is"
          - "Equal to"
          - "1"
        combineCondition: "And"
    Current Data of Target:
      type: "sql"
      parameters:
        componentName: "Current Data of Target"
        query: "SELECT * FROM ANALYTICS_DB.ANALYTICS_SCHEMA.DIM_SUPPLIER_SCD2 WHERE\
          \ S_END_TIME IS NULL"
    New data:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "New data"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "N"
        combineCondition: "Or"
    update:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "update"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "And"
    DIM_SUPPLIER_SCD2_UPDATE:
      type: "table-output"
      sources:
      - "Calculator 2"
      parameters:
        componentName: "DIM_SUPPLIER_SCD2_UPDATE"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "compare_S_SUPPKEY"
          - "S_NAME"
        - - "compare_S_NAME"
          - "S_ADDRESS"
        - - "compare_S_ADDRESS"
          - "S_NATIONKEY"
        - - "compare_S_PHONE"
          - "S_PHONE"
        - - "compare_S_ACCTBAL"
          - "S_ACCTBAL"
        - - "compare_S_COMMENT"
          - "S_COMMENT"
        - - "LOAD_TIME_V"
          - "S_LOAD_TIME"
        - - "END_TIME_UP_V"
          - "S_END_TIME"
        - - "ACTIVE_FLAG"
          - "S_ACTIVE_FLAG"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowCount}"
    DIM_SUPPLIER_INSERT:
      type: "table-output"
      sources:
      - "Calculator"
      parameters:
        componentName: "DIM_SUPPLIER_INSERT"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "S_SUPPKEY"
          - "S_SUPPKEY"
        - - "compare_S_NAME"
          - "S_NAME"
        - - "compare_S_ADDRESS"
          - "S_ADDRESS"
        - - "compare_S_NATIONKEY"
          - "S_NATIONKEY"
        - - "compare_S_PHONE"
          - "S_PHONE"
        - - "compare_S_ACCTBAL"
          - "S_ACCTBAL"
        - - "compare_S_ACCTBAL"
          - "S_COMMENT"
        - - "LOAD_TIME_V"
          - "S_LOAD_TIME"
        - - "END_TIME_IN_V"
          - "S_END_TIME"
        - - "ACTIVE_FLAG"
          - "S_ACTIVE_FLAG"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowCount}"
    Calculator:
      type: "calculator"
      sources:
      - "New data"
      parameters:
        componentName: "Calculator"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "LOAD_TIME_V"
        - - "NULL"
          - "END_TIME_IN_V"
        - - "'Y'"
          - "ACTIVE_FLAG"
    Calculator 2:
      type: "calculator"
      sources:
      - "update"
      parameters:
        componentName: "Calculator 2"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "LOAD_TIME_V"
        - - "NULL"
          - "END_TIME_UP_V"
        - - "'Y'"
          - "ACTIVE_FLAG"
    DIM_SUPPLIER_SCD2 2_UPDATE OLD_REC:
      type: "table-update"
      sources:
      - "Calculator 3"
      parameters:
        componentName: "DIM_SUPPLIER_SCD2 2_UPDATE OLD_REC"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_SUPPLIER_SCD2"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"compare_S_SUPPKEY\"=\"target\".\"S_SUPPKEY\"AND\"target\"\
            .\"S_END_TIME\" IS NULL AND \"input\".\"NEW_LOAD\">\"target\".\"S_LOAD_TIME\""
          - "Case"
        whenMatched:
        - - "\"input\".\"compare_S_SUPPKEY\"=\"target\".\"S_SUPPKEY\"AND\"target\"\
            .\"S_END_TIME\" IS NULL AND \"input\".\"NEW_LOAD\">\"target\".\"S_LOAD_TIME\""
          - "Update"
        updateMapping:
        - - "END_TIME_OLD"
          - "S_END_TIME"
        - - "AVTIVE_FLAG"
          - "S_ACTIVE_FLAG"
        includeNotMatched: "No"
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
        - - "jv_inserted_rows"
          - "${sysvar.thisComponent.rowsInserted}"
        - - "jv_updated_rows"
          - "${sysvar.thisComponent.rowsUpdated}"
    Calculator 3:
      type: "calculator"
      sources:
      - "update"
      parameters:
        componentName: "Calculator 3"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "END_TIME_OLD"
        - - "'N'"
          - "AVTIVE_FLAG"
  variables:
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "Failed Message in the child"
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
