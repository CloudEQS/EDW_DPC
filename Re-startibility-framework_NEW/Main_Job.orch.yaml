type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Get source system data"
      skipped: false
      parameters:
        componentName: "Start 0"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Main_Source_Selector 0:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "Main_Source_Selector 0"
        orchestrationJob: "Re-startibility-framework_NEW/${jv_source_system_code}_Load"
        setScalarVariables:
        - - "jv_source_system_code"
          - "${jv_source_system_code}"
        - - "jv_source_system_id"
          - "${jv_source_system_id}"
        - - "jv_active_flag"
          - "${jv_active_flag}"
        - - "jv_object_name"
          - "${jv_object_name}"
        - - "jv_refresh_type"
          - "${jv_refresh_type}"
        - - "jv_target_table"
          - "${jv_target_table}"
        - - "jv_source_object_id"
          - "${jv_source_object_id}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_message"
          - "${sysvar.thisComponent.message}"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Grid Iterator 0:
      type: "grid-iterator"
      transitions:
        success:
        - "Update the Last run time"
        failure:
        - "SQL Script"
      iterationTarget: "Main_Source_Selector 0"
      skipped: false
      parameters:
        componentName: "Grid Iterator 0"
        gridVariable: "gv_source_system"
        gridIteratorVariableMapping:
        - - "gv_source_system_code"
          - "jv_source_system_code"
        - - "gv_Source_System_id"
          - "jv_source_system_id"
        - - "gv_Source_Object_id"
          - "jv_source_object_id"
        - - "gv_Object_type"
          - "jv_object_type"
        - - "gv_Object_name"
          - "jv_object_name"
        - - "gv_Refresh_frequency"
          - "jv_refresh_frequency"
        - - "gv_Refresh_type"
          - "jv_refresh_type"
        - - "gv_Source_custom_query"
          - "jv_source_custom_query"
        - - "gv_Active_flag"
          - "jv_active_flag"
        - - "gv_Target_table"
          - "jv_target_table"
        concurrency: "Concurrent"
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
          - "${sysvar.thisComponent.status}"
        - - "jv_end_time"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
        - - "jv_start_time"
          - "${sysvar.thisComponent.startedAt}"
    LOG START:
      type: "sql-executor"
      transitions:
        success:
        - "Grid Iterator 0"
      skipped: true
      parameters:
        componentName: "LOG START"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "insert into edw_lab.public.INGESTION_CONTROL_TABLE(BATCH_ID,START_TIME,STATUS,Source_system_id,SOURCE_OBJECT_ID,object_name)\r\
          \nselect '${sysvar.rootPipeline.executionId}',current_timestamp,'STARTED',s.SOURCE_SYSTEM_ID,so.SOURCE_OBJECT_ID,\
          \ so.object_name from edw_lab.public.source_system s join edw_lab.public.Source_Objects\
          \ so\r\non so.source_system_id=s.source_system_id and \r\nso.SOURCE_OBJECT_ID\
          \ in (1,2)"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Update the Last run time:
      type: "sql-executor"
      transitions:
        success:
        - "End Success 0"
      skipped: true
      parameters:
        componentName: "Update the Last run time"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "update edw_lab.public.INGESTION_CONTROL_TABLE set LAST_RUN_TS=current_timestamp,status='SUCCESS'\
          \ where batch_id='${sysvar.rootPipeline.executionId}' AND OBJECT_ID=${jv_source_object_id}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    SQL Script:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure 0"
      skipped: true
      parameters:
        componentName: "SQL Script"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "select * from edw_lab.public.INGESTION_CONTROL_TABLE where\r\n\
          status in('PENDING','FAILED') AND retry_count < max_retries"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Source Syatem Details:
      type: "print-variables"
      transitions:
        success:
        - "LOG START"
      parameters:
        componentName: "Source Syatem Details"
        variablesToPrint:
        - - "gv_source_system"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "Active Source Syatem Details"
        updateScalarVariables:
    Get source system data:
      type: "query-to-grid"
      transitions:
        success:
        - "Source Syatem Details"
      skipped: false
      parameters:
        componentName: "Get source system data"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select ss.Source_system_code,so.*\n\
          \   from edw_lab.public.Source_Objects so \n   left join edw_lab.public.Source_system\
          \ ss \n   on ss.Source_system_id = so.Source_system_id\n   where so.active_flag\
          \ = 1 and ss.active_flag = 1 \n   "
        gridVariable: "gv_source_system"
        gridVariableMapping:
        - - "SOURCE_SYSTEM_CODE"
          - "gv_source_system_code"
        - - "SOURCE_OBJECT_ID"
          - "gv_Source_Object_id"
        - - "SOURCE_SYSTEM_ID"
          - "gv_Source_System_id"
        - - "OBJECT_TYPE"
          - "gv_Object_type"
        - - "OBJECT_NAME"
          - "gv_Object_name"
        - - "REFRESH_FREQUENCY"
          - "gv_Refresh_frequency"
        - - "REFRESH_TYPE"
          - "gv_Refresh_type"
        - - "SOURCE_CUSTOM_QUERY"
          - "gv_Source_custom_query"
        - - "ACTIVE_FLAG"
          - "gv_Active_flag"
        - - "TARGET_TABLE"
          - "gv_Target_table"
