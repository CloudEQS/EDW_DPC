type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_PRODUCT_SCD1:
      type: "table-input"
      parameters:
        componentName: "STG_PRODUCT_SCD1"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "STG_PRODUCT_SCD1"
        columnNames:
        - "PRODUCT_ID"
        - "PRODUCT_NAME"
        - "PRODUCT_CATEGORY"
        - "PRODUCT_SUBCATEGORY"
        - "BRAND_NAME"
        - "PRICE"
        - "CURRENCY_CODE"
        - "SOURCE_SYSTEM"
        - "LOAD_TIMESTAMP"
        timeOffset:
    DIM_PRODUCT_SCD1:
