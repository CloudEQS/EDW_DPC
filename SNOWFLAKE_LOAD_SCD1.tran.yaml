        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_PRODUCT_SCD1"
        targetAlias: "target"
        sourceAlias: "source"
        joinExpression:
        - - "\"target\".\"PRODUCT_ID\"=\"source\".\"PRODUCT_ID\""
          - "Case"
        whenMatched:
        - - "\"target\".\"PRODUCT_ID\"=\"source\".\"PRODUCT_ID\""
          - "Update"
        updateMapping:
        - - "PRODUCT_ID"
          - "PRODUCT_ID"
        - - "PRODUCT_NAME"
          - "PRODUCT_NAME"
        - - "PRODUCT_CATEGORY"
          - "PRODUCT_CATEGORY"
        - - "PRODUCT_SUBCATEGORY"
          - "PRODUCT_SUBCATEGORY"
        - - "BRAND_NAME"
          - "BRAND_NAME"
        - - "PRICE"
          - "PRICE"
        - - "CURRENCY_CODE"
          - "CURRENCY_CODE"
        - - "SOURCE_SYSTEM"
          - "SOURCE_SYSTEM"
        - - "LOAD_TIMESTAMP"
          - "LOAD_TIMESTAMP"
        includeNotMatched: "Yes"
        insertMapping:
        - - "PRODUCT_ID"
          - "PRODUCT_ID"
        - - "PRODUCT_NAME"
          - "PRODUCT_NAME"
        - - "PRODUCT_CATEGORY"
          - "PRODUCT_CATEGORY"
        - - "PRODUCT_SUBCATEGORY"
          - "PRODUCT_SUBCATEGORY"
        - - "BRAND_NAME"
          - "BRAND_NAME"
        - - "PRICE"
          - "PRICE"
        - - "CURRENCY_CODE"
          - "CURRENCY_CODE"
        - - "SOURCE_SYSTEM"
          - "SOURCE_SYSTEM"
        - - "LOAD_TIMESTAMP"
          - "LOAD_TIMESTAMP"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Rank:
      type: "rank"
      sources:
      - "STG_PRODUCT_SCD1"
      parameters:
        componentName: "Rank"
        includeInputColumns: "Yes"
        partitionData:
        - "PRODUCT_NAME"
        orderingWithinPartitions:
        - - "PRODUCT_ID"
          - "Ascending"
        - - "LOAD_TIMESTAMP"
          - "Descending"
        functions:
        - - "Row Number"
          - "rn"
    Filter:
      type: "filter"
      sources:
      - "Rank"
      parameters:
        componentName: "Filter"
        filterConditions:
        - - "rn"
          - "Is"
          - "Equal to"
          - "1"
        combineCondition: "And"
