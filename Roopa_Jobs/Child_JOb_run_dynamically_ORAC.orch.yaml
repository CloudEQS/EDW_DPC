type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Main Pipeline Loop"
      parameters:
        componentName: "Start"
    Identify Ready Jobs:
      type: "python-pushdown"
      transitions:
        success:
        - "Jobs Ready?"
      parameters:
        componentName: "Identify Ready Jobs"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible:\n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])\n\
          # Running SQL against Snowflake\n#   session.sql('CREATE sample_product_data\
          \ (id INT, name VARCHAR, serial_number VARCHAR)').collect()\n# Using Data\
          \ Frames\n#   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes\n\
          ###)\ndef get_ready_jobs(session, context=None):\n    # Fetch all job metadata\
          \ and job status\n    job_metadata_df = session.table(\"JOB_METADATA\")\n\
          \    job_status_df = session.table(\"JOB_STATUS\")\n \n    # Create sets\
          \ for quick lookup\n    completed_job_seqs = {row['JOB_SEQ'] for row in\
          \ job_status_df.filter(job_status_df[\"STATUS\"] == \"COMPLETED\").collect()}\n\
          \    failed_job_seqs = {row['JOB_SEQ'] for row in job_status_df.filter(job_status_df[\"\
          STATUS\"] == \"FAILED\").collect()}\n    running_job_seqs = {row['JOB_SEQ']\
          \ for row in job_status_df.filter(job_status_df[\"STATUS\"] == \"RUNNING\"\
          ).collect()}\n \n    # Get all unique job sequences from metadata\n    all_job_seqs\
          \ = [row['JOB_SEQ'] for row in job_metadata_df.select(\"JOB_SEQ\").distinct().collect()]\n\
          \ \n    ready_to_run_jobs = []\n \n    for job_seq in all_job_seqs:\n  \
          \      # Skip if already completed, failed, or running\n        if job_seq\
          \ in completed_job_seqs or job_seq in failed_job_seqs or job_seq in running_job_seqs:\n\
          \            continue\n \n        # Check current status, assume PENDING\
          \ if missing\n        status_rows = job_status_df.filter(job_status_df[\"\
          JOB_SEQ\"] == job_seq).collect()\n        current_status = status_rows[0]['STATUS']\
          \ if status_rows else 'PENDING'\n \n        if current_status != 'PENDING':\n\
          \            continue\n \n        # Get job name\n        job_name_row =\
          \ job_metadata_df.filter(job_metadata_df[\"JOB_SEQ\"] == job_seq).select(\"\
          JOB_NAME\").distinct().collect()\n        if not job_name_row:\n       \
          \     continue\n        job_name = job_name_row[0]['JOB_NAME']\n \n    \
          \    # Get dependencies for this job (may be multiple rows)\n        dependency_rows\
          \ = job_metadata_df.filter(job_metadata_df[\"JOB_SEQ\"] == job_seq).collect()\n\
          \        dependencies = [row['DEPENDENCY'] for row in dependency_rows if\
          \ row['DEPENDENCY'] is not None]\n \n        # Check if all dependencies\
          \ are completed\n        all_dependencies_met = all(dep in completed_job_seqs\
          \ for dep in dependencies)\n \n        if all_dependencies_met:\n      \
          \      ready_to_run_jobs.append({\"JOB_SEQ\": job_seq, \"JOB_NAME\": job_name})\n\
          \        else:\n            print(f\"DEBUG: Job {job_seq} blocked by: {[d\
          \ for d in dependencies if d not in completed_job_seqs]}\")\n \n    # Format\
          \ for Matillion grid variable\n    grid_data = [[job[\"JOB_SEQ\"], job[\"\
          JOB_NAME\"]] for job in ready_to_run_jobs]\n \n    # Update Matillion context\
          \ if available\n    if context is not None:\n        context.updateGridVariable('gv_ready_jobs',\
          \ grid_data)\n        context.updateVariable('v_ready_job_count', len(ready_to_run_jobs))\n\
          \    else:\n        print(\"Ready Jobs:\", ready_to_run_jobs)\n    \n  \
          \  print(ready_to_run_jobs)\n    print(v_ready_job_count)\n    return ready_to_run_jobs\n\
          \ \n \n# Entry point\nget_ready_jobs(session, context if 'context' in globals()\
          \ else None)\n "
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage: "\r\n\r\n\r\nReady jobs count:${v_ready_job_count}"
        updateScalarVariables: []
    Jobs Ready?:
      type: "if"
      transitions:
        "true":
        - "Grid Iterator"
        "false":
        - " Check Pipeline Completion 2 2"
      parameters:
        componentName: "Jobs Ready?"
        mode: "Simple"
        condition:
        - - "v_ready_job_count"
          - "Is"
          - "Greater than"
          - "0"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Mark Job Running:
      type: "sql-executor"
      parameters:
        componentName: "Mark Job Running"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status \r\nSET STATUS\
          \ = 'RUNNING', \r\n    START_TIME = CURRENT_TIMESTAMP(), \r\n    LAST_UPDATED\
          \ = CURRENT_TIMESTAMP()\r\nWHERE JOB_SEQ = ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
    Run Orchestration:
      type: "run-orchestration"
      parameters:
        componentName: "Run Orchestration"
        orchestrationJob: "EDW STAGE/${v_current_job_name}"
        setScalarVariables:
        - - "v_current_job_seq"
          - "${v_current_job_seq}"
        - - "v_current_job_name"
          - "${v_current_job_name}"
        setGridVariables:
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator 2:
      type: "grid-iterator"
      transitions:
        success:
        - "Grid Iterator 3"
        failure:
        - "Grid Iterator 4"
      iterationTarget: "Run Orchestration"
      parameters:
        componentName: "Grid Iterator 2"
        gridVariable: "gv_ready_jobs"
        gridIteratorVariableMapping:
        - - "job_seq"
          - "v_current_job_seq "
        - - "job_name"
          - "v_current_job_name"
        breakOnFailure: "No"
        concurrency: "Sequential"
      postProcessing:
        updateOutputMessage: ""
        updateScalarVariables:
    Mark Job Failed:
      type: "sql-executor"
      parameters:
        componentName: "Mark Job Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status\r\nSET STATUS\
          \ = 'FAILED',\r\n    END_TIME = CURRENT_TIMESTAMP(),\r\n    LAST_UPDATED\
          \ = CURRENT_TIMESTAMP(),\r\n    ERROR_MESSAGE = 'Job failed during execution\
          \ in Matillion. Check logs for job: ' || '${v_current_job_name}'\r\nWHERE\
          \ JOB_SEQ = ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage: "If Job gets failed marked as Failed in JOB Status: ${v_current_job_name}"
        updateScalarVariables:
    Propagate Downstream Failure:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure"
      parameters:
        componentName: "Propagate Downstream Failure"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status\r\nSET STATUS\
          \ = 'FAILED',\r\n    END_TIME = CURRENT_TIMESTAMP(),\r\n    LAST_UPDATED\
          \ = CURRENT_TIMESTAMP(),\r\n    ERROR_MESSAGE = 'Job failed during execution\
          \ in Matillion. Check logs for job: ' || '${v_current_job_name}'\r\nWHERE\
          \ JOB_SEQ in ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    'Mark Job Completed ':
      type: "sql-executor"
      parameters:
        componentName: "Mark Job Completed "
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status \r\nSET STATUS\
          \ = 'COMPLETED', \r\n    END_TIME = CURRENT_TIMESTAMP(), \r\n    LAST_UPDATED\
          \ = CURRENT_TIMESTAMP(),\r\n    ERROR_MESSAGE='${sysvar.sysvar.thisComponent.status}'\r\
          \nWHERE JOB_SEQ = ${v_current_job_seq}\r\n"
      postProcessing:
        updateOutputMessage: "If Jobs competed successfully update in the job status\
          \ as completed: \r\n\r\n${v_current_job_name}"
        updateScalarVariables:
    Main Pipeline Loop:
      type: "if"
      transitions:
        "true":
        - "Identify Ready Jobs"
        "false":
        - "Pipeline status"
      parameters:
        componentName: "Main Pipeline Loop"
        mode: "Simple"
        condition:
        - - "v_all_jobs_processed"
          - "Is"
          - "Equal to"
          - "False"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage: "Checking All jobs are processed or not: ${v_all_jobs_processed}"
        updateScalarVariables:
    ' Check Pipeline Completion 2':
      type: "query-to-scalar"
      transitions:
        success:
        - "Python Pushdown"
      parameters:
        componentName: " Check Pipeline Completion 2"
        mode: "Advanced"
        query: "SELECT\r\n    COUNT_IF(status = 'COMPLETED') AS COMPLETED_COUNT,\r\
          \n    COUNT_IF(status = 'FAILED' OR status = 'SKIPPED') AS FAILED_SKIPPED_COUNT,\r\
          \n    COUNT_IF(status = 'PENDING' OR status = 'RUNNING') AS PENDING_RUNNING_COUNT,\r\
          \n    -- New: Check if any job is currently RUNNING\r\n    COUNT_IF(status\
          \ = 'RUNNING') AS RUNNING_COUNT\r\nFROM INTERNAL_TRAINING.EDP_CURATED.job_status"
        scalarVariableMapping:
        - - "v_completed_jobs"
          - "COMPLETED_COUNT"
        - - "v_failed_jobs"
          - "FAILED_SKIPPED_COUNT"
        - - "v_pending_running_jobs"
          - "PENDING_RUNNING_COUNT"
        - - "v_running_jobs"
          - "RUNNING_COUNT"
      postProcessing:
        updateOutputMessage: "COMPLETED_JOBS: ${v_completed_jobs}\r\nFAILED_SKIPPED_JOBS:\
          \ ${v_failed_jobs} \r\nPENDING_RUNNING_JOBS: ${v_pending_running_jobs}"
        updateScalarVariables:
    ' Check Pipeline Completion 2 2':
      type: "query-to-scalar"
      parameters:
        componentName: " Check Pipeline Completion 2 2"
        mode: "Advanced"
        query: "SELECT\r\n    COUNT_IF(status = 'COMPLETED') AS COMPLETED_COUNT,\r\
          \n    COUNT_IF(status = 'FAILED' OR status = 'SKIPPED') AS FAILED_SKIPPED_COUNT,\r\
          \n    COUNT_IF(status = 'PENDING' OR status = 'RUNNING') AS PENDING_RUNNING_COUNT,\r\
          \n    -- New: Check if any job is currently RUNNING\r\n    COUNT_IF(status\
          \ = 'RUNNING') AS RUNNING_COUNT\r\nFROM INTERNAL_TRAINING.EDP_CURATED.job_status"
        scalarVariableMapping:
        - - "v_completed_jobs"
          - "COMPLETED_COUNT"
        - - "v_failed_jobs"
          - "FAILED_SKIPPED_COUNT"
        - - "v_pending_running_jobs"
          - "PENDING_RUNNING_COUNT"
        - - "v_running_jobs"
          - "RUNNING_COUNT"
      postProcessing:
        updateOutputMessage: "COMPLETED_JOBS: ${v_completed_jobs}\r\nFAILED_SKIPPED_JOBS:\
          \ ${v_failed_jobs} \r\nPENDING_RUNNING_JOBS: ${v_pending_running_jobs}"
        updateScalarVariables:
    Run Orchestration 2:
      type: "run-orchestration"
      parameters:
        componentName: "Run Orchestration 2"
        orchestrationJob: "Roopa_Jobs/Recusive_job.orch.yaml"
        setScalarVariables:
        - - "v_current_job_name"
          - "${v_current_job_name}"
        - - "v_current_job_seq"
          - "${v_current_job_seq}"
        setGridVariables:
      postProcessing:
        updateOutputMessage: "Re run the pipeline: ${v_current_job_name}"
        updateScalarVariables:
    Final Pipeline Status and Cleanup:
      type: "query-to-scalar"
      transitions:
        success:
        - "End Success"
      parameters:
        componentName: "Final Pipeline Status and Cleanup"
        mode: "Advanced"
        query: "SELECT \r\n    CASE \r\n        WHEN COUNT_IF(status = 'FAILED') >\
          \ 0 THEN 'FAILED' \r\n        WHEN COUNT_IF(status = 'PENDING' OR status\
          \ = 'RUNNING') > 0 THEN 'STALLED_OR_INCOMPLETE' -- Should not happen if\
          \ loop condition is correct \r\n        ELSE 'COMPLETED' \r\n    END AS\
          \ PIPELINE_FINAL_STATUS \r\nFROM INTERNAL_TRAINING.EDP_CURATED.job_status\r\
          \n "
        scalarVariableMapping:
        - - "v_pipeline_status"
          - "PIPELINE_FINAL_STATUS"
      postProcessing:
        updateOutputMessage: "Final Job status :  ${ v_pipeline_status}\r\nCompleted\
          \ Jobs are :${v_current_job_name}"
        updateScalarVariables:
    Pipeline status:
      type: "query-to-scalar"
      parameters:
        componentName: "Pipeline status"
        mode: "Advanced"
        query: "SELECT \r\n    CASE \r\n        WHEN COUNT_IF(status = 'FAILED') >\
          \ 0 THEN 'FAILED' \r\n        WHEN COUNT_IF(status = 'PENDING' OR status\
          \ = 'RUNNING') > 0 THEN 'STALLED_OR_INCOMPLETE' -- Should not happen if\
          \ loop condition is correct \r\n        ELSE 'COMPLETED' \r\n    END AS\
          \ PIPELINE_FINAL_STATUS \r\nFROM INTERNAL_TRAINING.EDP_CURATED.job_status\r\
          \n "
        scalarVariableMapping:
        - - "v_pipeline_status"
          - "PIPELINE_FINAL_STATUS"
      postProcessing:
        updateOutputMessage: "  Pipeline status: ${v_pipeline_status}"
        updateScalarVariables:
    Python Pushdown:
      type: "python-pushdown"
      transitions:
        success:
        - "All Jobs Processed?"
      parameters:
        componentName: "Python Pushdown"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: |-
          ###
          # Variables are directly accessible:
          #   print (myvar)
          # Updating a variable:
          #   context.updateVariable('myvar', 'new-value')
          # Updating a grid variable:
          #   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])
          # Running SQL against Snowflake
          #   session.sql('CREATE sample_product_data (id INT, name VARCHAR, serial_number VARCHAR)').collect()
          # Using Data Frames
          #   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes
          ###)


          if v_pending_running_jobs==0:
               context.updateVariable('v_all_jobs_processed', 'True')
          else:
              context.updateVariable('v_all_jobs_processed', 'False')

          print(v_all_jobs_processed)
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage: "Pending Jobs are :{v_pending_running_jobs}"
        updateScalarVariables:
    All Jobs Processed?:
      type: "if"
      transitions:
        "true":
        - "Final Pipeline Status and Cleanup"
        "false":
        - "Run Orchestration 2"
      parameters:
        componentName: "All Jobs Processed?"
        mode: "Simple"
        condition:
        - - "v_all_jobs_processed"
          - "Is"
          - "Equal to"
          - "True"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator:
      type: "grid-iterator"
      transitions:
        success:
        - "Print Variables"
      iterationTarget: "Mark Job Running"
      parameters:
        componentName: "Grid Iterator"
        gridVariable: "gv_ready_jobs"
        gridIteratorVariableMapping:
        - - "job_seq"
          - "v_current_job_seq"
        breakOnFailure: "No"
        concurrency: "Sequential"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator 3:
      type: "grid-iterator"
      transitions:
        success:
        - " Check Pipeline Completion 2"
      iterationTarget: "Mark Job Completed "
      parameters:
        componentName: "Grid Iterator 3"
        gridVariable: "gv_ready_jobs"
        gridIteratorVariableMapping:
        - - "job_seq"
          - "v_current_job_seq"
        breakOnFailure: "No"
        concurrency: "Sequential"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator 4:
      type: "grid-iterator"
      transitions:
        success:
        - "Propagate Downstream Failure"
      iterationTarget: "Mark Job Failed"
      parameters:
        componentName: "Grid Iterator 4"
        gridVariable: "gv_ready_jobs"
        gridIteratorVariableMapping:
        - - "job_seq"
          - "v_current_job_seq"
        breakOnFailure: "No"
        concurrency: "Sequential"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      transitions:
        success:
        - "Grid Iterator 2"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "gv_ready_jobs"
        prefixText: "Ready Jobs"
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_all_jobs_processed:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "False"
    v_failed_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    V_Final_Failed_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_running_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_pipeline_status:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "RUNNING"
    v_pending_running_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_current_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "JOB_1"
    v_completed_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_total_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_STALLED_OR_INCOMPLETE_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_current_job_seq:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    v_ready_job_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    gv_ready_jobs:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          job_seq:
            columnType: "NUMBER"
          job_name:
            columnType: "TEXT"
      defaultValue:
      - - "1"
        - "JOB_1"
      - - "2"
        - "JOB_2"
