type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_USER_DETAILS:
      type: "table-input"
      parameters:
        componentName: "STG_USER_DETAILS"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "STG_USER_DETAILS"
        columnNames:
        - "WEBSITE"
        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
        - "CITY"
        - "BS"
        - "CATCHPHRASE"
        - "STREET"
        - "ZIPCODE"
        - "SUITE"
        - "LATITUDE"
        - "LONGITUDE"
        - "LOAD_TIME"
        timeOffset:
    DIM_USER_DETAILS_SCD2:
      type: "table-input"
      parameters:
        componentName: "DIM_USER_DETAILS_SCD2"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_USER_DETAILS_SCD2"
        columnNames:
        - "WEBSITE"
        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
