      parameters:
        componentName: "DIM_USER_DETAILS_SCD2 3"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_USER_DETAILS_SCD2"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "compare_WEBSITE"
          - "WEBSITE"
        - - "compare_EMP_ID"
          - "EMP_ID"
        - - "compare_EMP_NAME"
          - "EMP_NAME"
        - - "compare_USER_NAME"
          - "USER_NAME"
        - - "compare_COMPANY_NAME"
