        - - "V_END_DATE_UP"
          - "END_TIME"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    DIM_USER_DETAILS_SCD2 4:
      type: "table-update"
      sources:
      - "Calculator 3"
      parameters:
        componentName: "DIM_USER_DETAILS_SCD2 4"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_USER_DETAILS_SCD2"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"EMP_ID\"=\"target\".\"EMP_ID\"AND\"input\".\"END_TIME\" IS\
            \ NULL AND\"input\".\"LOAD_TIME\"=\"target\".\"LOAD_TIME\""
          - "Case"
        whenMatched:
        - - "\"input\".\"EMP_ID\"=\"target\".\"EMP_ID\"AND\"input\".\"END_TIME\" IS\
            \ NULL AND\"input\".\"LOAD_TIME\"=\"target\".\"LOAD_TIME\""
          - "Update"
        updateMapping:
        - - "OLD_END_DATE"
          - "END_TIME"
        includeNotMatched: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
