type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_CUSTOMER:
      type: "table-input"
      parameters:
        componentName: "STG_CUSTOMER"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "STG_CUSTOMER"
        columnNames:
        - "CUSTOMER_ID"
        - "CUSTOMER_NAME"
        - "CUST_EMAIL"
        - "COUNTRY"
        timeOffset:
    Detect Changes:
      type: "detect-changes"
      sources:
      - "STG_CUSTOMER"
      - "SQL"
      parameters:
        componentName: "Detect Changes"
        masterTable: "SQL"
        matchKeys:
        - "CUSTOMER_ID"
        compareColumns:
        - "CUSTOMER_NAME"
        - "CUST_EMAIL"
        outputColumnMapping:
        - - "compare_CUSTOMER_NAME"
          - "V_CUSTOMER_NAME"
        - - "compare_CUST_EMAIL"
          - "V_CUST_EMAIL"
        - - "compare_CUSTOMER_ID"
          - "V_CUSTOMER_ID"
        - - "compare_COUNTRY"
          - "V_COUNTRY"
        indicatorColumn: "Indicator"
    SQL:
      type: "sql"
      parameters:
        componentName: "SQL"
        query: "SELECT * FROM EDW_LAB.PUBLIC.DIM_CUSTOMER WHERE END_TIME IS NULL"
    CHANGED:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "CHANGED"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "And"
    NEW DATA:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "NEW DATA"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "N"
        combineCondition: "And"
    Assign load and end time for new and updated records:
      type: "calculator"
      sources:
      - "Unite"
      parameters:
        componentName: "Assign load and end time for new and updated records"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "NEW_LOAD_TIME"
        - - "NULL"
          - "NEW_END_TIME"
    DIM_CUSTOMER _INSERT_OR_UPDATE:
      type: "table-output"
      sources:
      - "Assign load and end time for new and updated records"
      parameters:
        componentName: "DIM_CUSTOMER _INSERT_OR_UPDATE"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_CUSTOMER"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "V_CUSTOMER_ID"
          - "CUSTOMER_ID"
        - - "V_CUSTOMER_NAME"
          - "CUSTOMER_NAME"
        - - "V_CUST_EMAIL"
          - "CUST_EMAIL"
        - - "V_COUNTRY"
          - "COUNRTY"
        - - "NEW_LOAD_TIME"
          - "LOAD_TIME"
        - - "NEW_END_TIME"
          - "END_TIME"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Unite:
      type: "unite"
      sources:
      - "NEW DATA"
      - "CHANGED"
      parameters:
        componentName: "Unite"
        method: "All Columns"
        castTypes: "Yes"
        addSourceComponentColumn: "No"
        removeDuplicates: "No"
    Assign load and end time for expired records:
      type: "calculator"
      sources:
      - "CHANGED"
      parameters:
        componentName: "Assign load and end time for expired records"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_TIMESTAMP()"
          - "OLD_LOAD_TIME"
        - - "CURRENT_TIMESTAMP()"
          - "OLD_END_TIME"
    DIM_CUSTOMER _UPDATE _OLD_FLAG:
      type: "table-update"
      sources:
      - "Assign load and end time for expired records"
      parameters:
        componentName: "DIM_CUSTOMER _UPDATE _OLD_FLAG"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_CUSTOMER"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"CUSTOMER_ID\"=\"target\".\"CUSTOMER_ID\""
          - "Case"
        whenMatched:
        - - "\"input\".\"CUSTOMER_ID\"=\"target\".\"CUSTOMER_ID\""
          - "Update"
        updateMapping:
        - - "OLD_LOAD_TIME"
          - "LOAD_TIME"
        - - "OLD_LOAD_TIME"
          - "END_TIME"
        includeNotMatched: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
design:
  components:
    STG_CUSTOMER:
      position:
        x: -460
        "y": -110
      tempMetlId: 1
    Detect Changes:
      position:
        x: -260
        "y": -30
      tempMetlId: 2
    SQL:
      position:
        x: -480
        "y": 40
      tempMetlId: 4
    CHANGED:
      position:
        x: -40
        "y": 40
      tempMetlId: 5
    NEW DATA:
      position:
        x: -40
        "y": -120
      tempMetlId: 6
    Assign load and end time for new and updated records:
      position:
        x: 260
        "y": -60
      tempMetlId: 7
    DIM_CUSTOMER _INSERT_OR_UPDATE:
      position:
        x: 410
        "y": -60
      tempMetlId: 8
    Unite:
      position:
        x: 140
        "y": -60
      tempMetlId: 9
    Assign load and end time for expired records:
      position:
        x: 160
        "y": 80
      tempMetlId: 10
    DIM_CUSTOMER _UPDATE _OLD_FLAG:
      position:
        x: 370
        "y": 80
      tempMetlId: 11
