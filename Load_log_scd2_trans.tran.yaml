          fromGrid:
            variable: "gv_load_log_scd"
            columns:
            - "jv_load_id"
            - "jv_job_name"
            - "jv_table_name"
            - "jv_inserted_rows"
            - "jv_updated_rows"
            - "jv_status"
            - "jv_start_time"
            - "jv_end_time"
