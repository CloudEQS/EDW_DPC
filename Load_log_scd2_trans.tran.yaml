          - ""
          - ""
        - - "jv_start_time"
          - "TIMESTAMP"
          - ""
          - ""
        - - "jv_end_time"
          - "TIMESTAMP"
          - ""
          - ""
        - - "jv_error_message"
          - "VARIANT"
          - ""
          - ""
