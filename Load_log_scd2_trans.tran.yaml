          - ""
          - ""
        - - "jv_job_name"
          - "VARCHAR"
          - ""
          - ""
        - - "jv_table_name"
          - "VARCHAR"
          - ""
          - ""
        - - "jv_inserted_rows"
          - "Number"
          - ""
          - ""
        - - "jv_updated_rows"
          - "Number"
          - ""
          - ""
        - - "jv_status"
