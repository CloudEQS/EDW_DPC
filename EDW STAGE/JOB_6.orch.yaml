type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Run Transformation"
      parameters:
        componentName: "Start"
    Run Transformation:
      type: "run-transformation"
      transitions:
        success:
        - "JOB 6 End Success"
        failure:
        - "JOB 6 End Failure"
      parameters:
        componentName: "Run Transformation"
        transformationJob: "EDW STAGE/Tjob6.tran.yaml"
        setScalarVariables:
        - - "v_current_table_name"
          - "${v_current_table_name}"
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "v_error_message"
          - "${sysvar.childPipeline.vars.v_error_message}"
        - - "v_row_count"
          - "${sysvar.childPipeline.vars.v_row_count}"
    JOB 6 End Failure:
      type: "end-failure"
      parameters:
        componentName: "JOB 6 End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    JOB 6 End Success:
      type: "end-success"
      parameters:
        componentName: "JOB 6 End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_row_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_current_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "JOB_6"
    v_current_job_seq:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "6"
    v_current_table_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
design:
  components:
    Start:
      position:
        x: -70
        "y": 0
      tempMetlId: 1
    Run Transformation:
      position:
        x: 160
        "y": 0
      tempMetlId: 2
    JOB 6 End Failure:
      position:
        x: 460
        "y": 50
      tempMetlId: 3
    JOB 6 End Success:
      position:
        x: 440
        "y": -70
      tempMetlId: 4
