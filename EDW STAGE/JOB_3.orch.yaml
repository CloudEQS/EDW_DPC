type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Run Trans_JOB3"
      parameters:
        componentName: "Start"
    Run Trans_JOB3:
      type: "run-transformation"
      transitions:
        success:
        - "Job 3 End Success"
        failure:
        - " JOB 3 End Failure"
      parameters:
        componentName: "Run Trans_JOB3"
        transformationJob: "EDW STAGE/Trans_JOB3.tran.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Job 3 End Success:
      type: "end-success"
      parameters:
        componentName: "Job 3 End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    ' JOB 3 End Failure':
      type: "end-failure"
      parameters:
        componentName: " JOB 3 End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_current_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_current_job_seq:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
design:
  components:
    Start:
      position:
        x: -120
        "y": -10
      tempMetlId: 1
    Run Trans_JOB3:
      position:
        x: 20
        "y": 0
      tempMetlId: 2
    Job 3 End Success:
      position:
        x: 130
        "y": -50
      tempMetlId: 3
    ' JOB 3 End Failure':
      position:
        x: 150
        "y": 60
      tempMetlId: 4
