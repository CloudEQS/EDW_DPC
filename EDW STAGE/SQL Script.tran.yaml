type: "transformation"
version: "1.0"
pipeline:
  components:
    SQL:
      type: "sql"
      parameters:
        componentName: "SQL"
        query: "WITH dependencies AS (\r\n    SELECT \r\n        jm.job_seq, \r\n\
          \        jm.job_name, \r\n        jm.dependency, \r\n        js.status AS\
          \ dependency_status\r\n    FROM edw_lab.public.job_metadata jm\r\n    LEFT\
          \ JOIN edw_lab.public.job_status js\r\n        ON jm.dependency = js.job_seq\r\
          \n),\r\naggregated AS (\r\n    SELECT\r\n        job_seq,\r\n        job_name,\r\
          \n        COUNT(dependency) AS total_deps,\r\n        COUNT(CASE WHEN dependency_status\
          \ = 'COMPLETED' THEN 1 END) AS completed_deps\r\n          FROM dependencies\r\
          \n    GROUP BY job_seq, job_name\r\n)\r\nSELECT a.job_seq, a.job_name\r\n\
          FROM aggregated a\r\nLEFT JOIN edw_lab.public.job_status js\r\n   ON a.job_seq\
          \ = js.job_seq\r\nWHERE js.job_seq IS NULL\r\n AND (a.total_deps = 0 OR\
          \ a.total_deps = a.completed_deps)\r\n"
design:
  components:
    SQL:
      position:
        x: 0
        "y": 0
      tempMetlId: 1
