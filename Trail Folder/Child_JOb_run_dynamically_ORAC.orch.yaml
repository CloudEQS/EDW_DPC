type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Main Pipeline Loop"
      parameters:
        componentName: "Start"
    Identify Ready Jobs:
      type: "python-pushdown"
      transitions:
        success:
        - "Jobs Ready?"
      parameters:
        componentName: "Identify Ready Jobs"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible:\n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])\n\
          # Running SQL against Snowflake\n#   session.sql('CREATE sample_product_data\
          \ (id INT, name VARCHAR, serial_number VARCHAR)').collect()\n# Using Data\
          \ Frames\n#   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes\n\
          ###)\n\n\n\nimport _snowflake # Or your relevant data warehouse connection\
          \ \nimport json \n\n \ndef get_ready_jobs(session): \n    # Fetch all job\
          \ metadata \n    job_metadata_df = session.table(\"JOB_METADATA\") \n  \
          \  print(job_metadata_df.to_pandas())\n\n    # Fetch current job statuses\
          \ \n    job_status_df = session.table(\"JOB_STATUS\") \n    print(job_status_df.to_pandas())\n\
          \ \n    # Get completed and failed job sequences \n    completed_job_seqs\
          \ = [row['JOB_SEQ'] for row in job_status_df.filter(job_status_df[\"STATUS\"\
          ] == \"COMPLETED\").collect()] \n    failed_job_seqs = [row['JOB_SEQ'] for\
          \ row in job_status_df.filter(job_status_df[\"STATUS\"] == \"FAILED\").collect()]\
          \ \n \n    # Get jobs that are currently running or pending execution (to\
          \ avoid re-triggering within the same cycle) \n    # We fetch this every\
          \ loop to ensure we don't pick up jobs that just got launched. \n    running_job_seqs\
          \ = [row['JOB_SEQ'] for row in job_status_df.filter(job_status_df[\"STATUS\"\
          ] == 'RUNNING').collect()] \n    pending_job_seqs = [row['JOB_SEQ'] for\
          \ row in job_status_df.filter(job_status_df[\"STATUS\"] == 'PENDING').collect()]\
          \ \n \n \n    all_job_seqs_in_metadata = [row['JOB_SEQ'] for row in job_metadata_df.select(\"\
          JOB_SEQ\").distinct().collect()] \n \n    ready_to_run_jobs = [] \n \n \
          \   for job_seq in all_job_seqs_in_metadata: \n        # Skip if job is\
          \ already completed, failed, or currently running/pending \n        if job_seq\
          \ in completed_job_seqs or job_seq in failed_job_seqs or job_seq in running_job_seqs:\
          \ \n            continue \n \n        # Check if this job_seq is still 'PENDING'\
          \ from the status table \n        # This handles cases where a job was marked\
          \ PENDING but wasn't picked up yet or had issues \n        current_status_rows\
          \ = job_status_df.filter(job_status_df[\"JOB_SEQ\"] == job_seq).collect()\
          \ \n        if not current_status_rows or current_status_rows[0]['STATUS']\
          \ != 'PENDING': \n            continue # Only process jobs that are explicitly\
          \ PENDING in job_status \n \n        # Get job_name and all dependencies\
          \ for the current job_seq \n        current_job_name_rows = job_metadata_df.filter(job_metadata_df[\"\
          JOB_SEQ\"] == job_seq).select(\"JOB_NAME\").distinct().collect() \n    \
          \    if not current_job_name_rows: \n            continue # Should not happen\
          \ if job_seq is from metadata \n \n        job_name = current_job_name_rows[0]['JOB_NAME']\
          \ \n \n        # Collect all dependencies for this job_seq (it might appear\
          \ multiple times if it has multiple dependencies) \n        dependencies_for_job\
          \ = [ \n            row['DEPENDENCY'] for row in job_metadata_df.filter(job_metadata_df[\"\
          JOB_SEQ\"] == job_seq).collect() \n            if row['DEPENDENCY'] is not\
          \ None \n        ] \n \n        all_dependencies_met = True \n        if\
          \ dependencies_for_job: \n            for dep_seq in dependencies_for_job:\
          \ \n                if dep_seq not in completed_job_seqs: \n           \
          \         all_dependencies_met = False \n                    break \n \n\
          \        # If no dependencies or all dependencies met \n        if all_dependencies_met:\
          \ \n            ready_to_run_jobs.append({\"JOB_SEQ\": job_seq, \"JOB_NAME\"\
          : job_name}) \n \n    # Prepare data for Matillion Grid Variable \n    grid_data\
          \ = [[job['JOB_SEQ'], job['JOB_NAME']] for job in ready_to_run_jobs] \n\
          \ \n    # Update Matillion Grid Variable and scalar variable \n    if 'context'\
          \ in locals(): # Check if running in Matillion DPC context \n        context.updateGridVariable('gv_ready_jobs',\
          \ grid_data, ['job_seq', 'job_name']) \n        context.updateVariable('v_ready_job_count',\
          \ len(ready_to_run_jobs)) \n    else: \n        print(f\"DEBUG: Found {len(ready_to_run_jobs)}\
          \ ready jobs: {ready_to_run_jobs}\") \n \n    return ready_to_run_jobs \n\
          \ \nget_ready_jobs(session)\n\n# if 'context' in locals(): \n#     session\
          \ = _snowflake.get_active_session() \n#     get_ready_jobs(session) \n#\
          \ else: \n#     # Local testing placeholder (replace with a mock session\
          \ if needed) \n#     print(\"Running in local test mode (Matillion context\
          \ not available).\") \n#     # For actual local testing, you'd need to mock\
          \ _snowflake.get_active_session() \n"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables: []
    Jobs Ready?:
      type: "if"
      transitions:
        "true":
        - "Mark Job Running"
        "false":
        - "Query Result To Scalar 1"
      parameters:
        componentName: "Jobs Ready?"
        mode: "Simple"
        condition:
        - - "${v_ready_job_count}"
          - "Is"
          - "Greater than"
          - "0"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    All Jobs Processed?:
      type: "if"
      parameters:
        componentName: "All Jobs Processed?"
        mode: "Advanced"
        condition1: "If ${v_pending_running_jobs} =0:  \r\n    v_all_jobs_processed\
          \ = 'True'\r\nElse \r\n    v_all_jobs_processed = 'False'"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Mark Job Running:
      type: "sql-executor"
      transitions:
        success:
        - "Grid Iterator 2"
      parameters:
        componentName: "Mark Job Running"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE edw_lab.public.job_status\r\nSET STATUS = 'RUNNING',\r\n\
          \    START_TIME = CURRENT_TIMESTAMP(),\r\n    LAST_UPDATED = CURRENT_TIMESTAMP()\r\
          \nWHERE job_seq = ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage: "Updated as Running if jobs are ready to run"
        updateScalarVariables:
    Run Orchestration:
      type: "run-orchestration"
      parameters:
        componentName: "Run Orchestration"
        orchestrationJob: "EDW STAGE/${v_current_job_name}"
        setScalarVariables:
        - - "v_current_job_seq"
          - "${v_current_job_seq}"
        - - "v_current_job_name"
          - "${v_current_job_name"
        setGridVariables:
      postProcessing:
        updateOutputMessage: "Jobs are running dynamicaly Current Job is :${v_current_job_name}"
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator 2:
      type: "grid-iterator"
      transitions:
        success:
        - "Mark Job Completed "
        failure:
        - "Mark Job Failed"
      iterationTarget: "Run Orchestration"
      parameters:
        componentName: "Grid Iterator 2"
        gridVariable: "gv_ready_jobs"
        gridIteratorVariableMapping:
        - - "job_seq"
          - "v_current_job_seq "
        - - "job_name"
          - "v_current_job_name"
        breakOnFailure: "No"
        concurrency: "Concurrent"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Mark Job Failed:
      type: "sql-executor"
      transitions:
        success:
        - "Propagate Downstream Failure"
      parameters:
        componentName: "Mark Job Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE edw_lab.public.job_status\r\nSET STATUS = 'FAILED',\r\n\
          \    END_TIME = CURRENT_TIMESTAMP(),\r\n    LAST_UPDATED = CURRENT_TIMESTAMP(),\r\
          \n    ERROR_MESSAGE = 'Job failed during execution in Matillion. Check logs\
          \ for job: ' || '${v_current_job_name}'\r\nWHERE JOB_SEQ = ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage: "If Job gets failed marked as Failed in JOB Status: ${v_current_job_seq}"
        updateScalarVariables:
    Propagate Downstream Failure:
      type: "sql-executor"
      transitions:
        success:
        - "End Failure"
      parameters:
        componentName: "Propagate Downstream Failure"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE edw_lab.public.job_status\r\nSET STATUS = 'FAILED',\r\n\
          \    END_TIME = CURRENT_TIMESTAMP(),\r\n    LAST_UPDATED = CURRENT_TIMESTAMP(),\r\
          \n    ERROR_MESSAGE = 'Job failed during execution in Matillion. Check logs\
          \ for job: ' || '${v_current_job_name}'\r\nWHERE JOB_SEQ = ${v_current_job_seq}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    'Mark Job Completed ':
      type: "sql-executor"
      transitions:
        success:
        - " Check Pipeline Completion 2"
      parameters:
        componentName: "Mark Job Completed "
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE edw_lab.public.job_status \r\nSET STATUS = 'COMPLETED',\
          \ \r\n    END_TIME = CURRENT_TIMESTAMP(), \r\n    LAST_UPDATED = CURRENT_TIMESTAMP()\
          \ \r\nWHERE JOB_SEQ = ${v_current_job_seq}\r\n"
      postProcessing:
        updateOutputMessage: "If Jobs competed successfully update in the job status\
          \ as completed"
        updateScalarVariables:
    'Final Pipeline Status ':
      type: "run-transformation"
      parameters:
        componentName: "Final Pipeline Status "
        transformationJob: "Trail Folder/Final Pipeline Status_trans.tran.yaml"
        setScalarVariables:
        - - "v_pipeline_status"
          - "PIPELINE_FINAL_STATUS"
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Main Pipeline Loop:
      type: "if"
      transitions:
        "true":
        - "Final Pipeline Status "
        - "Identify Ready Jobs"
      parameters:
        componentName: "Main Pipeline Loop"
        mode: "Simple"
        condition:
        - - "${v_all_jobs_processed}"
          - "Is"
          - "Equal to"
          - "False"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage: "Checking All jobs are processed or not: ${v_all_jobs_processed}"
        updateScalarVariables:
    ' Check Pipeline Completion 2':
      type: "query-to-scalar"
      transitions:
        success:
        - "All Jobs Processed?"
      parameters:
        componentName: " Check Pipeline Completion 2"
        mode: "Advanced"
        query: "SELECT\r\n    COUNT_IF(status = 'COMPLETED') AS COMPLETED_COUNT,\r\
          \n    COUNT_IF(status = 'FAILED' OR status = 'SKIPPED') AS FAILED_SKIPPED_COUNT,\r\
          \n    COUNT_IF(status = 'PENDING' OR status = 'RUNNING') AS PENDING_RUNNING_COUNT,\r\
          \n    -- New: Check if any job is currently RUNNING\r\n    COUNT_IF(status\
          \ = 'RUNNING') AS RUNNING_COUNT\r\nFROM edw_lab.public.job_status"
        scalarVariableMapping:
        - - "v_completed_jobs"
          - "COMPLETED_COUNT"
        - - "v_failed_jobs"
          - "FAILED_SKIPPED_COUNT"
        - - "v_pending_running_jobs"
          - "PENDING_RUNNING_COUNT"
        - - "v_running_jobs"
          - "RUNNING_COUNT"
      postProcessing:
        updateOutputMessage: "COMPLETED_JOBS: ${v_completed_jobs}\r\nFAILED_SKIPPED_JOBS:\
          \ {v_failed_jobs} \r\nPENDING_RUNNING_JOBS: ${v_pending_running_jobs}"
        updateScalarVariables:
    Query Result To Scalar 1:
      type: "query-to-scalar"
      parameters:
        componentName: "Query Result To Scalar 1"
        mode: "Advanced"
        query: "SELECT\r\n    COUNT_IF(status = 'COMPLETED') AS COMPLETED_COUNT,\r\
          \n    COUNT_IF(status = 'FAILED' OR status = 'SKIPPED') AS FAILED_SKIPPED_COUNT,\r\
          \n    COUNT_IF(status = 'PENDING' OR status = 'RUNNING') AS PENDING_RUNNING_COUNT,\r\
          \n    -- New: Check if any job is currently RUNNING\r\n    COUNT_IF(status\
          \ = 'RUNNING') AS RUNNING_COUNT\r\nFROM edw_lab.public.job_status"
        scalarVariableMapping:
        - - "v_completed_jobs"
          - "COMPLETED_COUNT"
        - - "v_failed_jobs"
          - "FAILED_SKIPPED_COUNT"
        - - "v_pending_running_jobs"
          - "PENDING_RUNNING_COUNT"
        - - "v_running_jobs"
          - "RUNNING_COUNT"
      postProcessing:
        updateOutputMessage: "COMPLETED_JOBS: ${v_completed_jobs}\r\nFAILED_SKIPPED_JOBS:\
          \ {v_failed_jobs} \r\nPENDING_RUNNING_JOBS: ${v_pending_running_jobs}"
        updateScalarVariables:
  variables:
    v_all_jobs_processed:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "False"
    v_failed_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_pipeline_status:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "RUNNING"
    v_running_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_current_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "JOB_1"
    v_pending_running_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_completed_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_current_job_seq:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    v_total_jobs:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    v_ready_job_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    gv_ready_jobs:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          job_seq:
            columnType: "NUMBER"
          job_name:
            columnType: "TEXT"
      defaultValue: []
