    parallel_jobs_grid:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          p_JOB_ID:
            columnType: "NUMBER"
          p_JOB_NAME:
            columnType: "TEXT"
          p_DEPENDENIES_ON_JOB_ID:
            columnType: "NUMBER"
          p_RUN_TYPE:
            columnType: "TEXT"
          p_EXECUTION_ORDER:
            columnType: "NUMBER"
          p_JOB_GROUP_ID:
            columnType: "TEXT"
          p_ACTIVE_FLAG:
            columnType: "TEXT"
      defaultValue: []
    GV_JOB_METADATA_TABLE:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          GV_JOB_ID:
            columnType: "NUMBER"
          GV_JOB_NAME:
            columnType: "TEXT"
          GV_DEPENDENIES_ON_JOB_ID:
            columnType: "NUMBER"
          GV_RUN_TYPE:
            columnType: "TEXT"
          GV_EXECUTION_ORDER:
            columnType: "NUMBER"
          GV_JOB_GROUP_ID:
            columnType: "TEXT"
          GV_ACTIVE_FLAG:
            columnType: "TEXT"
