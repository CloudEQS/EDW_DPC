    sequential_jobs_grid:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          s_JOB_ID:
            columnType: "NUMBER"
          s_JOB_NAME:
            columnType: "TEXT"
          s_DEPENDENIES_ON_JOB_ID:
            columnType: "NUMBER"
          s_RUN_TYPE:
            columnType: "TEXT"
          s_EXECUTION_ORDER:
            columnType: "NUMBER"
          s_JOB_GROUP_ID:
            columnType: "TEXT"
          s_ACTIVE_FLAG:
            columnType: "TEXT"
      defaultValue: []
    GV_JOB_METADATA_TABLE_New:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          Jv_Job_Name:
            columnType: "TEXT"
          Jv_Job_Id:
            columnType: "NUMBER"
          Jv_Dependency_id:
            columnType: "NUMBER"
      defaultValue: []
