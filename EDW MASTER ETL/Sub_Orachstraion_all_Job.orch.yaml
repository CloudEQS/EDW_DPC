type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Query Result To Grid"
      parameters:
        componentName: "Start"
    Query Result To Grid:
      type: "query-to-grid"
      transitions:
        success:
        - "Python Pushdown"
      parameters:
        componentName: "Query Result To Grid"
        mode: "Basic"
        gridVariable: "GV_JOB_METADATA_TABLE"
        gridVariableMapping:
        - - "JOB_ID"
          - "GV_JOB_ID"
        - - "JOB_NAME"
          - "GV_JOB_NAME"
        - - "DEPENDENIES_ON_JOB_ID"
          - "GV_DEPENDENIES_ON_JOB_ID"
        - - "RUN_TYPE"
          - "GV_RUN_TYPE"
        - - "EXECUTION_ORDER"
          - "GV_EXECUTION_ORDER"
        - - "JOB_GROUP_ID"
          - "GV_JOB_GROUP_ID"
        - - "ACTIVE_FLAG"
          - "GV_ACTIVE_FLAG"
        database: "EDW_LAB"
        schema: "PUBLIC"
        table: "JOB_METADATA_TABLE"
        tableColumns:
        - "JOB_ID"
        - "JOB_NAME"
        - "DEPENDENIES_ON_JOB_ID"
        - "RUN_TYPE"
        - "EXECUTION_ORDER"
        - "JOB_GROUP_ID"
        - "ACTIVE_FLAG"
        orderBy:
        sort: "Ascending"
        limit: "100"
        filterConditions:
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown:
      type: "python-pushdown"
      transitions:
        success:
        - "Grid Iterator 2 2"
        - "Grid Iterator 2"
      parameters:
        componentName: "Python Pushdown"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible:\n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',[['list','of'],['lists','!']])\n\
          # Running SQL against Snowflake\n#   session.sql('CREATE sample_product_data\
          \ (id INT, name VARCHAR, serial_number VARCHAR)').collect()\n# Using Data\
          \ Frames\n#   See here: https://docs.snowflake.com/en/developer-guide/snowpark/python/working-with-dataframes\n\
          ###)\nprint(GV_JOB_METADATA_TABLE)\nprint(Completed_job_list)\n \ndef dpc_python_script():\n\
          \    # Step 1: Read job metadata and completed jobs list\n    job_metadata\
          \ = GV_JOB_METADATA_TABLE  # Grid variable containing job metadata\n   \
          \ completed_jobs_str = Completed_job_list  # Completed jobs list as comma-separated\
          \ string\n \n    # Step 2: Convert completed jobs list to a set of job IDs\n\
          \    completed_jobs = set()\n    for x in completed_jobs_str.split(','):\n\
          \        x_clean = x.strip()\n        if x_clean.isdigit():\n          \
          \  completed_jobs.add(int(x_clean))\n \n    # Step 3: Initialize lists for\
          \ parallel and sequential jobs\n    parallel_jobs = []\n    sequential_jobs\
          \ = []\n \n    # Step 4: Process each job metadata and filter based on dependencies\
          \ and active status\n    for job in job_metadata:\n        GV_JOB_ID = job[0]\n\
          \        GV_JOB_NAME = job[1]\n        GV_DEPENDENIES_ON_JOB_ID = job[2]\n\
          \        GV_RUN_TYPE = job[3]\n        GV_EXECUTION_ORDER = job[4]\n   \
          \     GV_JOB_GROUP_ID = job[5]\n        GV_ACTIVE_FLAG = job[6]\n      \
          \ \n       \n        job_id = int(GV_JOB_ID)\n        run_type = GV_RUN_TYPE.lower()\
          \ # 'parallel' or 'sequentially'\n        dependency = int(GV_DEPENDENIES_ON_JOB_ID)\
          \ if GV_DEPENDENIES_ON_JOB_ID else 0\n        active = GV_ACTIVE_FLAG.lower()\
          \ == 'true'\n \n \n        # Step 4.1: Skip inactive jobs or already completed\
          \ jobs\n        if not active or job_id in completed_jobs:\n           \
          \ continue\n \n        # Step 4.2: Check if the dependency is met (job can\
          \ run if dependency is 0 or already completed)\n        # if dependency\
          \ == 0 or dependency in completed_jobs:\n        #     if run_type == 'parallel':\n\
          \        #         parallel_jobs.append(job)  # Add to parallel jobs list\n\
          \        #     else:\n        #         sequential_jobs.append(job)  # Add\
          \ to sequential jobs list\n        if run_type == 'parallel':\n        \
          \    parallel_jobs.append(job)  # Add to parallel jobs list\n        else:\n\
          \            sequential_jobs.append(job)  # Add to sequential jobs list\n\
          \ \n    # Step 5: Output the jobs to Matillion grids\n    context.updateGridVariable('parallel_jobs_grid',parallel_jobs)\
          \ # Parallel jobs to be run in parallel\n    print(parallel_jobs_grid)\n\
          \    context.updateGridVariable('sequential_jobs_grid',sequential_jobs)\
          \ # Sequential jobs to be run in order\n    print(sequential_jobs_grid)\n\
          \    flag = 'True' if (parallel_jobs or sequential_jobs) else 'False'  #\
          \ Flag to indicate if jobs remain\n    context.updateVariable('v_jobs_remaining',\
          \ flag)\n \n    # Step 6: Log the results for tracking\n    print(f\"Parallel\
          \ Jobs: {len(parallel_jobs)} | Sequential Jobs: {len(sequential_jobs)}\"\
          )\n    print(f\"Jobs Remaining: {v_jobs_remaining}\")\n   \n   \n# calling\
          \ the function\ndpc_python_script()"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Main_Source_Selector 0:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "Main_Source_Selector 0"
        orchestrationJob: "EDW STAGE/${Jv_job_name}"
        setScalarVariables:
        - - "Jv_job_name"
          - "${Jv_job_name}"
        - - "jv_active_flag"
          - "${jv_active_flag}"
        - - "jv_run_type"
          - "${jv_run_type}"
        - - "jv_dependenies_on_job_id"
          - "${jv_dependenies_on_job_id}"
        - - "jv_execution_order"
          - "${jv_execution_code}"
        - - "jv_job_group_id"
          - "${jv_job_group_id}"
        - - "Jv_job_id"
          - "${Jv_job_id}"
        setGridVariables:
    Grid Iterator 2:
      type: "grid-iterator"
      transitions:
        success:
        - "End Success"
        failure:
        - "End Failure"
      iterationTarget: "Main_Source_Selector 0"
      parameters:
        componentName: "Grid Iterator 2"
        gridVariable: "parallel_jobs_grid"
        gridIteratorVariableMapping:
        - - "p_JOB_ID"
          - "Jv_job_id"
        - - "p_JOB_NAME"
          - "Jv_job_name"
        - - "p_DEPENDENIES_ON_JOB_ID"
          - "jv_dependenies_on_job_id"
        - - "p_RUN_TYPE"
          - "jv_run_type"
        - - "p_EXECUTION_ORDER"
          - "jv_execution_code"
        - - "p_JOB_GROUP_ID"
          - "jv_job_group_id"
        - - "p_ACTIVE_FLAG"
          - "jv_active_flag"
        concurrency: "Concurrent"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Grid Iterator 2 2:
      type: "grid-iterator"
      transitions:
        success:
        - "End Success 2"
        failure:
        - "End Failure 2"
      iterationTarget: "Main_Source_Selector 0 2"
      parameters:
        componentName: "Grid Iterator 2 2"
        gridVariable: "sequential_jobs_grid"
        gridIteratorVariableMapping:
        - - "s_JOB_ID"
          - "Jv_job_id"
        - - "s_JOB_NAME"
          - "Jv_job_name"
        - - "s_DEPENDENIES_ON_JOB_ID"
          - "jv_dependenies_on_job_id"
        - - "s_ACTIVE_FLAG"
          - "jv_run_type"
        breakOnFailure: "No"
        concurrency: "Sequential"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Main_Source_Selector 0 2:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "Main_Source_Selector 0 2"
        orchestrationJob: "EDW STAGE/${Jv_job_name}"
        setScalarVariables:
        - - "Jv_job_name"
          - "${Jv_job_name}"
        - - "jv_active_flag"
          - "${jv_active_flag}"
        - - "jv_run_type"
          - "${jv_run_type}"
        - - "jv_dependenies_on_job_id"
          - "${jv_dependenies_on_job_id}"
        - - "jv_execution_order"
          - "${jv_execution_code}"
        - - "jv_job_group_id"
          - "${jv_job_group_id}"
        - - "Jv_job_id"
          - "${Jv_job_id}"
        setGridVariables:
    End Success 2:
      type: "end-success"
      parameters:
        componentName: "End Success 2"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure 2:
      type: "end-failure"
      parameters:
        componentName: "End Failure 2"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    SV_Job_group_id:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_active_flag:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "True"
    jv_dependenies_on_job_id:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "0"
    SV_Active_Flag:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_job_group_id:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "A"
    Completed_job_list:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "'  '"
    SV_JOB_NAME:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jobs_remaining:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    v_jobs_remaining:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "\"True\""
    Jv_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "JOB_1"
    jv_execution_code:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    jv_run_type:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "PARALLEL"
    Jv_job_id:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    Sv_Execution_order:
      metadata:
