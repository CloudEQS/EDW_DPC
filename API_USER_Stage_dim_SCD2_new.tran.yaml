        - - "compare_SUITE"
          - "compare_SUITE"
        - - "compare_LATITUDE"
          - "compare_LATITUDE"
        - - "compare_LONGITUDE"
          - "compare_LONGITUDE"
        - - "compare_LOAD_TIME"
          - "compare_LOAD_TIME"
        indicatorColumn: "Indicator"
    Filter 2:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "Filter 2"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "N"
        combineCondition: "Or"
    Filter 2 2:
      type: "filter"
      sources:
      - "Detect Changes"
      parameters:
        componentName: "Filter 2 2"
        filterConditions:
        - - "Indicator"
          - "Is"
          - "Equal to"
          - "C"
        combineCondition: "Or"
    Calculator:
      type: "calculator"
      sources:
      - "Filter 2"
      parameters:
        componentName: "Calculator"
        includeInputColumns: "Yes"
        calculations:
        - - "NULL"
          - "V_END_TIME_NEW"
        - - "CURRENT_TIMESTAMP()"
          - "V_LOAD_TIME_NEW"
    Calculator 2:
      type: "calculator"
