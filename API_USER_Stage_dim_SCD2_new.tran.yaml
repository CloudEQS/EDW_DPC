        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
        - "CITY"
        - "BS"
        - "CATCHPHRASE"
        - "STREET"
