          - "END_TIME"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Unite:
      type: "unite"
      sources:
      - "SQL"
      - "Filter 2 2"
      parameters:
        componentName: "Unite"
        method: "All Columns"
        castTypes: "Yes"
        addSourceComponentColumn: "No"
        removeDuplicates: "No"
    Rank 2:
      type: "rank"
      sources:
      - "Unite"
      parameters:
        componentName: "Rank 2"
        includeInputColumns: "Yes"
        partitionData:
        - "EMP_ID"
        orderingWithinPartitions:
