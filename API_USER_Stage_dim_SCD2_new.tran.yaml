      parameters:
        componentName: "SQL"
        query: "SELECT * FROM EDW_LAB.PUBLIC.DIM_USER_DETAILS_SCD2 WHERE END_TIME\
          \ IS NULL"
    Detect Changes:
      type: "detect-changes"
      sources:
      - "SQL"
      - "Filter"
      parameters:
        componentName: "Detect Changes"
        masterTable: "SQL"
        matchKeys:
        - "WEBSITE"
        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
