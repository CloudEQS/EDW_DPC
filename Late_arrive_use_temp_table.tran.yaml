type: "transformation"
version: "1.0"
pipeline:
  components:
    STG_FACT_SALES:
      type: "table-input"
      parameters:
        componentName: "STG_FACT_SALES"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "STG_FACT_SALES"
        columnNames:
        - "SALES_ID"
        - "PRODUCT_ID"
        - "SALES_AMOUNT"
        - "SALES_TIME"
        timeOffset:
    DIM_PRODUCT_SCD2:
      type: "table-input"
      parameters:
        componentName: "DIM_PRODUCT_SCD2"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_PRODUCT_SCD2"
        columnNames:
        - "PRODUCT_ID"
        - "LOAD_TIME"
        - "END_TIME"
        timeOffset:
    Not Exists:
      type: "filter"
      sources:
      - "Check the dim key in Dimention table"
      parameters:
        componentName: "Not Exists"
        filterConditions:
        - - "IS_EARLY"
          - "Is"
          - "Equal to"
          - "TRUE"
        combineCondition: "And"
    Exists:
      type: "filter"
      sources:
      - "Check the dim key in Dimention table"
      parameters:
        componentName: "Exists"
        filterConditions:
        - - "IS_EARLY"
          - "Is"
          - "Equal to"
          - "FALSE"
        combineCondition: "And"
    FACT_SALES:
      type: "table-output"
      sources:
      - "ON TIME PROCESS DATA"
      parameters:
        componentName: "FACT_SALES"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "FACT_SALES"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "SALES_ID"
          - "SALES_ID"
        - - "stg_PRODUCT_ID"
          - "PRODUCT_ID"
        - - "SALES_AMOUNT"
          - "SALES_AMOUNT"
        - - "SALES_TIME"
          - "SALES_TIME_V"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    AUDIT_LATE_SALES:
      type: "table-output"
      sources:
      - "Late arrived"
      parameters:
        componentName: "AUDIT_LATE_SALES"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "AUDIT_LATE_SALES"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "SALES_ID"
          - "SALES_ID"
        - - "stg_PRODUCT_ID"
          - "PRODUCT_ID"
        - - "SALES_AMOUNT"
          - "SALES_AMOUNT"
        - - "SALES_TIME"
          - "SALES_TIME"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Join:
      type: "join"
      sources:
      - "STG_FACT_SALES"
      - "DIM_PRODUCT_SCD2"
      parameters:
        componentName: "Join"
        mainTable: "STG_FACT_SALES"
        mainTableAlias: "stg"
        joins:
        - - "DIM_PRODUCT_SCD2"
          - "dim"
          - "Left"
        joinExpressions:
        - - "\"stg\".\"PRODUCT_ID\"=\"dim\".\"PRODUCT_ID\" and \"stg\".\"SALES_TIME\"\
            > \"dim\".\"LOAD_TIME\"AND\"dim\".\"END_TIME\" IS NULL"
          - "stg_Left_dim"
        columnMappings:
        - - "stg.SALES_ID"
          - "SALES_ID"
        - - "stg.PRODUCT_ID"
          - "stg_PRODUCT_ID"
        - - "stg.SALES_AMOUNT"
          - "SALES_AMOUNT"
        - - "stg.SALES_TIME"
          - "SALES_TIME"
        - - "dim.PRODUCT_ID"
          - "dim_PRODUCT_ID"
        - - "dim.LOAD_TIME"
          - "LOAD_TIME"
        - - "dim.END_TIME"
          - "END_TIME"
    Check the dim key in Dimention table:
      type: "calculator"
      sources:
      - "Join"
      parameters:
        componentName: "Check the dim key in Dimention table"
        includeInputColumns: "Yes"
        calculations:
        - - "CASE \r\nWHEN \"dim_PRODUCT_ID\" IS NULL THEN 'TRUE'\r\nELSE\r\n'FALSE'\r\
            \nEND"
          - "IS_EARLY"
    Check EARLY FACT:
      type: "calculator"
      sources:
      - "Join the Dimenstion and Fact if Dimenstion exists"
      parameters:
        componentName: "Check EARLY FACT"
        includeInputColumns: "Yes"
        calculations:
        - - "CASE WHEN \"SALES_TIME\"> \"Last_processed_time\" THEN \r\n   'TRUE'\r\
            \nELSE\r\n    'FALSE'\r\nEND"
          - "ON_TIME_DATA"
    LAST_PROCESSED_TIME:
      type: "sql"
      sources:
      - "Exists"
      parameters:
        componentName: "LAST_PROCESSED_TIME"
        query: "SELECT MAX(SALES_TIME_V) AS MAX_TME FROM EDW_LAB.PUBLIC.FACT_SALES "
    ON TIME PROCESS DATA:
      type: "filter"
      sources:
      - "Check EARLY FACT"
      parameters:
        componentName: "ON TIME PROCESS DATA"
        filterConditions:
        - - "ON_TIME_DATA"
          - "Is"
          - "Equal to"
          - "TRUE"
        combineCondition: "And"
    Join the Dimenstion and Fact if Dimenstion exists:
      type: "join"
      sources:
      - "Exists"
      - "LAST_PROCESSED_TIME"
      parameters:
        componentName: "Join the Dimenstion and Fact if Dimenstion exists"
        mainTable: "Exists"
        mainTableAlias: "on"
        joins:
        - - "LAST_PROCESSED_TIME"
          - "l"
          - "Left"
        joinExpressions:
        - - "\"on\".\"stg_PRODUCT_ID\"=\"on\".\"dim_PRODUCT_ID\""
          - "on_Left_l"
        columnMappings:
        - - "l.MAX_TME"
          - "Last_processed_time"
        - - "on.SALES_ID"
          - "SALES_ID"
        - - "on.stg_PRODUCT_ID"
          - "stg_PRODUCT_ID"
        - - "on.SALES_AMOUNT"
          - "SALES_AMOUNT"
        - - "on.SALES_TIME"
          - "SALES_TIME"
        - - "on.dim_PRODUCT_ID"
          - "dim_PRODUCT_ID"
        - - "on.LOAD_TIME"
          - "LOAD_TIME"
        - - "on.END_TIME"
          - "END_TIME"
        - - "on.IS_EARLY"
          - "IS_EARLY"
    AUDIT_LATE_SALES 2:
      type: "table-output"
      sources:
      - "Not Exists"
      parameters:
        componentName: "AUDIT_LATE_SALES 2"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "AUDIT_LATE_SALES"
        fixDataTypeMismatches: "No"
        columnMapping:
        - - "SALES_ID"
          - "SALES_ID"
        - - "stg_PRODUCT_ID"
          - "PRODUCT_ID"
        - - "SALES_AMOUNT"
          - "SALES_AMOUNT"
        - - "SALES_TIME"
          - "SALES_TIME"
        orderBy:
        outputMode: "Append"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Late arrived:
      type: "filter"
      sources:
      - "Check EARLY FACT"
      parameters:
        componentName: "Late arrived"
        filterConditions:
        - - "ON_TIME_DATA"
          - "Is"
          - "Equal to"
          - "FALSE"
        combineCondition: "And"
