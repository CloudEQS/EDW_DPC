        WHEN "STG_SALES_TIME"> "FACT_Last_processed_time" THEN DIRECTLY MOVE INTO THE TARGET TABLE, OTHERWISE FAILES AND STORING ISSUE RECORD STORING TO AUIT OR TEMPP TABLE FOR FURTHER WE ANALYSE
