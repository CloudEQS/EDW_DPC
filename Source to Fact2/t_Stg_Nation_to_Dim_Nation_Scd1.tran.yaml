type: "transformation"
version: "1.0"
pipeline:
  components:
    STAGE_NATION:
      type: "table-input"
      parameters:
        componentName: "STAGE_NATION"
        database: "EDW_LAB"
        schema: "STAGE_SCHEMA"
        targetTable: "STAGE_NATION"
        columnNames:
        - "N_NATIONKEY"
        - "N_NAME"
        - "N_REGIONKEY"
        - "N_COMMENT"
        - "N_START_TIME"
        timeOffset:
    Load Date:
      type: "calculator"
      sources:
      - "STAGE_NATION"
      parameters:
        componentName: "Load Date"
        includeInputColumns: "Yes"
        calculations:
        - - "CURRENT_DATE()"
          - "v_load_date"
    DIM_NATION_SCD1:
      type: "table-update"
      sources:
      - "Load Date"
      parameters:
        componentName: "DIM_NATION_SCD1"
        warehouse: "[Environment Default]"
        database: "ANALYTICS_DB"
        schema: "ANALYTICS_SCHEMA"
        targetTable: "DIM_NATION_SCD1"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"N_NATIONKEY\"=\"target\".\"N_NATIONKEY\""
          - "Case"
        whenMatched:
        - - "\"input\".\"N_NATIONKEY\"=\"target\".\"N_NATIONKEY\""
          - "Update"
        updateMapping:
        - - "N_NATIONKEY"
          - "N_NATIONKEY"
        - - "N_NAME"
          - "N_NAME"
        - - "N_REGIONKEY"
          - "N_REGIONKEY"
        - - "N_COMMENT"
          - "N_COMMENT"
        - - "v_load_date"
          - "N_LOAD_DATE"
        includeNotMatched: "Yes"
        insertMapping:
        - - "N_NATIONKEY"
          - "N_NATIONKEY"
        - - "N_NAME"
          - "N_NAME"
        - - "N_REGIONKEY"
          - "N_REGIONKEY"
        - - "N_COMMENT"
          - "N_COMMENT"
        - - "v_load_date"
          - "N_LOAD_DATE"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
design:
  components:
    STAGE_NATION:
      position:
        x: -620
        "y": -40
      tempMetlId: 1
    Load Date:
      position:
        x: -370
        "y": -40
      tempMetlId: 3
    DIM_NATION_SCD1:
      position:
        x: -80
        "y": -40
      tempMetlId: 10
