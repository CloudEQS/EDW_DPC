type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Log Started"
      parameters:
        componentName: "Start"
    Log Started:
      type: "sql-executor"
      transitions:
        success:
        - "Run Transformation"
      parameters:
        componentName: "Log Started"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "INSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG(LOAD_ID,JOB_NAME,TABLE_NAME,STATUS,START_TIME)\r\
          \nVALUES('${sysvar.thisPipeline.executionId}','${jv_job_name}','${jv_table_name}','STARTRED',CURRENT_TIMESTAMP)"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Transformation:
      type: "run-transformation"
      transitions:
        success:
        - "Log Completed"
        failure:
        - "Log Failed"
      parameters:
        componentName: "Run Transformation"
        transformationJob: "Source to Fact/${jv_job_name}"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage: "${jv_job_name} is Runnning Present"
        updateScalarVariables:
        - - "v_error_message"
          - "${sysvar.thisComponent.message}"
        - - "jv_updated_rows"
          - "${sysvar.childPipeline.vars.jv_updated_rows}"
        - - "jv_inserted_rows"
          - "${sysvar.childPipeline.vars.jv_inserted_rows}"
    Log Completed:
      type: "sql-executor"
      parameters:
        componentName: "Log Completed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "\r\nINSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG(LOAD_ID,JOB_NAME,TABLE_NAME,INSERTED_ROWS,UPDATED_ROWS,STATUS,END_TIME)\r\
          \nvalues('${sysvar.thisPipeline.executionId}','${jv_job_name}','${jv_table_name}',\r\
          \n'${jv_inserted_rows}','${jv_updated_rows}','Completed Successfully',CURRENT_TIMESTAMP)\r\
          \n\r\n"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Log Failed:
      type: "sql-executor"
      parameters:
        componentName: "Log Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include all"
        sqlScript: "INSERT INTO EDW_LAB.STAGE_SCHEMA.LOAD_LOG(LOAD_ID,JOB_NAME,TABLE_NAME,INSERTED_ROWS,UPDATED_ROWS,STATUS,END_TIME,ERROR_MESSAGE)\r\
          \nvalues('${sysvar.thisPipeline.executionId}','${jv_job_name}','${jv_table_name}',\r\
          \n${jv_inserted_rows},${jv_updated_rows},'Failed',CURRENT_TIMESTAMP,'${jv_error_message}')"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_row_count:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
    jv_updated_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
    v_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_inserted_rows:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "-1"
    jv_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "t_Stg_Region_to_Dim_Region_Scd1"
    jv_table_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "ABC"
design:
  components:
    Start:
      position:
        x: -1080
        "y": 50
      tempMetlId: 1
    Log Started:
      position:
        x: -890
        "y": 50
      tempMetlId: 2
    Run Transformation:
      position:
        x: -770
        "y": 50
      tempMetlId: 3
    Log Completed:
      position:
        x: -630
        "y": 0
      tempMetlId: 4
    Log Failed:
      position:
        x: -630
        "y": 170
      tempMetlId: 5
