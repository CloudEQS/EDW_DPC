type: "orchestration"
version: "1.0"
pipeline:
  components:
    Update control table:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Update control table"
        sqlScript: |-
          UPDATE ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          SET RUN_STATUS = 'Y'
          WHERE RUN_STATUS = 'N'
          AND ACTIVE_STATUS = 'Y'
          AND SUBJECT_AREA = 'GNA'
    Or 1:
      type: "or"
      transitions:
        unconditional:
        - "Update_run_status 0"
      skipped: false
      parameters:
        componentName: "Or 1"
    Or 2:
      type: "or"
      transitions:
        unconditional:
        - "Start new load"
      skipped: false
      parameters:
        componentName: "Or 2"
    GNA Jobs:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "GNA Jobs"
        orchestrationJob: "${jv_control_job_name}"
        setScalarVariables:
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_curr_run_dt"
          - "${jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_error_message"
          - "${sysvar.childPipeline.vars.jv_error_message}"
    setting success flag run_status fail:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status fail"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 0 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    Grid Iterator 0:
      type: "grid-iterator"
      transitions:
        success:
        - "setting success flag run_status"
        failure:
        - "Or 0"
      iterationTarget: "GNA Jobs"
      skipped: false
      parameters:
        componentName: "Grid Iterator 0"
        gridVariable: "gv_control_table"
        gridIteratorVariableMapping:
        - - "gv_control_job_name"
          - "jv_control_job_name"
        breakOnFailure: "Yes"
        concurrency: "Sequential"
    Check last run dt:
      type: "query-to-scalar"
      transitions:
        success:
        - "Check current run dt"
      skipped: false
      parameters:
        componentName: "Check last run dt"
        mode: "Advanced"
        query: |-
          SELECT IFNULL(LAST_RUN_DATE, '${jv_last_run_dt}') AS LAST_RUN_DATE FROM EDP_CURATED.ADHOC_RUN
          WHERE SUBJECT_AREA = 'GNA'
        scalarVariableMapping:
        - - "jv_last_run_dt"
          - "LAST_RUN_DATE"
    Main ETL Log Entry RE-Start:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry RE-Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for GANDA Load RE-Started')"
    Error_log_insert 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "setting success flag run_status fail"
      skipped: false
      parameters:
        "1": "Error_log_insert 0"
        "2":
        - "1":
          - - "gv_error_log"
        - "1":
          - - "gv_load_id"
            - "gv_job_name"
            - "gv_job_parent"
            - "gv_table_name"
            - "gv_table_type"
            - "gv_error_rows"
            - "gv_subject_area"
            - "gv_process_date"
            - "gv_start_time"
            - "gv_run_history_id"
            - "gv_status"
            - "gv_error_message"
    Update_run_status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "Main ETL Log Entry Complete"
      skipped: false
      parameters:
        "1": "Update_run_status 0"
        "2": "${jv_subject_area}"
        "3": "${jv_success_flag}"
        "4": "${jv_load_id}"
    Main ETL Log Entry Start:
      type: "sql-script"
      transitions:
        success:
        - "Update control table"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for GANDA Load Started')"
    Main ETL Log Entry Complete:
      type: "sql-script"
      transitions:
        success:
        - "If 0"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Complete"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,SUCCESS_FLAG,END_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',${jv_success_flag},current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for GANDA Load Completed');\n \n delete from ${ev_edp_curated_schema}.load_log\
          \ where LOAD_ID = -1 and PROCEDURE_NAME = '-1';\n \n  UPDATE ${ev_edp_curated_schema}.ADHOC_RUN\
          \ SET LAST_RUN_DATE = NULL, CURRENT_RUN_DATE = NULL\n  WHERE SUBJECT_AREA\
          \ = 'GNA';"
    Check_run_status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "Check last run dt"
        failure:
        - "Or 0"
      skipped: false
      parameters:
        "1": "Check_run_status 0"
        "2": "${jv_subject_area}"
        "3": "1970-01-01 00:00:00"
        "4": "1970-01-01 00:00:00"
        "5": "-1"
        "6": "2021-01-01"
        "7": "0"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Check_run_status 0"
      skipped: false
      parameters:
        componentName: "Start 0"
    setting success flag run_status:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 1 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    If 0:
      type: "if"
      transitions:
        "true":
        - "End Success 0"
        "false":
        - "End Failure 0"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_success_flag"
          - "Is"
          - "Equal to"
          - "1"
        combineConditions: "And"
    If 1:
      type: "if"
      transitions:
        "true":
        - "Main ETL Log Entry Start"
        "false":
        - "Main ETL Log Entry RE-Start"
      skipped: false
      parameters:
        componentName: "If 1"
        mode: "Simple"
        condition:
        - - "jv_restart_check"
          - "Is"
          - "Equal to"
          - "0"
        combineConditions: "And"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Append To Grid error log for main job:
      type: "append-to-grid"
      transitions:
        success:
        - "Error_log_insert 0"
      skipped: false
      parameters:
        componentName: "Append To Grid error log for main job"
        operation: "Append"
        targetGridVariable: "gv_error_log"
        fixedGridMode: "Fixed"
        valuesGrid:
        - - "${jv_load_id}"
          - "${sysvar.thisPipeline.fullName}"
          - "-1"
          - "-1"
          - "-1"
          - "0"
          - "0"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "${jv_status}"
          - "${jv_error_message}"
          - "0"
          - "0"
          - "-1"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Or 0:
      type: "or"
      transitions:
        unconditional:
        - "Append To Grid error log for main job"
      skipped: false
      parameters:
        componentName: "Or 0"
    Check current run dt:
      type: "query-to-scalar"
      transitions:
        success:
        - "If 1"
      skipped: false
      parameters:
        componentName: "Check current run dt"
        mode: "Advanced"
        query: |-
          SELECT IFNULL(CURRENT_RUN_DATE, '${jv_curr_run_dt}') AS CURR_RUN_DATE FROM EDP_CURATED.ADHOC_RUN
          WHERE SUBJECT_AREA = 'GNA'
        scalarVariableMapping:
        - - "jv_curr_run_dt"
          - "CURR_RUN_DATE"
    Start new load:
      type: "query-to-grid"
      transitions:
        success:
        - "Grid Iterator 0"
      skipped: false
      parameters:
        componentName: "Start new load"
        mode: "Advanced"
        query: |-
          SELECT JOB_NAME from ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          WHERE RUN_STATUS = 'Y' AND ACTIVE_STATUS = 'Y' AND SUBJECT_AREA = 'GNA' ORDER BY JOB_SEQ
        gridVariable: "gv_control_table"
        gridVariableMapping:
        - - "JOB_NAME"
          - "gv_control_job_name"
  variables:
    jv_status:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "None"
    jv_load_id:
