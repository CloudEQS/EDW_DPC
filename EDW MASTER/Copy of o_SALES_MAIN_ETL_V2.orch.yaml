type: "orchestration"
version: "1.0"
pipeline:
  components:
    Or 1:
      type: "or"
      transitions:
        unconditional:
        - "Update_run_status 0"
      skipped: false
      parameters:
        componentName: "Or 1"
    Or 2:
      type: "or"
      transitions:
        unconditional:
        - "Load_start 0"
      skipped: false
      parameters:
        componentName: "Or 2"
    setting success flag run_status fail:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status fail"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 0 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    Main ETL Log Entry RE-Start:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: true
      parameters:
        componentName: "Main ETL Log Entry RE-Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for ${jv_subject_area} RE-Started')"
    Error_log_insert 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "setting success flag run_status fail"
      skipped: false
      parameters:
        "1": "Error_log_insert 0"
        "2":
        - "1":
          - - "gv_error_log"
        - "1":
          - - "gv_load_id"
            - "gv_job_name"
            - "gv_job_parent"
            - "gv_table_name"
            - "gv_table_type"
            - "gv_error_rows"
            - "gv_subject_area"
            - "gv_process_date"
            - "gv_start_time"
            - "gv_run_history_id"
            - "gv_status"
            - "gv_error_message"
    Update_run_status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "Main ETL Log Entry Complete"
      skipped: false
      parameters:
        "1": "Update_run_status 0"
        "2": "${jv_subject_area}"
        "3": "${jv_success_flag}"
        "4": "${jv_load_id}"
    Main ETL Log Entry Start:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: true
      parameters:
        componentName: "Main ETL Log Entry Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for ${jv_subject_area} Started')"
    Main ETL Log Entry Complete:
      type: "sql-script"
      transitions:
        success:
        - "If 0"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Complete"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,SUCCESS_FLAG,END_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',${jv_success_flag},current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for GANDA Load Completed');\n \n delete from ${ev_edp_curated_schema}.load_log\
          \ where LOAD_ID = -1 and PROCEDURE_NAME = '-1';\n \n  UPDATE ${ev_edp_curated_schema}.ADHOC_RUN\
          \ SET LAST_RUN_DATE = NULL, CURRENT_RUN_DATE = NULL\n  WHERE SUBJECT_AREA\
          \ = 'SALES';"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "001-Check_job_status_V2 0"
        - "Check_Job_Status 0"
      skipped: false
      parameters:
        componentName: "Start 0"
    setting success flag run_status:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 1 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    If 0:
      type: "if"
      transitions:
        "true":
        - "End Success 0"
        "false":
        - "End Failure 0"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_success_flag"
          - "Is"
          - "Equal to"
          - "1"
        combineConditions: "And"
    If 1:
      type: "if"
      transitions:
        "true":
        - "Main ETL Log Entry Start"
        "false":
        - "Main ETL Log Entry RE-Start"
      skipped: false
      parameters:
        componentName: "If 1"
        mode: "Simple"
        condition:
        - - "jv_restart_check"
          - "Is"
          - "Equal to"
          - "0"
        combineConditions: "And"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Append To Grid error log for main job:
      type: "append-to-grid"
      transitions:
        success:
        - "Error_log_insert 0"
      skipped: false
      parameters:
        componentName: "Append To Grid error log for main job"
        operation: "Append"
        targetGridVariable: "gv_error_log"
        fixedGridMode: "Fixed"
        valuesGrid:
        - - "${jv_load_id}"
          - "${sysvar.thisPipeline.fullName}"
          - "-1"
          - "-1"
          - "-1"
          - "0"
          - "0"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "${jv_status}"
          - "${jv_error_message}"
          - "0"
          - "0"
          - "-1"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Or 0:
      type: "or"
      transitions:
        unconditional:
        - "Append To Grid error log for main job"
      skipped: false
      parameters:
        componentName: "Or 0"
    Check_Job_Status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "If 1"
        failure:
        - "Or 0"
      skipped: true
      parameters:
        "1": "Check_Job_Status 0"
        "2": "${jv_subject_area}"
        "3": "-1"
        "4": "1970-01-01 00:00:00"
        "5": "1970-01-01 00:00:00"
        "6": "2021-01-01"
        "7": "0"
    And 0:
      type: "and"
      transitions:
        unconditional:
        - "setting success flag run_status"
      skipped: false
      parameters:
        componentName: "And 0"
    "001_Load_start 0":
      type: "run-orchestration"
      transitions:
        success:
        - "And 0"
      skipped: false
      parameters:
        componentName: "001_Load_start 0"
        orchestrationJob: "EDW SHARED/001_Load_start"
        setScalarVariables:
        - - "jv_curr_run_dt"
          - "${jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_job_group"
          - "1"
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        setGridVariables:
    Load_start 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "And 0"
      skipped: true
      parameters:
        "1": "Load_start 0"
        "2": "${jv_load_id}"
        "3": "1"
        "4": "${jv_curr_run_dt}"
        "5": "${jv_last_run_dt}"
        "6": "${jv_process_date}"
        "7": "${jv_subject_area}"
        "8": ""
        "9": ""
        "10":
        "11": "${jv_job_parent}"
    "001-Check_job_status_V2 0":
      type: "run-orchestration"
      transitions:
        success:
        - "001_Load_start 0"
      skipped: false
      parameters:
        componentName: "001-Check_job_status_V2 0"
        orchestrationJob: "EDW SHARED/001-Check_job_status_V2"
        setScalarVariables:
        - - "jv_subject_area"
          - "${jv_subject_area}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_restart_check"
          - "${sysvar.childPipeline.vars.jv_restart_check}"
        - - "jv_load_id"
          - "${sysvar.childPipeline.vars.jv_load_id}"
        - - "jv_process_date"
          - "${sysvar.childPipeline.vars.jv_process_date}"
        - - "jv_curr_run_dt"
          - "${sysvar.childPipeline.vars.jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${sysvar.childPipeline.vars.jv_last_run_dt}"
