type: "orchestration"
version: "1.0"
pipeline:
  components:
    setting success flag run_status fail:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status fail"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 0 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Check_run_status 0"
      skipped: false
      parameters:
        componentName: "Start 0"
    setting success flag run_status:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "setting success flag run_status"
        mode: "Advanced"
        query: |-
          /* Note: this query will be run as a subquery for the purposes of sampling the data.
             As such it will be restricted by any subquery limitations specified by the current platform. */
             select 1 as success_flag
        scalarVariableMapping:
        - - "jv_success_flag"
          - "SUCCESS_FLAG"
    Update_run_status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "Main ETL Log Entry Complete"
      skipped: false
      parameters:
        "1": "Update_run_status 0"
        "2": "${jv_subject_area}"
        "3": "${jv_success_flag}"
        "4": "${jv_load_id}"
    Error_log_insert 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "setting success flag run_status fail"
      skipped: false
      parameters:
        "1": "Error_log_insert 0"
        "2":
        - "1":
          - - "gv_error_log"
        - "1":
          - - "gv_load_id"
            - "gv_job_name"
            - "gv_job_parent"
            - "gv_table_name"
            - "gv_table_type"
            - "gv_error_rows"
            - "gv_subject_area"
            - "gv_process_date"
            - "gv_start_time"
            - "gv_run_history_id"
            - "gv_status"
            - "gv_error_message"
    If 0:
      type: "if"
      transitions:
        "true":
        - "End Success 0"
        "false":
        - "End Failure 0"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_success_flag"
          - "Is"
          - "Equal to"
          - "1"
        combineConditions: "And"
    Or 1:
      type: "or"
      transitions:
        unconditional:
        - "Update_run_status 0"
      skipped: false
      parameters:
        componentName: "Or 1"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Append To Grid error log for main job:
      type: "append-to-grid"
      transitions:
        success:
        - "Error_log_insert 0"
      skipped: false
      parameters:
        componentName: "Append To Grid error log for main job"
        operation: "Append"
        targetGridVariable: "gv_error_log"
        fixedGridMode: "Fixed"
        valuesGrid:
        - - "${jv_load_id}"
          - "${sysvar.thisPipeline.fullName}"
          - "-1"
          - "-1"
          - "-1"
          - "0"
          - "0"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "${jv_status}"
          - "${jv_error_message}"
          - "0"
          - "0"
          - "-1"
    Main ETL Log Entry Complete:
      type: "sql-script"
      transitions:
        success:
        - "If 0"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Complete"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,SUCCESS_FLAG,END_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',${jv_success_flag},current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for CCT Incremental Load Completed Successfully');\n \n  delete from\
          \ ${ev_edp_curated_schema}.load_log where LOAD_ID = -1 and PROCEDURE_NAME\
          \ = '-1';"
    Check_run_status 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "If 1"
        failure:
        - "Or 0"
      skipped: false
      parameters:
        "1": "Check_run_status 0"
        "2": "${jv_subject_area}"
        "3": "1970-01-01 00:00:00"
        "4": "1970-01-01 00:00:00"
        "5": "-1"
        "6": "2021-01-01"
        "7": "0"
    Or 0:
      type: "or"
      transitions:
        unconditional:
        - "Append To Grid error log for main job"
      skipped: false
      parameters:
        componentName: "Or 0"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Copy of Grid Iterator:
      type: "grid-iterator"
      transitions:
        success:
        - "Start load grp 3"
        failure:
        - "Or 0"
      iterationTarget: "o_CCT_CALL_ETL"
      skipped: false
      parameters:
        componentName: "Copy of Grid Iterator"
        gridVariable: "gv_date"
        gridIteratorVariableMapping:
        - - "gv_last_run_dt"
          - "jv_last_run_dt"
        - - "gv_curr_run_dt"
          - "jv_curr_run_dt"
        - - "gv_seq"
          - "jv_seq"
        breakOnFailure: "No"
        concurrency: "Sequential"
    o_CCT_CALL_ETL:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "o_CCT_CALL_ETL"
        orchestrationJob: "EDW MASTER/o_CCT_CALL_ETL"
        setScalarVariables:
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_curr_run_dt"
          - "${jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_last_run_dt}"
        - - "jv_act_curr_run_dt"
          - "${jv_act_curr_run_dt}"
        - - "jv_act_last_run_dt"
          - "${jv_act_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        - - "jv_restart_check"
          - "${jv_restart_check}"
        - - "jv_seq"
          - "${jv_seq}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_error_message"
          - "${sysvar.childPipeline.vars.jv_error_message}"
    Copy of Grid Iterator 0 (1):
      type: "grid-iterator"
      transitions:
        success:
        - "Python Script 0"
      iterationTarget: "CCT Jobs grp 1"
      skipped: false
      parameters:
        componentName: "Copy of Grid Iterator 0 (1)"
        gridVariable: "gv_control_table"
        gridIteratorVariableMapping:
        - - "gv_control_job_name"
          - "jv_control_job_name"
        breakOnFailure: "Yes"
        concurrency: "Sequential"
    Python Script 0:
      type: "python-script"
      transitions:
        success:
        - "Copy of Grid Iterator"
        failure:
        - "Or 0"
      skipped: false
      parameters:
        componentName: "Python Script 0"
        script: "###\n# Variables are directly accessible: \n#   print (myvar)\n#\
          \ Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\n\n\
          #context.updateVariable('jv_no_of_days', (jv_curr_run_dt-jv_last_run_dt).days)\n\
          #print(type(jv_no_of_days))\ndates = []\n#datetime.datetime.strptime(x,\
          \ \"%Y-%m-%d %H:%M:%S:%f\")\nlast_date = str(jv_last_run_dt).split(' ')[0]\n\
          last_date = datetime.datetime.strptime(last_date, '%Y-%m-%d')\ncurr_date\
          \ = str(jv_curr_run_dt).split(' ')[0]\ncurr_date = datetime.datetime.strptime(curr_date,\
          \ '%Y-%m-%d')\n\nloop = (jv_curr_run_dt-last_date).days\nprint(loop)\n\n\
          for i in range(0,loop):\n  print(last_date + datetime.timedelta(days=i),last_date\
          \ + datetime.timedelta(days=i+1))\n  dates.append([str(last_date + datetime.timedelta(days=i)),str(last_date\
          \ + datetime.timedelta(days=i+1)),f\"{i+1}\"])\n  \ncontext.updateGridVariable('gv_date',\
          \ dates)  \n\n#print (context.getGridVariable('gv_date'))\nprint(dates)\n\
          context.updateVariable('jv_curr_run_dt', str(curr_date))\n#print (str(jv_curr_run_dt))\n\
          #print (str(jv_last_run_dt))"
        interpreter: "Python 3"
        timeout: "360"
    CCT Jobs grp 1:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "CCT Jobs grp 1"
        orchestrationJob: "${jv_control_job_name}"
        setScalarVariables:
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_curr_run_dt"
          - "${jv_act_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_act_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_error_message"
          - "${sysvar.childPipeline.vars.jv_error_message}"
    Start load grp 1:
      type: "query-to-grid"
      transitions:
        success:
        - "Copy of Grid Iterator 0 (1)"
      skipped: false
      parameters:
        componentName: "Start load grp 1"
        mode: "Advanced"
        query: |-
          SELECT JOB_NAME from ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          WHERE RUN_STATUS = 'Y' AND ACTIVE_STATUS = 'Y' AND SUBJECT_AREA = 'CCT' AND JOB_GROUP = 1 ORDER BY JOB_SEQ
        gridVariable: "gv_control_table"
        gridVariableMapping:
        - - "JOB_NAME"
          - "gv_control_job_name"
    Copy of Grid Iterator 0 (3):
      type: "grid-iterator"
      transitions:
        success:
        - "setting success flag run_status"
      iterationTarget: "CCT Jobs grp 3"
      skipped: false
      parameters:
        componentName: "Copy of Grid Iterator 0 (3)"
        gridVariable: "gv_control_table"
        gridIteratorVariableMapping:
        - - "gv_control_job_name"
          - "jv_control_job_name"
        breakOnFailure: "Yes"
        concurrency: "Sequential"
    CCT Jobs grp 3:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "CCT Jobs grp 3"
        orchestrationJob: "${jv_control_job_name}"
        setScalarVariables:
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_curr_run_dt"
          - "${jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_error_message"
          - "${sysvar.childPipeline.vars.jv_error_message}"
    Main ETL Log Entry RE-Start:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry RE-Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for CCT Load RE-Started')"
    Start load grp 3:
      type: "query-to-grid"
      transitions:
        success:
        - "Copy of Grid Iterator 0 (3)"
      skipped: false
      parameters:
        componentName: "Start load grp 3"
        mode: "Advanced"
        query: |-
          SELECT JOB_NAME from ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          WHERE RUN_STATUS = 'Y' AND ACTIVE_STATUS = 'Y' AND SUBJECT_AREA = 'CCT' AND JOB_GROUP = 3 ORDER BY JOB_SEQ
        gridVariable: "gv_control_table"
        gridVariableMapping:
        - - "JOB_NAME"
          - "gv_control_job_name"
    If 1:
      type: "if"
      transitions:
        "true":
        - "Main ETL Log Entry Start"
        "false":
        - "Main ETL Log Entry RE-Start"
      skipped: false
      parameters:
        componentName: "If 1"
        mode: "Simple"
        condition:
        - - "jv_restart_check"
          - "Is"
          - "Equal to"
          - "0"
        combineConditions: "And"
    Or 2:
      type: "or"
      transitions:
        unconditional:
        - "Start load grp 1"
      skipped: false
      parameters:
        componentName: "Or 2"
    Main ETL Log Entry Start:
      type: "sql-script"
      transitions:
        success:
        - "Update control table"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for CCT Incremental Load Started')"
    Update control table:
      type: "sql-script"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Update control table"
        sqlScript: |-
          UPDATE ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          SET RUN_STATUS = 'Y'
          WHERE RUN_STATUS = 'N'
          AND ACTIVE_STATUS = 'Y'
          AND SUBJECT_AREA = 'CCT'
    Check_Job_Status 0:
      type: "unknown-orchestration"
      skipped: false
      parameters:
        "1": "Check_Job_Status 0"
        "2": "${jv_subject_area}"
        "3": "-1"
        "4": "1970-01-01 00:00:00"
        "5": "1970-01-01 00:00:00"
        "6": "2021-01-01"
        "7": "0"
