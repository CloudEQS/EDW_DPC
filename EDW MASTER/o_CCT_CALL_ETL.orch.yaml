type: "orchestration"
version: "1.0"
pipeline:
  components:
    Error_log_insert 0:
      type: "unknown-orchestration"
      transitions:
        success:
        - "End Failure 0"
      skipped: false
      parameters:
        "1": "Error_log_insert 0"
        "2":
        - "1":
          - - "gv_error_log"
        - "1":
          - - "gv_load_id"
            - "gv_job_name"
            - "gv_job_parent"
            - "gv_table_name"
            - "gv_table_type"
            - "gv_error_rows"
            - "gv_subject_area"
            - "gv_process_date"
            - "gv_start_time"
            - "gv_run_history_id"
            - "gv_status"
            - "gv_error_message"
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Main ETL Log Entry Start"
      skipped: false
      parameters:
        componentName: "Start 0"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    Append To Grid error log for main job:
      type: "append-to-grid"
      transitions:
        success:
        - "Error_log_insert 0"
      skipped: false
      parameters:
        componentName: "Append To Grid error log for main job"
        operation: "Append"
        targetGridVariable: "gv_error_log"
        fixedGridMode: "Fixed"
        valuesGrid:
        - - "${jv_load_id}"
          - "${sysvar.thisPipeline.fullName}"
          - "-1"
          - "-1"
          - "-1"
          - "0"
          - "0"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "${jv_status}"
          - "${jv_error_message}"
          - "0"
          - "0"
          - "-1"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Or 0:
      type: "or"
      transitions:
        unconditional:
        - "Append To Grid error log for main job"
      skipped: false
      parameters:
        componentName: "Or 0"
    Main ETL Log Entry Start:
      type: "sql-script"
      transitions:
        success:
        - "Update control table"
      skipped: false
      parameters:
        componentName: "Main ETL Log Entry Start"
        sqlScript: "insert into ${ev_edp_curated_schema}.load_log \n(LOAD_ID,PROCEDURE_NAME,PROCEDURE_PARENT,TABLE_NAME,TABLE_TYPE,SUBJECT_AREA,\n\
          \ PROCESS_DATE,START_TIME,\n FROMDATEPARAMETER,TODATEPARAMETER,COMMENTS)\n\
          \ \n Values\n\n(${jv_load_id},'${sysvar.thisPipeline.fullName}','None','None','None','${jv_subject_area}',\n\
          \ '${jv_process_date}',current_timestamp(),\n '${jv_last_run_dt}','${jv_curr_run_dt}','MASTER\
          \ ETL for CCT Incremental Load Started')"
    Update control table:
      type: "sql-script"
      transitions:
        success:
        - "Start load grp 2 only"
      skipped: false
      parameters:
        componentName: "Update control table"
        sqlScript: |-
          UPDATE ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          SET RUN_STATUS = 'Y'
          WHERE RUN_STATUS = 'N'
          AND ACTIVE_STATUS = 'Y'
          AND SUBJECT_AREA = 'CCT'
    CCT Jobs grp 2 only:
      type: "run-orchestration"
      skipped: false
      parameters:
        componentName: "CCT Jobs grp 2 only"
        orchestrationJob: "${jv_control_job_name}"
        setScalarVariables:
        - - "jv_job_parent"
          - "${sysvar.thisPipeline.fullName}"
        - - "jv_subject_area"
          - "${jv_subject_area}"
        - - "jv_curr_run_dt"
          - "${jv_curr_run_dt}"
        - - "jv_last_run_dt"
          - "${jv_last_run_dt}"
        - - "jv_load_id"
          - "${jv_load_id}"
        - - "jv_process_date"
          - "${jv_process_date}"
        setGridVariables:
      postProcessing:
        updateScalarVariables:
        - - "jv_error_message"
          - "${sysvar.childPipeline.vars.jv_error_message}"
    Start load grp 2 only:
      type: "query-to-grid"
      transitions:
        success:
        - "Copy of Grid Iterator 0 (1)"
      skipped: false
      parameters:
        componentName: "Start load grp 2 only"
        mode: "Advanced"
        query: |-
          SELECT JOB_NAME from ${ev_edp_curated_schema}.JOB_CONTROL_TABLE
          WHERE RUN_STATUS = 'Y' AND ACTIVE_STATUS = 'Y' AND SUBJECT_AREA = 'CCT' AND JOB_GROUP = 2 ORDER BY JOB_SEQ
        gridVariable: "gv_control_table"
        gridVariableMapping:
        - - "JOB_NAME"
          - "gv_control_job_name"
    Copy of Grid Iterator 0 (1):
      type: "grid-iterator"
      transitions:
        success:
        - "End Success 0"
        failure:
        - "Or 0"
      iterationTarget: "CCT Jobs grp 2 only"
      skipped: false
      parameters:
        componentName: "Copy of Grid Iterator 0 (1)"
        gridVariable: "gv_control_table"
        gridIteratorVariableMapping:
        - - "gv_control_job_name"
          - "jv_control_job_name"
        breakOnFailure: "Yes"
        concurrency: "Sequential"
