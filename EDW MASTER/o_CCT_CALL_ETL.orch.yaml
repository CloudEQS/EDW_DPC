  notes:
    "4684":
      position:
        x: 682
        "y": -98
      size:
        height: 388
        width: 362
      theme: "yellow"
      content: |-
        **"Check run status"** - This is a reusable component which checks whether any previous job is completed/failed then only moves forward otherwise fails.

        **"Update control tables"** - This component sets job_status column in control table to 'Y'.

        **"Start new load"** - This component reads control table gets job name column and sets it into gv_control_table grid variable

        **"Grid iterator/CCTA jobs"** - This component iterates on the job names received from gv_control_table  grid variable
        and executes them in sequential manner.

        **"Setting success flag run_status"** - This component will set jv_run_status variable to 1 on job success and sets it to 0 on job failure.

        **"Update_run_status"** - This is a reusable component which updates job status to success on job success and to failure when job fails and also updates the job end time in run status table.

        **"Append To Grid error log for main job"** - This component appends required values to gv_error_log grid variable when job fails.

        **"Error_log_insert"** - This is a reusable component to write failed entry to error log table.
