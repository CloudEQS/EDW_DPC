type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start 0:
      type: "start"
      transitions:
        unconditional:
        - "Read source objects"
      skipped: false
      parameters:
        componentName: "Start 0"
    If 0:
      type: "if"
      transitions:
        "true":
        - "Alter Warehouse Inc"
        "false":
        - "Or 0"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_detail_code"
          - "Is"
          - "Equal to"
          - "Wharehouse_size"
        combineConditions: "And"
    Read table metadata 1:
      type: "query-to-grid"
      transitions:
        success:
        - "Database Query advance mode"
      skipped: false
      parameters:
        componentName: "Read table metadata 1"
        mode: "Basic"
        gridVariable: "gv_table_creator"
        gridVariableMapping:
        - - "DATA_TYPE"
          - "data_type"
        - - "FIELD_NAME"
          - "field_name"
        database: "EDW_LAB"
        schema: "PUBLIC"
        table: "SOURCE_OBJECT_METADATA"
        tableColumns:
        - "SOURCE_SYSTEM_ID"
        - "SOURCE_OBJECT_ID"
        - "FIELD_NAME"
        - "DATA_TYPE"
        orderBy:
        sort: "Ascending"
        limit: "100"
        filterConditions:
        - - "SOURCE_OBJECT_ID"
          - "Is"
          - "Equal to"
          - "1"
        - - "SOURCE_SYSTEM_ID"
          - "Is"
          - "Equal to"
          - "1"
        combineConditions: "And"
    Read source objects:
      type: "query-to-grid"
      transitions:
        success:
        - "Python Pushdown 2"
      skipped: false
      parameters:
        componentName: "Read source objects"
        mode: "Basic"
        gridVariable: "gv_source_object_details"
        gridVariableMapping:
        - - "DETAIL_CODE"
          - "detail_code"
        - - "DETAIL_VALUE"
          - "detail_value"
        database: "EDW_LAB"
        schema: "FRAMEWORK"
        table: "SOURCE_OBJECT_DETAILS"
        tableColumns:
        - "DETAIL_CODE"
        - "DETAIL_VALUE"
        orderBy:
        sort: "Ascending"
        limit: "100"
        filterConditions:
        - - "SOURCE_SYSTEM_ID"
          - "Is"
          - "Equal to"
          - "${jv_source_system_id}"
        combineConditions: "And"
    End Failure 0:
      type: "end-failure"
      skipped: false
      parameters:
        componentName: "End Failure 0"
    Path for Append:
      type: "if"
      transitions:
        "true":
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Path for Append"
        mode: "Simple"
        condition:
        - - "jv_refresh_type"
          - "Is"
          - "Equal to"
          - "Append"
        combineConditions: "And"
    Alter Warehouse Dec:
      type: "alter-warehouse"
      transitions:
        success:
        - "End Success 0"
      skipped: false
      parameters:
        componentName: "Alter Warehouse Dec"
        warehouse: "${jv_wharehouse_name}"
        commandType: "Set"
        properties:
        - - "WAREHOUSE_SIZE"
          - "XSMALL"
    Or 1:
      type: "or"
      transitions:
        unconditional:
        - "Python Pushdown 3"
      skipped: false
      parameters:
        componentName: "Or 1"
    Or 0:
      type: "or"
      transitions:
        unconditional:
        - "Read table metadata 1"
      skipped: false
      parameters:
        componentName: "Or 0"
    Database Query advance mode:
      type: "database-query"
      transitions:
        success:
        - "Path for Append"
        - "Path for Merge 0"
        failure:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "Database Query advance mode"
        basicAdvancedMode: "Advanced"
        databaseType: "Snowflake"
        connectionUrl: "jdbc:snowflake://https://kha80474.snowflakecomputing.com"
        username: ""
        password: "sf_m_password"
        connectionOptions:
        - - "warehouse"
          - "compute_wh"
        - - "database"
          - "INTERNAL_TRAINING"
        sqlQuery: |
          select * from SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER limit 100;
        type: "Standard"
        primaryKeys:
        warehouse1: "WH_ETL"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "${jv_refresh_type == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type\
          \ == 'Append' ? jv_target_table +'_TMP' : jv_target_table}"
        stage1: "[Custom]"
        stagePlatform: "Snowflake Managed"
        loadOptions:
        - "On"
        - "Off"
        - "On"
        - ""
        - "On"
        - "Gzip"
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
          - "${sysvar.thisComponent.status}"
        - - "jv_end_time"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
        - - "jv_start_time"
          - "${sysvar.thisComponent.startedAt}"
        - - "jv_message"
          - "${sysvar.thisComponent.message}"
    End Success 0:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 0"
    If 1:
      type: "if"
      transitions:
        "true":
        - "Alter Warehouse Dec"
        "false":
        - "End Success 1"
      skipped: false
      parameters:
        componentName: "If 1"
        mode: "Simple"
        condition:
        - - "jv_detail_code"
          - "Is"
          - "Equal to"
          - "Wharehouse_size"
        combineConditions: "And"
    Path for Merge 0:
      type: "if"
      transitions:
        "true":
        - "Get business key 0"
      skipped: false
      parameters:
        componentName: "Path for Merge 0"
        mode: "Simple"
        condition:
        - - "jv_refresh_type"
          - "Is"
          - "Equal to"
          - "Merge"
        combineConditions: "And"
    Alter Warehouse Inc:
      type: "alter-warehouse"
      transitions:
        success:
        - "Or 0"
      skipped: false
      parameters:
        componentName: "Alter Warehouse Inc"
        warehouse: "${jv_wharehouse_name}"
        commandType: "Set"
        properties:
        - - "WAREHOUSE_SIZE"
          - "MEDIUM"
    End Success 1:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 1"
    Get business key 0:
      type: "query-to-scalar"
      transitions:
        success:
        - "Or 2"
      skipped: false
      parameters:
        componentName: "Get business key 0"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select Field_name from\
          \ ${ev_sf_database_lab}.FRAMEWORK.Source_Object_Metadata som\n   right join\
          \ ${ev_sf_database_lab}.FRAMEWORK.Source_Objects so \n   on som.SOURCE_OBJECT_ID\
          \ = so.SOURCE_OBJECT_ID and som.Source_System_id = so.Source_System_id\n\
          \   where so.Target_table = '${jv_target_table}' and som.Business_key ='Y'"
        scalarVariableMapping:
        - - "jv_business_key"
          - "FIELD_NAME"
    Or 2:
      type: "or"
      transitions:
        unconditional:
        - "Python Pushdown"
      skipped: false
      parameters:
        componentName: "Or 2"
    Run Shared Pipeline:
      type: "run-shared-pipeline"
      transitions:
        success:
        - "End Failure 0"
      parameters:
        componentName: "Run Shared Pipeline"
        pipelineName: "EDW_LAB#Error_log_o"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_error_log"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_error_log"
              columns:
              - "gv_load_id"
              - "gv_job_name"
              - "gv_job_parent"
              - "gv_table_name"
              - "gv_table_type"
              - "gv_error_rows"
              - "gv_subject_area"
              - "gv_process_date"
              - "gv_start_time"
              - "gv_run_history_id"
              - "gv_status"
              - "gv_message"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown:
      type: "python-pushdown"
      transitions:
        success:
        - "SQL Script"
      parameters:
        componentName: "Python Pushdown"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "merge_query_string = \"MERGE INTO \"\ninsert_query_string =\
          \ \"INSERT INTO\"\ntable_name = jv_target_table\ncolumn_string = \"\"\n\
          update_string = \"\"\ninsert_string = \"\"\nbusiness_key_col = jv_business_key\n\
          dynamic_query_string = \"\"\nrefresh_type = jv_refresh_type\narray = context.getGridVariable('gv_table_creator')\n\
          \nif refresh_type == \"Merge\":\n  for data in array:\n      insert_string\
          \ += f'{table_name}_TMP.\"{data[1]}\",'\n\n  insert_string = insert_string.rstrip(',')\n\
          \n  for data in array:\n      column_string += f'\"{data[1]}\",'\n\n  column_string\
          \ = column_string.rstrip(',')  \n\n  for data in array:\n      update_string\
          \ += f'{table_name}.\"{data[1]}\" = {table_name}_TMP.\"{data[1]}\",'\n\n\
          \  update_string = update_string.rstrip(',')   \n\n  merge_query_string\
          \ = f'{merge_query_string} {table_name} USING  {table_name}_TMP ON {table_name}.\"\
          {business_key_col}\" = {table_name}_TMP.\"{business_key_col}\" WHEN MATCHED\
          \ THEN UPDATE SET {update_string} WHEN NOT MATCHED THEN INSERT ({column_string})\
          \ VALUES ({insert_string})' \n\n  print (merge_query_string)\n\n  context.updateVariable(\"\
          dynamic_query_str\", merge_query_string)\n\n  \nif refresh_type == \"Append\"\
          :\n\n  for data in array:\n      column_string += f'\"{data[1]}\",'\n\n\
          \  column_string = column_string.rstrip(',')    \n\n  insert_query_string\
          \ = f'{insert_query_string}  {table_name} ({column_string}) Select  {column_string}\
          \ from  {table_name}_TMP'\n\n  print (insert_query_string)\n\n  context.updateVariable(\"\
          dynamic_query_str\", insert_query_string)\n"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown 2:
      type: "python-pushdown"
      transitions:
        success:
        - "If 0"
      parameters:
        componentName: "Python Pushdown 2"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible: \n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\nprint(jv_object_name)\n\
          print(jv_object_type)\nprint(jv_refresh_frequency)\nprint(jv_refresh_type)\n\
          print(jv_source_custom_query)\nprint(jv_source_object_id)\nprint(jv_source_system_code)\n\
          print(jv_source_system_id)\nprint(jv_target_table)\nprint(jv_wharehouse_name)\n\
          print(merge_str)\n\n\nSource_Object_Details = gv_source_object_details\n\
          print(Source_Object_Details)\n\n\nif Source_Object_Details != None:\n  for\
          \ array in Source_Object_Details:\n    if array[0] == 'Wharehouse_size':\n\
          \      context.updateVariable('jv_wharehouse_name', array[1])\n      context.updateVariable('jv_detail_code',\
          \ array[0])\n    print(jv_wharehouse_name,jv_detail_code)"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Python Pushdown 3:
      type: "python-pushdown"
      transitions:
        success:
        - "Run Shared Pipeline"
      parameters:
        componentName: "Python Pushdown 3"
        warehouse: "[Environment Default]"
        externalAccessIntegrations:
        pythonVersion: "3.10"
        packagesGrid:
        scriptLocation: "Component"
        pythonScript: "###\n# Variables are directly accessible: \n#   print (myvar)\n\
          # Updating a variable:\n#   context.updateVariable('myvar', 'new-value')\n\
          # Grid Variables are accessible via the context:\n#   print (context.getGridVariable('mygridvar'))\n\
          # Updating a grid variable:\n#   context.updateGridVariable('mygridvar',\
          \ [['list','of'],['lists','!']])\n# A database cursor can be accessed from\
          \ the context (Jython only):\n#   cursor = context.cursor()\n#   cursor.execute('select\
          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\n\n\
          context.updateVariable('jv_error_message' , jv_message)\nprint(jv_error_message)"
        scriptTimeout: "360"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    SQL Script:
      type: "sql-executor"
      transitions:
        success:
        - "If 1"
      parameters:
        componentName: "SQL Script"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "${dynamic_query_str}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
