          \ count(*) from mytable')\n#   rowcount = cursor.fetchone()[0]\n###\nprint(jv_object_name)\n\
          print(jv_object_type)\nprint(jv_refresh_frequency)\nprint(jv_refresh_type)\n\
          print(jv_source_custom_query)\nprint(jv_source_object_id)\nprint(jv_source_system_code)\n\
