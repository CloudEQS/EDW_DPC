type: "orchestration"
version: "1.0"
pipeline:
  components:
    If 0:
      type: "if"
      transitions:
        "true":
        - "Alter Warehouse 0"
        "false":
        - "Read table metadata 1"
      skipped: false
      parameters:
        componentName: "If 0"
        mode: "Simple"
        condition:
        - - "jv_detail_code"
          - "Is"
          - "Equal to"
          - "Wharehouse_size"
        combineConditions: "And"
    S3 Load 1:
      type: "s3-load"
      transitions:
        success:
        - "Error rows to table 1"
        failure:
        - "Or 1"
      skipped: false
      parameters:
        componentName: "S3 Load 1"
        stage: "EXTSTG"
        pattern: "${jv_object_name}"
        encryption: "None"
        warehouse: "[Environment Default]"
        database: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable: "${jv_refresh_type == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type\
          \ == 'Append' ? jv_target_table +'_TMP' : jv_target_table}"
        loadColumns:
          fromGrid:
            variable: "gv_table_creator"
            columns:
            - "field_name"
        format: "CSV_FORMAT"
        onError: "Continue"
        sizeLimitB: ""
        purgeFiles: "False"
        truncateColumns: "False"
        forceLoad: "False"
        metadataFields:
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
          - "${sysvar.thisComponent.status}"
        - - "jv_end_time"
          - "${sysvar.thisComponent.mainTaskFinishedAt}"
        - - "jv_start_time"
          - "${sysvar.thisComponent.startedAt}"
        - - "jv_message"
          - "${sysvar.thisComponent.message}"
    Path for Merge 0:
      type: "if"
      transitions:
        "true":
        - "Append To load log 1"
      skipped: false
      parameters:
        componentName: "Path for Merge 0"
        mode: "Simple"
        condition:
        - - "jv_refresh_type"
          - "Is"
          - "Equal to"
          - "Merge"
        combineConditions: "Or"
    Alter Warehouse 0:
      type: "alter-warehouse"
      transitions:
        success:
        - "Read table metadata 0"
      skipped: false
      parameters:
        componentName: "Alter Warehouse 0"
        warehouse: "${jv_wharehouse_name}"
        commandType: "Set"
        properties:
        - - "WAREHOUSE_SIZE"
          - "MEDIUM"
    Create table from metadata 1:
      type: "create-table-v2"
      transitions:
        success:
        - "S3 Load 0"
      skipped: false
      parameters:
        componentName: "Create table from metadata 1"
        createMethod: "Replace"
        database: "EDW_LAB"
        schema: "EDP_STAGING"
        table: "${jv_refresh_type == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type\
          \ == 'Append' ? jv_target_table +'_TMP' : jv_target_table}"
        snowflakeTableType: "Permanent"
        columns:
          fromGrid:
            variable: "gv_table_creator"
            columns:
            - "field_name"
            - "data_type"
            - ""
            - ""
            - ""
            - ""
            - ""
            - ""
            - ""
        defaultDdlCollation: ""
        primaryKeys:
        clusteringKeys:
        dataRetentionTimeInDays: ""
        comment: ""
    Read table metadata 1:
      type: "query-to-grid"
      transitions:
        success:
        - "Create table from metadata 1"
      skipped: false
      parameters:
        componentName: "Read table metadata 1"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select field_name, data_type\
          \ from EDW_LAB.FRAMEWORK.SOurce_Object_metadata \n   where source_object_id\
          \ = ${jv_source_object_id} and source_system_id = ${jv_source_system_id}"
        gridVariable: "gv_table_creator"
        gridVariableMapping:
        - - "DATA_TYPE"
          - "data_type"
        - - "FIELD_NAME"
          - "field_name"
    Read table metadata 0:
      type: "query-to-grid"
      transitions:
        success:
        - "Create table from metadata"
      skipped: false
      parameters:
        componentName: "Read table metadata 0"
        mode: "Advanced"
        query: "/* Note: this query will be run as a subquery for the purposes of\
          \ sampling the data.\n   As such it will be restricted by any subquery limitations\
          \ specified by the current platform. */\n   \n   select field_name, data_type\
          \ from EDW_LAB.FRAMEWORK.SOurce_Object_metadata \n   where source_object_id\
          \ = ${jv_source_object_id} and source_system_id = ${jv_source_system_id}"
        gridVariable: "gv_table_creator"
        gridVariableMapping:
        - - "DATA_TYPE"
          - "data_type"
        - - "FIELD_NAME"
          - "field_name"
    Create table from metadata:
      type: "create-table-v2"
      transitions:
        success:
        - "S3 Load 1"
      skipped: false
      parameters:
        componentName: "Create table from metadata"
        createMethod: "Replace"
        database: "${ev_sf_database}"
        schema: "PUBLIC"
        table: "${jv_refresh_type == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type\
          \ == 'Append' ? jv_target_table +'_TMP' : jv_target_table}"
        snowflakeTableType: "Permanent"
        columns:
          fromGrid:
            variable: "gv_table_creator"
            columns:
            - "field_name"
            - "data_type"
            - ""
            - ""
            - ""
            - "field_name"
            - "field_name"
            - ""
            - ""
        defaultDdlCollation: ""
        primaryKeys:
        clusteringKeys:
        dataRetentionTimeInDays: ""
        comment: ""
    S3 Load 0:
      type: "s3-load"
      transitions:
        success:
        - "Error rows to table 0"
        failure:
        - "Or 0"
      skipped: false
      parameters:
        componentName: "S3 Load 0"
        stage: "EXTSTG"
        pattern: "${jv_object_name}"
        encryption: "None"
        warehouse: "${ev_warehouse_compute}"
        database: "${environment_database}"
        schema: "${ev_edp_staging_schema}"
        targetTable: "${jv_refresh_type == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type\
          \ == 'Append' ? jv_target_table +'_TMP' : jv_target_table}"
        loadColumns:
          fromGrid:
            variable: "gv_table_creator"
            columns:
            - "field_name"
        format: "CSV_FORMAT"
        onError: "Continue"
        sizeLimitB: ""
        purgeFiles: "False"
        truncateColumns: "False"
        forceLoad: "False"
        metadataFields:
      postProcessing:
        updateScalarVariables:
        - - "jv_status"
