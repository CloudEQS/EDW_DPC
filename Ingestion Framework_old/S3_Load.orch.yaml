          - "${job_name}"
          - "${jv_job_parent}"
          - "${jv_table_name}"
          - "${jv_table_type}"
          - "${jv_inserted_rows}"
          - "${jv_updated_rows}"
          - "${jv_subject_area}"
          - "${jv_process_date}"
          - "${jv_success_flag}"
          - "${jv_start_time}"
          - "${jv_end_time}"
          - "0"
          - "${run_history_id}"
          - "${jv_status}"
          - "${jv_error_message}"
          - "0"
          - "0"
          - "0"
          - "0"
    End Success 4:
      type: "end-success"
      skipped: false
      parameters:
        componentName: "End Success 4"
    Error rows to table 1:
      type: "sql-script"
      transitions:
        success:
        - "Path for Merge 1"
        - "Append To load log 3"
        - "Path for Append 1"
      skipped: true
      parameters:
        componentName: "Error rows to table 1"
        sqlScript: "COPY INTO ${ev_sf_database}.${ev_edp_staging_schema}.${jv_refresh_type\
          \ == 'Merge'  ? jv_target_table +'_TMP' : jv_refresh_type == 'Append' ?\
          \ jv_target_table +'_TMP' : jv_target_table} FROM\n@extstg/${jv_object_name}\n\
          --PATTERN='test_data.csv'\nfile_format = MY_CSV_FORMAT\nON_ERROR='CONTINUE'\n\
          VALIDATION_MODE=RETURN_ALL_ERRORS;\n\ninsert into ${ev_sf_database}.${ev_edp_staging_schema}.\"\
          error\" \n(select * from table(validate(${jv_refresh_type == 'Merge'  ?\
          \ jv_target_table +'_TMP' : jv_refresh_type == 'Append' ? jv_target_table\
          \ +'_TMP' : jv_target_table}, job_id => '_last')));"
    Dynamic_query_sql 1:
      type: "sql-script"
      transitions:
        success:
        - "Run Shared Pipeline 3"
      skipped: false
      parameters:
        componentName: "Dynamic_query_sql 1"
        sqlScript: "${dynamic_query_str}"
    End Success 3:
      type: "end-success"
      skipped: false
      parameters:
