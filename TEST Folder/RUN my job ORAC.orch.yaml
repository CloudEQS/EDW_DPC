type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Append To Grid 2"
      parameters:
        componentName: "Start"
    Run Orchestration:
      type: "run-orchestration"
      transitions:
        success:
        - "Mark Job Completed "
        failure:
        - "Mark Job Failed"
      parameters:
        componentName: "Run Orchestration"
        orchestrationJob: "EDW STAGE/${v_current_job_name}"
        setScalarVariables:
        - - "v_current_job_name"
          - "${v_current_job_name}"
        - - "v_current_job_seq"
          - "${v_current_job_seq}"
        - - "v_current_table_name"
          - "${v_current_table_name}"
        setGridVariables:
      postProcessing:
        updateOutputMessage: "Detailed messgae : ${v_detailed_message}"
        updateScalarVariables:
        - - "v_detailed_message"
          - "${sysvar.childPipeline.vars.v_error_message}"
        - - "jv_updated_rows"
          - "${sysvar.childPipile.vars.v_row_count}"
        - - "v_current_table_name"
          - "${sysvar.childPipeline.vars.x_table_name}"
    Mark Job Running:
      type: "sql-executor"
      transitions:
        success:
        - "Run Orchestration"
      parameters:
        componentName: "Mark Job Running"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status \r\nSET STATUS\
          \ = 'RUNNING', \r\n    START_TIME = CURRENT_TIMESTAMP(), \r\n    LAST_UPDATED\
          \ = CURRENT_TIMESTAMP(),\r\n    ERROR_MESSAGE='${v_detailed_message}'\r\n\
          WHERE job_name='${v_current_job_name}'"
      postProcessing:
        updateOutputMessage: "JOB Running : ${v_current_job_name}"
        updateScalarVariables:
    Mark Job Failed:
      type: "sql-executor"
      transitions:
        success:
        - "Append To Grid 2 2 2"
      parameters:
        componentName: "Mark Job Failed"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status \r\nSET STATUS\
          \ = 'FAILED', \r\n    END_TIME = CURRENT_TIMESTAMP(), \r\n    ERROR_MESSAGE='${v_detailed_message}'\r\
          \nWHERE job_name='${v_current_job_name}'"
      postProcessing:
        updateOutputMessage: "JOB FAILED : ${v_current_job_name}"
        updateScalarVariables:
    'Mark Job Completed ':
      type: "sql-executor"
      transitions:
        success:
        - "Append To Grid 2 2"
      parameters:
        componentName: "Mark Job Completed "
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "UPDATE INTERNAL_TRAINING.EDP_CURATED.job_status \r\nSET STATUS\
          \ = 'COMPLETED', \r\n    END_TIME = CURRENT_TIMESTAMP(), \r\n    ERROR_MESSAGE='${v_detailed_message}'\r\
          \nWHERE job_name='${v_current_job_name}'"
      postProcessing:
        updateOutputMessage: "JOB Completed : ${v_current_job_name}"
        updateScalarVariables:
    Append To Grid 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Run Shared Pipeline"
      skipped: false
      parameters:
        componentName: "Append To Grid 2"
        operation: "Append"
        targetGridVariable: "gv_load_log1"
        valuesGrid:
        - - " ${sysvar.thisComponent.taskId}"
          - "${sysvar.thisPipeline.fullName}"
          - "${sysvar.rootPipeline.executionId}"
          - "abc"
          - "table"
          - "0"
          - "0"
          - ""
          - "${new Date().toISOString()}"
          - "Y"
          - "${sysvar.thisComponent.startedAt}"
          - ""
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "Jobs running started"
          - "Log started"
          - ""
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline:
      type: "run-shared-pipeline"
      transitions:
        success:
        - "Mark Job Running"
      skipped: false
      parameters:
        componentName: "Run Shared Pipeline"
        pipelineName: "EDW_LAB#load_log_insert_orc"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_load_log"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_load_log1"
              columns:
              - "gv_load_id"
              - "gv_job_name"
              - "gv_job_parent"
              - "gv_table_name"
              - "gv_table_type"
              - "gv_inserted_rows"
              - "gv_updated_rows"
              - "gv_subject_area"
              - "gv_process_date"
              - "gv_success_flag"
              - "gv_start_time"
              - "gv_end_time"
              - "gv_row_count"
              - "gv_run_history_id"
              - "gv_status"
              - "gv_message"
              - "gv_comment"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid 2 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Run Shared Pipeline 2"
      skipped: false
      parameters:
        componentName: "Append To Grid 2 2"
        operation: "Append"
        targetGridVariable: "gv_load_log1"
        valuesGrid:
        - - " ${sysvar.thisComponent.taskId}"
          - "${sysvar.thisPipeline.fullName}"
          - "${sysvar.rootPipeline.executionId}"
          - "${v_current_table_name}"
          - "table"
          - "${sysvar..thisComponent.rowsInserted}"
          - "${sysvar..thisComponent.rowsUpdated}"
          - ""
          - "${new Date().toISOString()}"
          - "Y"
          - "${sysvar.thisComponent.startedAt}"
          - ""
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "COMPLETED"
          - "${sysvar.thisComponent.status}"
          - "${sysvar.thisComponent.message}"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Append To Grid 2 2 2:
      type: "append-to-grid"
      transitions:
        success:
        - "Run Shared Pipeline 2 2"
      skipped: false
      parameters:
        componentName: "Append To Grid 2 2 2"
        operation: "Append"
        targetGridVariable: "gv_load_log1"
        valuesGrid:
        - - " ${sysvar.thisComponent.taskId}"
          - "${sysvar.thisPipeline.fullName}"
          - "${sysvar.rootPipeline.executionId}"
          - "abc"
          - "table"
          - "0"
          - "0"
          - ""
          - "${new Date().toISOString()}"
          - "Y"
          - "${sysvar.thisComponent.startedAt}"
          - ""
          - "0"
          - "${sysvar.rootPipeline.executionId}"
          - "Started"
          - "Log started"
          - ""
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline 2 2:
      type: "run-shared-pipeline"
      skipped: false
      parameters:
        componentName: "Run Shared Pipeline 2 2"
        pipelineName: "EDW_LAB#load_log_insert_orc"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_load_log"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_load_log1"
              columns:
              - "gv_load_id"
              - "gv_job_name"
              - "gv_job_parent"
              - "gv_table_name"
              - "gv_table_type"
              - "gv_inserted_rows"
              - "gv_updated_rows"
              - "gv_subject_area"
              - "gv_process_date"
              - "gv_success_flag"
              - "gv_start_time"
              - "gv_end_time"
              - "gv_row_count"
              - "gv_run_history_id"
              - "gv_status"
              - "gv_message"
              - "gv_comment"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Run Shared Pipeline 2:
      type: "run-shared-pipeline"
      skipped: false
      parameters:
        componentName: "Run Shared Pipeline 2"
        pipelineName: "EDW_LAB#load_log_insert_orc"
        version: "[Latest]"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_load_log"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_load_log1"
              columns:
              - "gv_load_id"
              - "gv_job_name"
              - "gv_job_parent"
              - "gv_table_name"
              - "gv_table_type"
              - "gv_inserted_rows"
