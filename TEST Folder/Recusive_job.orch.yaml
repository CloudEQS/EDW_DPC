type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Run Orchestration RECURSIVE"
      parameters:
        componentName: "Start"
    Run Orchestration RECURSIVE:
      type: "run-orchestration"
      parameters:
        componentName: "Run Orchestration RECURSIVE"
        orchestrationJob: "Roopa_Jobs/Trail _Child_JOb_run_dynamically_ORAC.orch.yaml"
        setScalarVariables:
        setGridVariables:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    v_current_job_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "JOB_1"
    v_current_job_seq:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: "1"
design:
  components:
    Start:
      position:
        x: -160
        "y": 0
      tempMetlId: 1
    Run Orchestration RECURSIVE:
      position:
        x: 10
        "y": 0
      tempMetlId: 2
