type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Print Variables"
      parameters:
        componentName: "Start"
    Run Transformation:
      type: "run-transformation"
      transitions:
        success:
        - "End Success"
        failure:
        - "End Failure"
      parameters:
        componentName: "Run Transformation"
        transformationJob: "Dimentions and Fact/Load_log_scd2_trans.tran.yaml"
        setScalarVariables:
        setGridVariables:
        - variable: "gv_load_log_scd"
          status: "grid"
          gridValues:
            fromGrid:
              variable: "gv_parent_load_log_scd2"
              columns:
              - "jv_load_id"
              - "jv_job_name"
              - "jv_table_name"
              - "jv_inserted_rows"
              - "jv_updated_rows"
              - "jv_status"
              - "jv_status"
              - "jv_end_time"
              - "jv_error_message"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Failure:
      type: "end-failure"
      parameters:
        componentName: "End Failure"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    End Success:
      type: "end-success"
      parameters:
        componentName: "End Success"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      transitions:
        success:
        - "Run Transformation"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "gv_parent_load_log_scd2"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    gv_parent_load_log_scd2:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          jv_load_id:
            columnType: "TEXT"
          jv_job_name:
            columnType: "TEXT"
          jv_table_name:
            columnType: "TEXT"
          jv_inserted_rows:
            columnType: "NUMBER"
          jv_updated_rows:
            columnType: "NUMBER"
          jv_status:
            columnType: "TEXT"
          jv_start_time:
            columnType: "TEXT"
          jv_end_time:
            columnType: "TEXT"
          jv_error_message:
            columnType: "TEXT"
      defaultValue:
      - - "-1"
        - "-1"
        - "-1"
        - "-1"
        - "-1"
        - "-1"
        - "-1"
        - "-1"
        - "-1"
design:
  components:
    Start:
      position:
        x: -150
        "y": 0
      tempMetlId: 1
    Run Transformation:
      position:
        x: 160
        "y": 0
      tempMetlId: 2
    End Failure:
      position:
        x: 290
        "y": 120
      tempMetlId: 3
    End Success:
      position:
        x: 320
        "y": -120
      tempMetlId: 4
    Print Variables:
      position:
        x: -20
        "y": 0
      tempMetlId: 5
