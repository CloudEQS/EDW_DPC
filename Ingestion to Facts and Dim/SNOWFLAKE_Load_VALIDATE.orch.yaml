type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Log Running"
      parameters:
        componentName: "Start"
    Log Running:
      type: "sql-executor"
      transitions:
        success:
        - "SOURCE_TABLE EXISTS"
        - "Print Variables"
      parameters:
        componentName: "Log Running"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        sqlScript: "insert into edw_lab.public.JOB_RUN_AUDIT(BATCH_ID,run_id,JOB_NAME,Source_system_id,SOURCE_OBJECT_ID,object_name,STATUS,START_TIME)\r\
          \nvalues('${sysvar.rootPipeline.executionId}','${sysvar.thisPipeline.executionId}','${sysvar.thisPipeline.fullName}','${jv_source_system_id}','${jv_source_object_id}','${jv_object_name}','RUNNING',current_timestamp)\
          \  "
      postProcessing:
        updateOutputMessage: "Marked as Running Jobs : '${jv_source_object_name}'"
        updateScalarVariables:
    SOURCE_TABLE EXISTS:
      type: "database-query"
      transitions:
        success:
        - "Check Source Table EXISTS"
        - "CHECKING"
      parameters:
        componentName: "SOURCE_TABLE EXISTS"
        basicAdvancedMode: "Advanced"
        databaseType: "Snowflake"
        connectionUrl: "jdbc:snowflake://https://kha80474.snowflakecomputing.com"
        username: "mohanishk@cloudeqs.com"
        password: "sf_m_password"
        connectionOptions:
        sqlQuery: "SELECT TABLE_NAME\r\nFROM ${jv_tar_db}.INFORMATION_SCHEMA.TABLES\r\
          \nWHERE TABLE_CATALOG = '${jv_tar_db}'  -- keep quotes here; this is a string\
          \ comparison\r\n  AND TABLE_NAME = '${jv_target_table}'"
        fetchSize:
        type: "Standard"
        primaryKeys:
        warehouse1: "[Environment Default]"
        database: "${jv_tar_db}"
        schema: "${jv_tar_schema}"
        targetTable: "TABLE_COUNT"
        stage1: "[Custom]"
        stagePlatform: "Snowflake Managed"
        loadOptions:
        sshTunnel:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        - - "jv_tables_exists"
          - "${sysvar.thisComponent.rowCount}"
    Check Source Table EXISTS:
      type: "if"
      transitions:
        "true":
        - "Columns & Data Types Check"
        "false":
        - "Print Variables 3"
      parameters:
        componentName: "Check Source Table EXISTS"
        mode: "Simple"
        condition:
        - - "jv_tables_exists"
          - "Is"
          - "Equal to"
          - "1"
        combineConditions: "And"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    CHECKING:
      type: "print-variables"
      parameters:
        componentName: "CHECKING"
        variablesToPrint:
        - - "jv_tables_exists"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "Source Table Exist : ${jv_source_object_name}:   ${jv_tables_exists}"
        updateScalarVariables:
    Print Variables 3:
      type: "print-variables"
      parameters:
        componentName: "Print Variables 3"
        variablesToPrint:
        - - "jv_tables_exists"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "The  ${jv_source_object_name} table doesn't exists in\
          \ the ${jv_source_system_code}"
        updateScalarVariables:
    Print Variables:
      type: "print-variables"
      parameters:
        componentName: "Print Variables"
        variablesToPrint:
        - - "jv_source_object_name"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "source_system "
        updateScalarVariables:
    Columns & Data Types Check:
      type: "query-to-scalar"
      transitions:
        success:
        - "Columns & Data Types"
      parameters:
        componentName: "Columns & Data Types Check"
        mode: "Advanced"
        query: "WITH source_schema AS (\r\n    SELECT column_name, data_type\r\n \
          \   FROM information_schema.columns\r\n    WHERE table_name = '${jv_source_object_name}'\r\
          \n      AND TABLE_CATALOG  = '{$jv_src_db}'\r\n),\r\ntarget_schema AS (\r\
          \n    SELECT column_name, data_type\r\n    FROM information_schema.columns\r\
          \n    WHERE table_name = '${jv_target_table}'\r\n      AND TABLE_CATALOG\
          \  = '{$jv_tar_db}'\r\n),\r\ndiff AS (\r\n    SELECT column_name, data_type\
          \ FROM source_schema\r\n    EXCEPT\r\n    SELECT column_name, data_type\
          \ FROM target_schema\r\n\r\n    UNION\r\n\r\n    SELECT column_name, data_type\
          \ FROM target_schema\r\n    EXCEPT\r\n    SELECT column_name, data_type\
          \ FROM source_schema\r\n)\r\nSELECT\r\n    CASE \r\n        WHEN EXISTS\
          \ (SELECT 1 FROM diff) THEN 'FALSE'\r\n        ELSE 'TRUE'\r\n    END AS\
          \ columns_and_types_match\r\n"
        scalarVariableMapping:
        - - "jv_column_data_type_exists"
          - "COLUMNS_AND_TYPES_MATCH"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Columns & Data Types:
      type: "print-variables"
      parameters:
        componentName: "Columns & Data Types"
        variablesToPrint:
        - - "jv_column_data_type_exists"
        prefixText:
        includeVariableName: "No"
      postProcessing:
        updateOutputMessage: "Validating Source: ${jv_source_object_name} and Target's:\
          \ ${jv_target_table}  Columns and Corresponding thier Data types : ${jv_column_data_type_exists}"
        updateScalarVariables:
  variables:
    jv_source_connection_url:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_refresh_type:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_tar_schema:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "STAGE_SCHEMA"
    jv_tar_db:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "EDW_LAB"
    jv_column_data_type_exists:
      metadata:
        type: "TEXT"
        description: ""
        scope: "COPIED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_row_count:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_tables_exists:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_active_flage:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_source_object_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "deafult"
    jv_src_db:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "SOURCE_DB_TEST"
    jv_src_schema:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "SOURCE_SCHEMA"
    jv_source_object_type:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_source_object_id:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    jv_source_system_id:
      metadata:
        type: "NUMBER"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "1"
    jv_error_message:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_target_table:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_source_system_code:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    gv_source_object_schema:
      metadata:
        type: "GRID"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
        columns:
          gv_field_name:
            columnType: "TEXT"
          gv_data_type:
            columnType: "TEXT"
      defaultValue: []
