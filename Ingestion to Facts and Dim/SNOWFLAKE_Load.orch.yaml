        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_role:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "RL_TRAINING"
    jv_column_datatype_exist:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: ""
    jv_source_object_name:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "deafult"
    jv_src_db:
      metadata:
        type: "TEXT"
        description: ""
