        componentName: "DIM_USER_DETAILS_SCD1"
        warehouse: "[Environment Default]"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "DIM_USER_DETAILS_SCD1"
        targetAlias: "target"
        sourceAlias: "input"
        joinExpression:
        - - "\"input\".\"EMP_ID\"=\"target\".\"EMP_ID\""
          - "Case"
        whenMatched:
        - - "\"input\".\"EMP_ID\"=\"target\".\"EMP_ID\""
          - "Update"
        updateMapping:
        - - "WEBSITE"
          - "WEBSITE"
        - - "EMP_ID"
          - "EMP_ID"
        - - "EMP_NAME"
          - "EMP_NAME"
        - - "USER_NAME"
          - "USER_NAME"
        - - "COMPANY_NAME"
          - "COMPANY_NAME"
        - - "EMAIL"
          - "EMAIL"
        - - "PHONE_NUMBER"
          - "PHONE_NUMBER"
        - - "CITY"
          - "CITY"
        - - "BS"
          - "BS"
        - - "CATCHPHRASE"
          - "CATCHPHRASE"
        - - "STREET"
          - "STREET"
        - - "ZIPCODE"
          - "ZIPCODE"
        - - "SUITE"
          - "SUITE"
        - - "LATITUDE"
          - "LATITUDE"
        - - "LONGITUDE"
          - "LONGITUDE"
        - - "LOAD_TIME"
          - "LOAD_TIME"
        includeNotMatched: "Yes"
        insertMapping:
        - - "WEBSITE"
          - "WEBSITE"
        - - "EMP_ID"
          - "EMP_ID"
        - - "EMP_NAME"
          - "EMP_NAME"
        - - "USER_NAME"
          - "USER_NAME"
        - - "COMPANY_NAME"
          - "COMPANY_NAME"
        - - "EMAIL"
          - "EMAIL"
        - - "PHONE_NUMBER"
          - "PHONE_NUMBER"
        - - "CITY"
          - "CITY"
        - - "BS"
          - "BS"
        - - "CATCHPHRASE"
          - "CATCHPHRASE"
        - - "STREET"
          - "STREET"
        - - "ZIPCODE"
          - "ZIPCODE"
        - - "SUITE"
          - "SUITE"
        - - "LATITUDE"
          - "LATITUDE"
        - - "LONGITUDE"
          - "LONGITUDE"
        - - "LOAD_TIME"
          - "LOAD_TIME"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    Rank:
      type: "rank"
      sources:
      - "STG_USER_DETAILS"
      parameters:
        componentName: "Rank"
        includeInputColumns: "Yes"
        partitionData:
        - "WEBSITE"
        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
        - "CITY"
        - "BS"
        - "CATCHPHRASE"
        - "STREET"
        - "ZIPCODE"
        - "SUITE"
        - "LATITUDE"
        - "LONGITUDE"
        orderingWithinPartitions:
        - - "LOAD_TIME"
          - "Descending"
        - - "EMP_ID"
          - "Ascending"
        functions:
        - - "Row Number"
          - "RN"
    Filter:
      type: "filter"
      sources:
      - "Rank"
      parameters:
        componentName: "Filter"
        filterConditions:
        - - "RN"
          - "Is"
          - "Equal to"
          - "1"
        combineCondition: "And"
