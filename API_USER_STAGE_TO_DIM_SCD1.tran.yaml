      parameters:
        componentName: "STG_USER_DETAILS"
        database: "EDW_LAB"
        schema: "PUBLIC"
        targetTable: "STG_USER_DETAILS"
        columnNames:
        - "WEBSITE"
        - "EMP_ID"
        - "EMP_NAME"
        - "USER_NAME"
        - "COMPANY_NAME"
        - "EMAIL"
        - "PHONE_NUMBER"
        - "CITY"
